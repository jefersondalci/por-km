            <p style={{fontSize:12,color:K.muted,marginBottom:6}}>Status</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
              <button onClick={()=>setSelecionado(p=>({...p,ativo:true}))}
                style={{padding:"10px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:selecionado.ativo?K.card:K.sep,color:selecionado.ativo?K.ok:K.muted}}>
                Ativo
              </button>
              <button onClick={()=>setSelecionado(p=>({...p,ativo:false}))}
                style={{padding:"10px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,background:!selecionado.ativo?K.card:K.sep,color:!selecionado.ativo?K.err:K.muted}}>
                Bloqueado
              </button>
            </div>
            {!selecionado.vitalicio&&<>
              <p style={{fontSize:12,color:K.muted,marginBottom:6}}>Vencimento</p>
              <input type="date" value={selecionado.vencimento||""} onChange={e=>setSelecionado(p=>({...p,vencimento:e.target.value}))}
                style={{width:"100%",background:K.bg,border:"1px solid "+K.border,borderRadius:8,padding:"10px 12px",fontSize:14,color:K.text,outline:"none",boxSizing:"border-box",marginBottom:4}}/>
              <p style={{fontSize:12,color:K.muted,marginBottom:12}}>Se não informar, será 30 dias a partir de hoje</p>
            </>}
            <p style={{fontSize:12,color:K.muted,marginBottom:6}}>Observações</p>
            <input value={selecionado.observacoes||""} onChange={e=>setSelecionado(p=>({...p,observacoes:e.target.value}))}
              placeholder="Ex.: Pagou em 10/07 via PIX"
              style={{width:"100%",background:K.bg,border:"1px solid "+K.border,borderRadius:8,padding:"10px 12px",fontSize:13,color:K.text,outline:"none",boxSizing:"border-box",marginBottom:16}}/>
            <button onClick={()=>salvarUsuario(selecionado)}
              style={{width:"100%",padding:14,borderRadius:8,border:"none",background:K.ok,color:K.bg,fontSize:14,fontWeight:700,cursor:"pointer",marginBottom:8}}>
              Salvar alterações
            </button>
            <button onClick={async()=>{
              if(!window.confirm("Excluir o usuário "+selecionado.email+"? Esta ação não pode ser desfeita."))return;
              await sb.from("usuarios_controle").delete().eq("id",selecionado.id);
              setUsuarios(p=>p.filter(x=>x.id!==selecionado.id));
              setSelecionado(null);
              avisar("Usuário excluído.");
            }} style={{width:"100%",padding:12,borderRadius:8,border:"1px solid "+K.err,background:"transparent",color:K.err,fontSize:13,fontWeight:700,cursor:"pointer"}}>
              Excluir cadastro
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// -- APP PRINCIPAL ---------------------------------------------
function App(){
  const[session,setSession]=useState(null),[loading,setLoading]=useState(true);
  const[nav,setNav]=useState("dashboard");
  const[cfg,setCfg]=useState(CFG0),[turnos,setTurnos]=useState([]),[abast,setAbast]=useState([]);
  const[controle,setControle]=useState(null),[telaAdmin,setTelaAdmin]=useState(false);
  const[custosCiclos,setCustosCiclos]=useState([]);
  // Periodo compartilhado - inicializa com dia_ciclo=1, atualiza apos carregar cfg
  const[periodoIni,setPeriodoIni]=useState(calcCiclo(1).ini);
  const[periodoFim,setPeriodoFim]=useState(calcCiclo(1).fim);
  const isAdmin=session?.user?.email===ADMIN_EMAIL;

  const[online,setOnline]=useState(navigator.onLine),[pendentes,setPendentes]=useState(filaPendentes().length);
  const[usandoCopia,setUsandoCopia]=useState(false); // dados vindos da copia do celular (sem sinal)

  const aplicarCopia=(c)=>{
    setControle(c.controle||null);
    if(c.cfg){setCfg(c.cfg);const ca=calcCiclo(c.cfg.dia_ciclo||1);setPeriodoIni(ca.ini);setPeriodoFim(ca.fim);}
    setTurnos(c.turnos||[]);setAbast(c.abast||[]);setCustosCiclos(c.custos||[]);
    if((c.turnos||[]).find(turnoEstaAberto))setNav("diario");
    setUsandoCopia(true);
  };

  const carregarDados=async(uid)=>{
    setLoading(true);
    const copia=LOCAL.ler(chaveCache(uid),null);
    // sem sinal: abre com a copia do celular (inclui o que foi registrado offline)
    if(!navigator.onLine&&copia){aplicarCopia(copia);setLoading(false);return;}
    await sincronizarFila();
    setUsandoCopia(false);
    let meta={};
    try{const{data:{user}}=await sb.auth.getUser();meta=user?.user_metadata||{};}catch(e){}
    try{
      const{data:ctrl}=await sb.from("usuarios_controle").select("*").eq("user_id",uid).single();
      // completa nome/WhatsApp informados no cadastro (que nao gravaram antes da confirmacao do e-mail)
      if(ctrl&&((!ctrl.telefone&&meta.telefone)||(!ctrl.nome&&meta.nome))){
        const upd={telefone:ctrl.telefone||meta.telefone||null,nome:ctrl.nome||meta.nome||null};
        await sb.from("usuarios_controle").update(upd).eq("user_id",uid);
        Object.assign(ctrl,upd);
      }
      setControle(ctrl||null);
    }catch(e){}
    try{
      let{data:c}=await sb.from("configuracoes").select("*").eq("user_id",uid).maybeSingle();
      if(!c){
        // upsert ignora duplicata: carregarDados pode rodar 2x seguidas no login
        await sb.from("configuracoes").upsert({user_id:uid,...CFG0},{onConflict:"user_id",ignoreDuplicates:true});
        ({data:c}=await sb.from("configuracoes").select("*").eq("user_id",uid).maybeSingle());
      }
      if(c){
        setCfg(c);
        // Atualiza periodo com o dia_ciclo real do usuario
        const ca=calcCiclo(c.dia_ciclo||1);
        setPeriodoIni(ca.ini);
        setPeriodoFim(ca.fim);
      }
    }catch(e){}
    try{
      const{data:t,error:et}=await sb.from("turnos").select("*").eq("user_id",uid).order("data",{ascending:false}).order("num",{ascending:false});
      // a rede caiu no meio do carregamento: usa a copia
      if(et&&ehFalhaDeRede(et)&&copia){aplicarCopia(copia);setLoading(false);return;}
      if(t){
        setTurnos(t);
        // Se tiver turno aberto hoje, navega para o diario
        const turnoAberto=t.find(turnoEstaAberto);
        if(turnoAberto)setNav("diario");
      }
    }catch(e){console.warn("turnos:",e);}
    try{const{data:a}=await sb.from("abastecimentos").select("*").eq("user_id",uid).order("data",{ascending:false});if(a)setAbast(a);}catch(e){}
    try{const{data:cc}=await sb.from("custos_ciclo").select("*").eq("user_id",uid);if(cc)setCustosCiclos(cc);}catch(e){}
    setLoading(false);
  };

  useEffect(()=>{
    const timer=setTimeout(()=>setLoading(false),6000);
    sb.auth.getSession().then(({data:{session}})=>{
      clearTimeout(timer);setSession(session);
      if(session)carregarDados(session.user.id);else setLoading(false);
    }).catch(()=>{clearTimeout(timer);setLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{setSession(s);if(s)carregarDados(s.user.id);});
    return()=>subscription.unsubscribe();
  },[]);

  // sinal voltou: envia a fila e recarrega do servidor
  useEffect(()=>{
    _avisarFila=setPendentes;
    const voltou=async()=>{
      setOnline(true);
      const n=await sincronizarFila();
      if(n>0)avisar(n===1?"1 registro feito sem internet foi enviado.":n+" registros feitos sem internet foram enviados.");
      const{data:{session:s}}=await sb.auth.getSession();
      if(s)carregarDados(s.user.id);
    };
    const caiu=()=>setOnline(false);
    window.addEventListener("online",voltou);window.addEventListener("offline",caiu);
    return()=>{_avisarFila=null;window.removeEventListener("online",voltou);window.removeEventListener("offline",caiu);};
  },[]);

  // guarda a copia dos dados no celular sempre que mudam (inclusive o que foi feito offline)
  useEffect(()=>{
    if(session&&!loading)LOCAL.gravar(chaveCache(session.user.id),{turnos,abast,cfg,custos:custosCiclos,controle,quando:Date.now()});
  },[turnos,abast,cfg,custosCiclos,controle,session,loading]);

  const sair=async()=>{
    const n=filaPendentes().length;
    if(n>0&&!window.confirm(n+" registro(s) feitos sem internet ainda não foram enviados. Saindo agora, eles serão perdidos. Sair mesmo assim?"))return;
    if(session)LOCAL.apagar(chaveCache(session.user.id));
    salvarFila([]);
    await sb.auth.signOut();setSession(null);setTurnos([]);setAbast([]);setCfg(CFG0);setControle(null);setTelaAdmin(false);
  };

  const navItems=[
    {id:"dashboard",icon:"inicio",label:"Início"},
    {id:"diario",icon:"diario",label:"Diário"},
    {id:"combustivel",icon:"bomba",label:"Combustível"},
    {id:"comparativo",icon:"barras",label:"Comparar"},
    {id:"historico",icon:"ciclos",label:"Ciclos"},
    {id:"config",icon:"ajustes",label:"Ajustes"},
  ];

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12,background:K.bg}}>
      <Icone nome="carro" tam={36} cor={K.muted}/>
      <p style={{color:K.muted,fontSize:14}}>Carregando...</p>
    </div>
  );

  if(!session)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg}}>
      <TelaAuth onLogado={()=>sb.auth.getSession().then(({data:{session}})=>{if(session)carregarDados(session.user.id);})}/>
    </div>
  );

  if(telaAdmin&&isAdmin)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg}}>
      <AvisosGlobais/>
      <div style={{padding:"14px 16px 12px",borderBottom:"1px solid "+K.border,background:K.card,flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{fontSize:18,fontWeight:700,color:K.text,margin:0}}>Por km Admin</h1>
        <button onClick={sair} style={{background:"none",border:"none",color:K.muted,fontSize:12,cursor:"pointer"}}>Sair</button>
      </div>
      <TelaAdmin onSair={()=>setTelaAdmin(false)}/>
    </div>
  );

  const situacao=situacaoConta(controle,isAdmin);
  if(situacao!=="liberada")return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg}}>
      <TelaAguardando situacao={situacao} vencimento={controle?.vencimento} onSair={sair}/>
    </div>
  );

  return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg}}>
      <AvisosGlobais/>
      <div style={{padding:"12px 16px 10px",borderBottom:"1px solid "+K.border,background:K.card,flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{fontSize:20,fontWeight:700,color:K.text,margin:0}}>Por km <span style={{fontSize:12,color:K.muted,fontWeight:400}}>v1.7</span></h1>
        <span style={{fontSize:12,color:K.muted}}>{navItems.find(n=>n.id===nav)?.label}</span>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {isAdmin&&<button onClick={()=>setTelaAdmin(true)} style={{fontSize:12,background:K.text,color:K.bg,border:"none",borderRadius:2,padding:"4px 8px",cursor:"pointer"}}>Admin</button>}
          <button onClick={sair} style={{background:"none",border:"none",color:K.muted,fontSize:12,cursor:"pointer"}}>Sair</button>
        </div>
      </div>
      {(!online||pendentes>0||usandoCopia)&&(
        <div role="status" style={{padding:"8px 16px",background:K.text,color:K.bg,fontSize:13,lineHeight:1.4,flexShrink:0}}>
          {!online?"Sem internet · pode registrar normalmente, fica salvo no celular":usandoCopia?"Mostrando a cópia do celular · conectando...":""}
          {pendentes>0&&<b>{(!online||usandoCopia)?" · ":""}{pendentes===1?"1 registro aguardando envio":pendentes+" registros aguardando envio"}</b>}
        </div>
      )}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {nav==="dashboard"&&<TelaDashboard turnos={turnos} abastecimentos={abast} cfg={cfg} periodoIni={periodoIni} periodoFim={periodoFim} setPeriodoIni={setPeriodoIni} setPeriodoFim={setPeriodoFim} custosCiclos={custosCiclos}/>}
        {nav==="diario"&&<TelaDiario turnos={turnos} cfg={cfg} custosCiclos={custosCiclos} userId={session.user.id} onAdd={t=>setTurnos(p=>[t,...p])} onUpdate={t=>setTurnos(p=>p.map(x=>x.id===t.id?t:x))} onDelete={id=>setTurnos(p=>p.filter(x=>x.id!==id))}/>}
        {nav==="combustivel"&&<TelaCombustivel abastecimentos={abast} cfg={cfg} userId={session.user.id} onAdd={a=>setAbast(p=>[a,...p])} onUpdate={a=>setAbast(p=>p.map(x=>x.id===a.id?a:x))} onDelete={id=>setAbast(p=>p.filter(x=>x.id!==id))} periodoIni={periodoIni} periodoFim={periodoFim}/>}
        {nav==="comparativo"&&<TelaComparativo turnos={turnos} cfg={cfg}/>}
        {nav==="historico"&&<TelaHistorico turnos={turnos} abastecimentos={abast} cfg={cfg} custosCiclos={custosCiclos}/>}
        {nav==="config"&&<TelaConfig cfg={cfg} userId={session.user.id} onSalvo={c=>setCfg(c)} onSalvoCustos={cc=>setCustosCiclos(cc)}/>}
      </div>
      <nav style={{display:"flex",borderTop:"1px solid "+K.border,background:K.card,flexShrink:0,overflowX:"auto"}}>
        {navItems.map(n=>(
          <button key={n.id} onClick={()=>setNav(n.id)} aria-current={nav===n.id?"page":undefined}
            style={{flex:1,minWidth:58,minHeight:52,padding:"8px 2px 6px",background:"none",border:"none",borderTop:"2px solid "+(nav===n.id?K.text:"transparent"),cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <Icone nome={n.icon} tam={20} cor={nav===n.id?K.text:K.muted}/>
            <span style={{fontSize:11,color:nav===n.id?K.text:K.muted,fontWeight:nav===n.id?700:400,whiteSpace:"nowrap"}}>{n.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

// app instalavel e que abre sem internet (ver sw.js)
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  const registrar=()=>navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(document.readyState==="complete")registrar();else window.addEventListener("load",registrar);
}
</script>
</body>
</html>
