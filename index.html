function fmt(n,dec=2){if(n==null||isNaN(n))return"--";return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtR(n){return(n==null||isNaN(n))?"--":"R$ "+fmt(n);}
function parseN(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
function fmtHora(h){if(!h||h<=0)return"0h00m";const hh=Math.floor(h);const mm=Math.round((h-hh)*60);return hh+"h"+(mm<10?"0":"")+mm+"m";}
function horasDiff(h1,h2){if(!h1||!h2)return 0;const[a,b]=[h1,h2].map(h=>{const[hh,mm]=h.split(":").map(Number);return hh*60+mm;});return Math.max(0,(b-a)/60);}
function hoje(){return new Date().toISOString().slice(0,10);}
function dataFmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;}

function calcCiclo(dia){const d=parseInt(dia)||1,ag=new Date(),dc=ag.getDate();let ini,fim;if(dc>=d){ini=new Date(ag.getFullYear(),ag.getMonth(),d);fim=new Date(ag.getFullYear(),ag.getMonth()+1,d-1);}else{ini=new Date(ag.getFullYear(),ag.getMonth()-1,d);fim=new Date(ag.getFullYear(),ag.getMonth(),d-1);}return{ini:ini.toISOString().slice(0,10),fim:fim.toISOString().slice(0,10)};}

function gerarCiclos(dia,turnos){if(!turnos.length)return[];const d=parseInt(dia)||1;const datas=turnos.map(t=>t.data).sort();const primeira=new Date(datas[0]+"T12:00:00");const ciclos=[];let ini=new Date(primeira.getFullYear(),primeira.getMonth(),d);if(ini>primeira)ini=new Date(primeira.getFullYear(),primeira.getMonth()-1,d);for(let i=0;i<24;i++){const fim=new Date(ini.getFullYear(),ini.getMonth()+1,d-1);const iniStr=ini.toISOString().slice(0,10);const fimStr=fim.toISOString().slice(0,10);if(iniStr>hoje())break;ciclos.push({ini:iniStr,fim:fimStr,label:dataFmt(iniStr)+" -> "+dataFmt(fimStr)});ini=new Date(ini.getFullYear(),ini.getMonth()+1,d);}return ciclos.reverse();}

function calcPeriodo(turnos,abast,cfg,ini,fim,cc){cc=cc||cfg;const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);const dias=[...new Set(mes.map(t=>t.data))].length;const km_total=mes.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);const hrs_total=mes.reduce((s,t)=>s+horasDiff(t.h_i,t.h_f),0);const bruto=mes.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);const viagens=mes.reduce((s,t)=>s+parseN(t.viagens),0);const abastP=abast.filter(a=>a.data&&a.data>=ini&&a.data<=fim);let kmL=parseN(cc.autonomia)||7,precoComb=parseN(cc.preco_litro)||5;if(cfg.usar_media_comb&&abastP.length>0){kmL=abastP.reduce((s,a)=>s+parseN(a.km_rod)/Math.max(0.01,parseN(a.litros)),0)/abastP.length;precoComb=parseN([...abastP].sort((a,b)=>b.data.localeCompare(a.data))[0].preco);}const comb_total=kmL>0?(km_total/kmL)*precoComb:0;const pneu_t=km_total*(parseN(cc.pneu_total)/Math.max(1,parseN(cc.pneu_km)));const rev_t=km_total*parseN(cc.revisao_km);const emer_t=km_total*parseN(cc.emergencia_km);const fixo=parseN(cc.parcela)+parseN(cc.ipva)/12+parseN(cc.seguro)/12;const custos_var=comb_total+pneu_t+rev_t+emer_t;const custos=custos_var+fixo;return{dias,km_total,hrs_total,bruto,viagens,comb_total,pneu_t,rev_t,emer_t,fixo,custos_var,custos,lucro:bruto-custos,r_km:km_total>0?bruto/km_total:0,r_hr:hrs_total>0?bruto/hrs_total:0};}
