// -- utils ------------------------------------------------------
function fmt(n,dec=2){if(n==null||isNaN(n))return"--";return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtR(n){return(n==null||isNaN(n))?"--":"R$ "+fmt(n);}
function parseN(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
function horasDiff(h1,h2){if(!h1||!h2)return 0;const[a,b]=[h1,h2].map(h=>{const[hh,mm]=h.split(":").map(Number);return hh*60+mm;});return Math.max(0,(b-a)/60);}
function hoje(){return new Date().toISOString().slice(0,10);}
function dataFmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;}
function diaSemana(d){return["Dom","Seg","Ter","Qua","Qui","Sex","Sab"][new Date(d+"T12:00:00").getDay()];}

// -- ciclo ------------------------------------------------------
function calcCiclo(dia){
  const d=parseInt(dia)||1,ag=new Date(),dc=ag.getDate();
  let ini,fim;
  if(dc>=d){ini=new Date(ag.getFullYear(),ag.getMonth(),d);fim=new Date(ag.getFullYear(),ag.getMonth()+1,d-1);}
  else{ini=new Date(ag.getFullYear(),ag.getMonth()-1,d);fim=new Date(ag.getFullYear(),ag.getMonth(),d-1);}
  return{ini:ini.toISOString().slice(0,10),fim:fim.toISOString().slice(0,10)};
}

function gerarCiclos(dia,turnos){
  if(!turnos.length)return[];
  const d=parseInt(dia)||1;
  const datas=turnos.map(t=>t.data).sort();
  const primeira=new Date(datas[0]+"T12:00:00");
  const ciclos=[];
  let ini=new Date(primeira.getFullYear(),primeira.getMonth(),d);
  if(ini>primeira)ini=new Date(primeira.getFullYear(),primeira.getMonth()-1,d);
  for(let i=0;i<24;i++){
    const fim=new Date(ini.getFullYear(),ini.getMonth()+1,d-1);
    const iniStr=ini.toISOString().slice(0,10);
    const fimStr=fim.toISOString().slice(0,10);
    if(iniStr>hoje())break;
    ciclos.push({ini:iniStr,fim:fimStr,label:dataFmt(iniStr)+" -> "+dataFmt(fimStr)});
    ini=new Date(ini.getFullYear(),ini.getMonth()+1,d);
  }
  return ciclos.reverse();
}

// -- calculos --------------------------------------------------
function calcPeriodo(turnos,abast,cfg,ini,fim){
  const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);
  const dias=[...new Set(mes.map(t=>t.data))].length;
  const km_total=mes.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
  const hrs_total=mes.reduce((s,t)=>s+horasDiff(t.h_i,t.h_f),0);
  const bruto=mes.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const viagens=mes.reduce((s,t)=>s+parseN(t.viagens),0);
  const abastP=abast.filter(a=>a.data&&a.data>=ini&&a.data<=fim);
  let kmL=parseN(cfg.autonomia)||7,precoComb=parseN(cfg.preco_litro)||5;
  if(cfg.usar_media_comb&&abastP.length>0){
    kmL=abastP.reduce((s,a)=>s+parseN(a.km_rod)/Math.max(0.01,parseN(a.litros)),0)/abastP.length;
    precoComb=parseN([...abastP].sort((a,b)=>b.data.localeCompare(a.data))[0].preco);
  }
  const comb_total=kmL>0?(km_total/kmL)*precoComb:0;
  const pneu_t=km_total*(parseN(cfg.pneu_total)/Math.max(1,parseN(cfg.pneu_km)));
  const rev_t=km_total*parseN(cfg.revisao_km);
  const emer_t=km_total*parseN(cfg.emergencia_km);
  const dp=Math.max(1,Math.round((new Date(fim+"T12:00:00")-new Date(ini+"T12:00:00"))/(1000*60*60*24))+1);
  const fixo=(parseN(cfg.parcela)+parseN(cfg.ipva)/12+parseN(cfg.seguro)/12)*(dp/30);
  const custos_var=comb_total+pneu_t+rev_t+emer_t;
  const custos=custos_var+fixo;
  return{dias,km_total,hrs_total,bruto,viagens,comb_total,pneu_t,rev_t,emer_t,fixo,custos_var,custos,lucro:bruto-custos,ini,fim,
    r_km:km_total>0?bruto/km_total:0,r_hr:hrs_total>0?bruto/hrs_total:0};
}

function BarChart({data}){
  const max=Math.max(...data.map(d=>Math.abs(d.v)),1);
  const fB=(v)=>v>=1000?"R$"+Math.round(v/1000*10)/10+"k":"R$"+Math.round(v);

    const{error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error)toast(error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message);
    else{toast("Bem-vindo!");onLogado();}
    setLoading(false);
  };
  const recuperar=async()=>{
    if(!email)return toast("Digite seu e-mail primeiro.");

      <p style={{fontSize:11,color:K.muted,marginBottom:8}}>Iniciado as {turno.h_i} -- KM inicial: {turno.km_i}</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="KM final" type="number" value={km_f} onChange={setKmF} placeholder="76031"/>
        <InpHora label="Hora fim" value={h_f} onChange={setHF}/>
      </div>
      <SecaoApp titulo="Uber" dados={uber} setDados={setUber}/>
      <SecaoApp titulo="99" dados={nov} setDados={setNov}/>
      <SecaoApp titulo="Particular" dados={part} setDados={setPart} temBonus={false}/>
      {totalBruto>0&&(
        <div style={{marginTop:12,background:K.bg,borderRadius:2,padding:10,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,textAlign:"center"}}>
          {[["KM rodado",km>0?km+" km":"--"],["Horas",hrs>0?fmt(hrs,1)+"h":"--"],["Total bruto",fmtR(totalBruto)]].map(([l,v])=>(
            <div key={l}><div style={{fontSize:14,fontWeight:700,color:K.text}}>{v}</div><div style={{fontSize:9,color:K.muted}}>{l}</div></div>
          ))}
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:14}}>
        <Btn sec onClick={onCancelar}>Cancelar</Btn>
        <Btn onClick={()=>{
          if(!km_f||!h_f)return alert("Preencha KM final e hora fim.");
          if(totalBruto===0)return alert("Informe o bruto de pelo menos um app.");
          if(totalViagens===0)return alert("Informe o numero de viagens.");
          onSalvar({...turno,km_f:parseN(km_f),h_f,bruto:totalBruto,viagens:totalViagens,bonus:0,
            uber_bruto:parseN(uber.bruto),uber_viagens:parseN(uber.viagens),uber_bonus:parseN(uber.bonus),
            nov99_bruto:parseN(nov.bruto),nov99_viagens:parseN(nov.viagens),nov99_bonus:parseN(nov.bonus),
            part_bruto:parseN(part.bruto),part_viagens:parseN(part.viagens)});
        }} disabled={loading}>{loading?"Fechando...":"Fechar turno"}</Btn>
      </div>
    </Card>
  );
}

function FormTurnoEdit({inicial,onSalvar,onCancelar,loading,titulo}){

    <Card style={{marginBottom:14}}>
      <p style={{fontSize:13,fontWeight:600,marginBottom:4,color:K.text}}>{titulo}</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>

        <Inp label="No. turno" type="number" value={form.num} onChange={v=>setForm(f=>({...f,num:v}))}/>
        <Inp label="KM inicial" type="number" value={form.km_i} onChange={v=>setForm(f=>({...f,km_i:v}))}/>
        <Inp label="KM final" type="number" value={form.km_f} onChange={v=>setForm(f=>({...f,km_f:v}))}/>
        <InpHora label="Hora inicio" value={form.h_i} onChange={v=>setForm(f=>({...f,h_i:v}))}/>
        <InpHora label="Hora fim" value={form.h_f} onChange={v=>setForm(f=>({...f,h_f:v}))}/>
        <Inp label="Valor bruto (R$)" type="number" value={form.bruto} onChange={v=>setForm(f=>({...f,bruto:v}))}/>
        <Inp label="No. de viagens" type="number" value={form.viagens} onChange={v=>setForm(f=>({...f,viagens:v}))}/>
      </div>
      <Inp label="Bonus (R$)" type="number" value={form.bonus} onChange={v=>setForm(f=>({...f,bonus:v}))} placeholder="0"/>

        <Btn sec onClick={onCancelar}>Cancelar</Btn>
        <Btn onClick={()=>onSalvar(form)} disabled={loading}>{loading?"Salvando...":"Salvar"}</Btn>
      </div>
    </Card>
  );
}

// -- DIARIO ---------------------------------------------------
function TelaDiario({turnos,cfg,userId,onAdd,onUpdate,onDelete}){
  const[modo,setModo]=useState(null),[editando,setEditando]=useState(null);
  const[loading,setLoading]=useState(false),[aiMsg,setAiMsg]=useState(""),[loadingAI,setLoadingAI]=useState(false);
  const turnosHoje=turnos.filter(t=>t.data===hoje()).sort((a,b)=>a.num-b.num);
  const turnosAnt=turnos.filter(t=>t.data!==hoje()).sort((a,b)=>b.data.localeCompare(a.data)||a.num-b.num);
  const turnoAberto=turnosHoje.find(t=>t.km_i&&(!t.km_f||!t.bruto));

  // Medias do ciclo atual
  const ca=calcCiclo(cfg.dia_ciclo||1);
  const turnosCiclo=turnos.filter(t=>t.data&&t.data>=ca.ini&&t.data<=ca.fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);
  const totalDias=[...new Set(turnosCiclo.map(t=>t.data))].length;
  const totalKm=turnosCiclo.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
  const totalBruto=turnosCiclo.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const totalViagens=turnosCiclo.reduce((s,t)=>s+parseN(t.viagens),0);

  const calcT=(t)=>{
    const k=parseN(t.km_f)-parseN(t.km_i),h=horasDiff(t.h_i,t.h_f),b=parseN(t.bruto),bonus=parseN(t.bonus);
    const aut=parseN(cfg.autonomia)||7;
    const c=k>0?(k/aut)*parseN(cfg.preco_litro):0;
    const lucro=b-c-k*(parseN(cfg.pneu_total)/Math.max(1,parseN(cfg.pneu_km)))-k*parseN(cfg.revisao_km)-k*parseN(cfg.emergencia_km);
    return{k,h,b,bonus,lucro,r_km:k>0?b/k:0,r_hr:h>0?b/h:0};
  };

  const turnosHojeFechados=turnosHoje.filter(t=>parseN(t.km_f)>0&&parseN(t.bruto)>0);
  const resumoDia=turnosHojeFechados.reduce((acc,t)=>{
    const k=parseN(t.km_f)-parseN(t.km_i),h=horasDiff(t.h_i,t.h_f);
    return{bruto:acc.bruto+parseN(t.bruto),bonus:acc.bonus+parseN(t.bonus),km:acc.km+k,hrs:acc.hrs+h,viagens:acc.viagens+parseN(t.viagens)};
  },{bruto:0,bonus:0,km:0,hrs:0,viagens:0});
  const totDia=resumoDia.bruto+resumoDia.bonus;
  const diaRkm=resumoDia.km>0?totDia/resumoDia.km:0;
  const diaRhr=resumoDia.hrs>0?totDia/resumoDia.hrs:0;

  const abrirTurno=async(form)=>{
    setLoading(true);
    const{data,error}=await sb.from("turnos").insert({user_id:userId,data:form.data,num:parseN(form.num),km_i:parseN(form.km_i),km_f:0,h_i:form.h_i,h_f:"",bruto:0,viagens:0,bonus:0}).select().single();
    if(!error){onAdd(data);setModo(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  const fecharTurno=async(form)=>{
    setLoading(true);
    const upd={km_f:parseN(form.km_f),h_f:form.h_f,bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:0,
      uber_bruto:parseN(form.uber_bruto)||0,uber_viagens:parseN(form.uber_viagens)||0,uber_bonus:parseN(form.uber_bonus)||0,
      nov99_bruto:parseN(form.nov99_bruto)||0,nov99_viagens:parseN(form.nov99_viagens)||0,nov99_bonus:parseN(form.nov99_bonus)||0,
      part_bruto:parseN(form.part_bruto)||0,part_viagens:parseN(form.part_viagens)||0};
    const{data,error}=await sb.from("turnos").update(upd).eq("id",turnoAberto.id).select().single();
    if(!error){onUpdate(data);setModo(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  const salvarEd=async(form)=>{
    setLoading(true);
    const{data,error}=await sb.from("turnos").update({data:form.data,num:parseN(form.num),km_i:parseN(form.km_i),km_f:parseN(form.km_f),h_i:form.h_i,h_f:form.h_f,bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:parseN(form.bonus)}).eq("id",editando.id).select().single();
    if(!error){onUpdate(data);setEditando(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  const excluir=async(t)=>{
    if(!window.confirm("Excluir "+t.num+". turno de "+dataFmt(t.data)+"?"))return;
    setLoading(true);
    const{error}=await sb.from("turnos").delete().eq("id",t.id);
    if(!error)onDelete(t.id);else alert("Erro: "+error.message);
    setLoading(false);
  };
  const pedirIA=useCallback(async()=>{
    setLoadingAI(true);
    const totB=turnosHoje.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
    const totK=turnosHoje.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
    const totV=turnosHoje.reduce((s,t)=>s+parseN(t.viagens),0);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:"Consultor financeiro de motoristas. Portugues (3-4 frases). Dia: "+turnosHoje.length+" turno(s), R$"+totB.toFixed(2)+" bruto, "+totK+"km, "+totV+" viagens. Metas: R$"+cfg.meta_km+"/km, R$"+cfg.meta_hora+"/h. Avalie e de 1 dica."}]})});
      const d=await res.json();setAiMsg(d.content?.[0]?.text||"Sem resposta.");
    }catch{setAiMsg("Nao foi possivel conectar a IA.");}
    setLoadingAI(false);
  },[turnosHoje,cfg]);

  const CardTurno=({t})=>{
    const aberto=t.km_i&&(!t.km_f||!t.bruto);
    const{k,h,b,bonus,lucro,r_km,r_hr}=calcT(t);
    const okKm=r_km>=parseN(cfg.meta_km),okHr=r_hr>=parseN(cfg.meta_hora);
    return(
      <Card style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:600,color:K.text}}>{aberto?"":""}{t.num}. Turno -- {dataFmt(t.data)}</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {aberto?<span style={{fontSize:10,color:K.muted,border:"1px solid "+K.border,padding:"2px 6px",borderRadius:1}}>Em aberto</span>
              :<span style={{fontSize:10,color:lucro>0?K.ok:K.err,border:"1px solid "+(lucro>0?K.ok:K.err),padding:"2px 6px",borderRadius:1}}>{lucro>0?"v":"x"}</span>}
            <button onClick={()=>{setEditando(t);setModo(null);}} style={{fontSize:11,padding:"3px 8px",background:K.bg,border:"1px solid "+K.border,borderRadius:1,cursor:"pointer",color:K.muted}}>✏️</button>
            <button onClick={()=>excluir(t)} style={{fontSize:11,padding:"3px 8px",background:K.bg,border:"1px solid "+K.border,borderRadius:1,cursor:"pointer",color:K.err}}>✕</button>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>KM inicial / Hora inicio</span><b style={{color:K.text}}>{t.km_i} / {t.h_i||"--"}</b></div>
        {!aberto&&<>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>KM rodado / Horas</span><b style={{color:K.text}}>{k} km / {fmt(h,1)}h</b></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>Viagens / Bruto</span><b style={{color:K.text}}>{t.viagens} / {fmtR(b)}</b></div>
          {bonus>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>Bonus (nao conta no turno)</span><b style={{color:K.text}}>{fmtR(bonus)}</b></div>}
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>Lucro est.</span><b style={{color:lucro>0?K.ok:K.err}}>{fmtR(lucro)}</b></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:8,paddingTop:8,borderTop:"1px solid "+K.sep}}>
            <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"4px 6px"}}>
              <div style={{fontSize:12,fontWeight:700,color:okKm?K.ok:K.err}}>{fmtR(r_km)}/km</div>
              <div style={{fontSize:9,color:K.muted}}>meta {fmtR(parseN(cfg.meta_km))}/km</div>
            </div>
            <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"4px 6px"}}>
              <div style={{fontSize:12,fontWeight:700,color:okHr?K.ok:K.err}}>{fmtR(r_hr)}/h</div>
              <div style={{fontSize:9,color:K.muted}}>meta {fmtR(parseN(cfg.meta_hora))}/h</div>
            </div>
          </div>
        </>}
      </Card>
    );
  };

  const ResumoDiaCard=({res,rKm,rHr,tot})=>(
    <Card style={{marginBottom:12}}>
      <SecTitle t="Resumo do dia"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"8px 10px"}}>
          <div style={{fontSize:17,fontWeight:700,color:K.text}}>{fmtR(tot)}</div>
          <div style={{fontSize:10,color:K.muted}}>Bruto total c/ bonus</div>
        </div>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"8px 10px"}}>
          <div style={{fontSize:15,fontWeight:700,color:K.text}}>{res.viagens}v / {res.km}km</div>
          <div style={{fontSize:10,color:K.muted}}>{fmt(res.hrs,1)}h trabalhadas</div>
        </div>
      </div>
      {res.bonus>0&&<div style={{background:K.bg,borderRadius:1,padding:"6px 10px",marginBottom:8,display:"flex",justifyContent:"space-between",fontSize:12,border:"1px solid "+K.border}}>
        <span style={{color:K.text}}>Bonus do dia</span><b style={{color:K.text}}>{fmtR(res.bonus)}</b>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"6px"}}>
          <div style={{fontSize:13,fontWeight:700,color:rKm>=parseN(cfg.meta_km)?K.ok:K.err}}>{fmtR(rKm)}/km</div>
          <div style={{fontSize:9,color:K.muted}}>dia c/ bonus -- meta {fmtR(parseN(cfg.meta_km))}/km</div>
        </div>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"6px"}}>
          <div style={{fontSize:13,fontWeight:700,color:rHr>=parseN(cfg.meta_hora)?K.ok:K.err}}>{fmtR(rHr)}/h</div>
          <div style={{fontSize:9,color:K.muted}}>dia c/ bonus -- meta {fmtR(parseN(cfg.meta_hora))}/h</div>
        </div>
      </div>
    </Card>
  );

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      {turnosCiclo.length>0&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
          <SecTitle t="Suas medias gerais"/>
          <span style={{fontSize:10,color:K.muted}}>{dataFmt(ca.ini)} / {dataFmt(ca.fim)}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          {[["KM/dia",fmt(totalDias>0?totalKm/totalDias:0,0)+" km"],["Bruto/dia",fmtR(totalDias>0?totalBruto/totalDias:0)],["Viagens/dia",fmt(totalDias>0?totalViagens/totalDias:0,1)],["R$/km",fmtR(totalKm>0?totalBruto/totalKm:0)]].map(([l,v])=>(
            <Card key={l} style={{padding:10,textAlign:"center"}}>
              <div style={{fontSize:15,fontWeight:700,color:K.text}}>{v}</div>
              <div style={{fontSize:10,color:K.muted,marginTop:2}}>{l}</div>
            </Card>
          ))}
        </div>
      </>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <p style={{fontSize:13,fontWeight:600,color:K.text}}>Hoje, {dataFmt(hoje())}</p>
        {!turnoAberto
          ?<button onClick={()=>setModo(modo==="abrir"?null:"abrir")} style={{padding:"9px 16px",background:K.text,color:K.bg,border:"none",borderRadius:2,fontSize:13,fontWeight:600,cursor:"pointer"}}>Abrir turno</button>
          :<button onClick={()=>setModo(modo==="fechar"?null:"fechar")} style={{padding:"9px 16px",background:K.bg,color:K.text,border:"1px solid "+K.text,borderRadius:2,fontSize:13,fontWeight:600,cursor:"pointer"}}>Fechar turno</button>}
      </div>
      {modo==="abrir"&&!turnoAberto&&<FormAbrirTurno numTurno={turnosHoje.length+1} onSalvar={abrirTurno} onCancelar={()=>setModo(null)} loading={loading}/>}
      {modo==="fechar"&&turnoAberto&&<FormFecharTurno turno={turnoAberto} onSalvar={fecharTurno} onCancelar={()=>setModo(null)} loading={loading}/>}
      {editando&&<FormTurnoEdit titulo={"Editar -- "+editando.num+". turno ("+dataFmt(editando.data)+")"}
        inicial={{data:editando.data,num:editando.num,km_i:editando.km_i,km_f:editando.km_f||"",h_i:editando.h_i||"",h_f:editando.h_f||"",bruto:editando.bruto||"",viagens:editando.viagens||"",bonus:editando.bonus||""}}
        onSalvar={salvarEd} onCancelar={()=>setEditando(null)} loading={loading}/>}
      {turnosHoje.length===0&&!modo&&!editando&&(
        <div style={{textAlign:"center",padding:"24px 20px",color:K.muted,background:K.card,borderRadius:2,marginBottom:14,border:"1px solid "+K.border}}>
          <p style={{fontSize:13}}>Nenhum turno hoje ainda.</p>
          <p style={{fontSize:12,marginTop:4}}>Toque em "Abrir turno" para comecar.</p>
        </div>
      )}
      {turnosHoje.map(t=><CardTurno key={t.id} t={t}/>)}
      {turnosHojeFechados.length>0&&<ResumoDiaCard res={resumoDia} rKm={diaRkm} rHr={diaRhr} tot={totDia}/>}
      {turnosHojeFechados.length>0&&(
        <div style={{background:K.card,borderRadius:2,padding:14,marginBottom:16,border:"1px solid "+K.border}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:600,color:K.text}}>Analise do dia -- IA</span>
            <button onClick={pedirIA} disabled={loadingAI} style={{padding:"5px 10px",fontSize:11,background:K.text,color:K.bg,border:"none",borderRadius:1,cursor:"pointer",opacity:loadingAI?0.5:1}}>
              {loadingAI?"Analisando...":"Analisar"}
            </button>
          </div>
          {aiMsg?<p style={{fontSize:12,color:K.muted,lineHeight:1.7}}>{aiMsg}</p>
            :<p style={{fontSize:12,color:K.muted,fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu dia.</p>}
        </div>
      )}
      {turnosAnt.length>0&&<>
        <SecTitle t="Historico"/>
        {[...new Set(turnosAnt.map(t=>t.data))].map(data=>{
          const td=turnosAnt.filter(t=>t.data===data).sort((a,b)=>a.num-b.num);
          const fechados=td.filter(t=>parseN(t.km_f)>0&&parseN(t.bruto)>0);
          const res=fechados.reduce((acc,t)=>{
            const k=parseN(t.km_f)-parseN(t.km_i),h=horasDiff(t.h_i,t.h_f);
            return{bruto:acc.bruto+parseN(t.bruto),bonus:acc.bonus+parseN(t.bonus),km:acc.km+k,hrs:acc.hrs+h,viagens:acc.viagens+parseN(t.viagens)};
          },{bruto:0,bonus:0,km:0,hrs:0,viagens:0});
          const tot=res.bruto+res.bonus;
          const rKm=res.km>0?tot/res.km:0,rHr=res.hrs>0?tot/res.hrs:0;
          return(
            <div key={data}>
              <p style={{fontSize:11,fontWeight:700,color:K.muted,margin:"12px 0 6px",textTransform:"uppercase",letterSpacing:1}}>{dataFmt(data)}</p>
              {td.map(t=><CardTurno key={t.id} t={t}/>)}
              {fechados.length>0&&<ResumoDiaCard res={res} rKm={rKm} rHr={rHr} tot={tot}/>}
            </div>
          );
        })}
      </>}
    </div>
  );
}

// -- COMBUSTIVEL -----------------------------------------------
function FormAbast({titulo,dados,setDados,onSalvar,onCancelar,loading}){
  const isGNV=dados.tipo==="GNV";
  const quant=parseN(dados.litros);
  const kmlF=quant>0?parseN(dados.km_rod)/quant:0;
  const un=isGNV?"m3":"L";
  return(
    <Card style={{marginBottom:14}}>
      <p style={{fontSize:13,fontWeight:600,marginBottom:8,color:K.text}}>{titulo}</p>
      <Lbl c="Tipo de combustivel"/>
      <div style={{display:"flex",border:"1px solid "+K.border,borderRadius:2,overflow:"hidden",marginBottom:4}}>
        {["Gasolina","Alcool","GNV"].map(t=>(
          <button key={t} onClick={()=>setDados(f=>({...f,tipo:t}))}
            style={{flex:1,padding:"9px 4px",border:"none",cursor:"pointer",fontSize:12,background:dados.tipo===t?K.text:K.card,color:dados.tipo===t?K.bg:K.muted,fontWeight:dados.tipo===t?700:400}}>
            {t}
          </button>
        ))}
      </div>

function TelaComparativo({turnos}){
  const semanas=useMemo(()=>{
    if(!turnos.length)return[];
    const porDia={};
    turnos.forEach(t=>{
      if(!t.data)return;
      if(!porDia[t.data])porDia[t.data]={bruto:0,km:0,hrs:0,viagens:0};
      porDia[t.data].bruto+=parseN(t.bruto)+parseN(t.bonus);
      porDia[t.data].km+=parseN(t.km_f)-parseN(t.km_i);
      porDia[t.data].hrs+=horasDiff(t.h_i,t.h_f);
      porDia[t.data].viagens+=parseN(t.viagens);
    });
    const dias=Object.keys(porDia).sort();
    if(!dias.length)return[];
    const primeiro=new Date(dias[0]+"T12:00:00");
    const ultimo=new Date(dias[dias.length-1]+"T12:00:00");
    const diaSem=primeiro.getDay();
    const inicio=new Date(primeiro);
    inicio.setDate(primeiro.getDate()-(diaSem===0?6:diaSem-1));
    const sems=[];
    let s=new Date(inicio);
    while(s<=ultimo){
      const e=new Date(s);e.setDate(s.getDate()+6);
      const sStr=s.toISOString().slice(0,10),eStr=e.toISOString().slice(0,10);
      const diasSem=Object.keys(porDia).filter(d=>d>=sStr&&d<=eStr);
      if(diasSem.length>0){
        sems.push({label:dataFmt(sStr).slice(0,5)+" -> "+dataFmt(eStr).slice(0,5),ini:sStr,fim:eStr,dias:diasSem.map(d=>({data:d,...porDia[d]}))});
      }
      s=new Date(e);s.setDate(e.getDate()+1);
    }
    return sems.reverse();
  },[turnos]);
  const[semA,setSemA]=useState(0),[semB,setSemB]=useState(1),[metrica,setMetrica]=useState("r_km");
  if(semanas.length<2)return(
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center",color:K.muted,flexDirection:"column",gap:12}}>
      <p style={{fontSize:14}}>Registre pelo menos 2 semanas para comparar.</p>
    </div>
  );
  const DIAS=["Seg","Ter","Qua","Qui","Sex","Sab","Dom"];
  const getSem=(idx)=>{
    const sem=semanas[idx];if(!sem)return[];
    return sem.dias.map(d=>({ds:diaSemana(d.data),r_km:d.km>0?d.bruto/d.km:0,r_hr:d.hrs>0?d.bruto/d.hrs:0,bruto:d.bruto,viagens:d.viagens}));
  };
  const diasA=getSem(semA),diasB=getSem(semB);
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <SecTitle t="Comparar semanas"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div><Lbl c="Semana A"/>
          <select value={semA} onChange={e=>setSemA(parseInt(e.target.value))} style={{width:"100%",border:"1px solid "+K.border,borderRadius:2,padding:"9px 10px",fontSize:13,background:K.card,outline:"none",color:K.text}}>
            {semanas.map((s,i)=><option key={i} value={i}>{s.label}</option>)}
          </select></div>
        <div><Lbl c="Semana B"/>
          <select value={semB} onChange={e=>setSemB(parseInt(e.target.value))} style={{width:"100%",border:"1px solid "+K.border,borderRadius:2,padding:"9px 10px",fontSize:13,background:K.card,outline:"none",color:K.text}}>
            {semanas.map((s,i)=><option key={i} value={i}>{s.label}</option>)}
          </select></div>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["r_km","R$/km"],["r_hr","R$/hora"],["bruto","Bruto"]].map(([v,l])=>(
          <button key={v} onClick={()=>setMetrica(v)} style={{padding:"7px 10px",borderRadius:2,border:"1px solid "+K.border,background:metrica===v?K.text:K.card,color:metrica===v?K.bg:K.muted,fontSize:12,fontWeight:600,cursor:"pointer",flex:1}}>{l}</button>
        ))}
      </div>
      <Card style={{marginBottom:14}}>
        <SecTitle t={metrica==="r_km"?"R$/km":metrica==="r_hr"?"R$/hora":"Bruto"}/>
        <div style={{display:"flex",gap:4}}>
          {DIAS.map(ds=>{
            const dA=diasA.find(d=>d.ds===ds),dB=diasB.find(d=>d.ds===ds);
            const vA=dA?dA[metrica]:0,vB=dB?dB[metrica]:0,max=Math.max(vA,vB,1);
            return(
              <div key={ds} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:70}}>
                  <div style={{flex:1,height:Math.max(2,(vA/max)*65),background:K.bar,borderRadius:"1px 1px 0 0"}}/>
                  <div style={{flex:1,height:Math.max(2,(vB/max)*65),background:K.muted,borderRadius:"1px 1px 0 0"}}/>
                </div>
                <div style={{fontSize:8,color:K.muted}}>{ds}</div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:16,marginTop:10,justifyContent:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:3,background:K.bar}}/><span style={{fontSize:11,color:K.muted}}>Sem A</span></div>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:3,background:K.muted}}/><span style={{fontSize:11,color:K.muted}}>Sem B</span></div>
        </div>
      </Card>
      <Card style={{marginBottom:14}}>
        <SecTitle t={"Detalhamento -- "+(metrica==="r_km"?"R$/km":metrica==="r_hr"?"R$/hora":"Bruto")}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr 1fr",gap:4,marginBottom:6,paddingBottom:6,borderBottom:"1px solid "+K.sep}}>
          {["Dia","Sem A","Viag A","Sem B","Viag B","Dif."].map(h=><div key={h} style={{fontSize:9,fontWeight:700,color:K.muted,textAlign:"center"}}>{h}</div>)}
        </div>
        {DIAS.map(ds=>{
          const dA=diasA.find(d=>d.ds===ds),dB=diasB.find(d=>d.ds===ds);
          if(!dA&&!dB)return null;
          const vA=dA?dA[metrica]:null,vB=dB?dB[metrica]:null;
          const diff=vA&&vA>0&&vB!=null?((vB-vA)/vA)*100:null;
          return(
            <div key={ds} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr 1fr",gap:4,padding:"6px 0",borderBottom:"1px solid "+K.sep,alignItems:"center"}}>
              <div style={{fontSize:12,fontWeight:600,color:K.text,textAlign:"center"}}>{ds}</div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:K.text}}>{vA&&vA>0?fmtR(vA):"--"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,color:K.muted}}>{dA?dA.viagens+"v":"--"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:K.muted}}>{vB&&vB>0?fmtR(vB):"--"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,color:K.muted}}>{dB?dB.viagens+"v":"--"}</span></div>
              <div style={{textAlign:"center"}}>
                {diff!=null?<span style={{fontSize:10,fontWeight:700,color:diff>=0?K.ok:K.err}}>{diff>=0?"+":""}{fmt(diff,1)}%</span>:<span style={{fontSize:10,color:K.muted}}>--</span>}
              </div>
            </div>
          );
        })}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr 1fr",gap:4,paddingTop:8,marginTop:4,borderTop:"1px solid "+K.border}}>
          <div style={{fontSize:10,fontWeight:700,color:K.muted,textAlign:"center"}}>Med.</div>
          <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:K.text}}>{(()=>{const v=diasA.filter(d=>d[metrica]>0);return v.length?fmtR(v.reduce((s,d)=>s+d[metrica],0)/v.length):"--";})()}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:10,color:K.muted}}>{diasA.length?diasA.reduce((s,d)=>s+d.viagens,0)+"v":"--"}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:K.muted}}>{(()=>{const v=diasB.filter(d=>d[metrica]>0);return v.length?fmtR(v.reduce((s,d)=>s+d[metrica],0)/v.length):"--";})()}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:10,color:K.muted}}>{diasB.length?diasB.reduce((s,d)=>s+d.viagens,0)+"v":"--"}</span></div>
          <div style={{textAlign:"center"}}>{(()=>{
            const mA=diasA.filter(d=>d[metrica]>0),mB=diasB.filter(d=>d[metrica]>0);
            if(!mA.length||!mB.length)return <span style={{fontSize:10,color:K.muted}}>--</span>;
            const vA=mA.reduce((s,d)=>s+d[metrica],0)/mA.length,vB=mB.reduce((s,d)=>s+d[metrica],0)/mB.length;
            const diff=vA>0?((vB-vA)/vA)*100:0;
            return <span style={{fontSize:10,fontWeight:700,color:diff>=0?K.ok:K.err}}>{diff>=0?"+":""}{fmt(diff,1)}%</span>;
          })()}</div>
        </div>
      </Card>
    </div>
  );
}

  const[aiMsg,setAiMsg]=useState(""),[loadingAI,setLoadingAI]=useState(false);
  const[appFiltro,setAppFiltro]=useState("total");

  const extrairApp=(t,app)=>{
    const km=parseN(t.km_f)-parseN(t.km_i),hrs=horasDiff(t.h_i,t.h_f);
    if(app==="uber")return{bruto:parseN(t.uber_bruto)+parseN(t.uber_bonus),viagens:parseN(t.uber_viagens),km,hrs};
    if(app==="99")return{bruto:parseN(t.nov99_bruto)+parseN(t.nov99_bonus),viagens:parseN(t.nov99_viagens),km,hrs};
    if(app==="part")return{bruto:parseN(t.part_bruto),viagens:parseN(t.part_viagens),km,hrs};
    return{bruto:parseN(t.bruto)+parseN(t.bonus),viagens:parseN(t.viagens),km,hrs};
  };

  const calcApp=(ini,fim)=>{
    const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);
    let km_total=0,hrs_total=0,bruto=0,viagens=0;
    mes.forEach(t=>{const d=extrairApp(t,appFiltro);bruto+=d.bruto;viagens+=d.viagens;if(d.bruto>0){km_total+=d.km;hrs_total+=d.hrs;}});
    const full=calcPeriodo(turnos,abastecimentos,cfg,ini,fim);
    return{...full,bruto,viagens,km_total,hrs_total,r_km:km_total>0?bruto/km_total:0,r_hr:hrs_total>0?bruto/hrs_total:0,lucro:bruto-full.custos};
  };

  const mes=calcApp(dataIni,dataFim);
  const mesTotal=calcPeriodo(turnos,abastecimentos,cfg,dataIni,dataFim);
  const APPS=[{id:"total",label:"Total"},{id:"uber",label:"Uber"},{id:"99",label:"99"},{id:"part",label:"Particular"}];

  const semanasDociclo=(()=>{
    const ini=new Date(dataIni+"T12:00:00"),fim=new Date(dataFim+"T12:00:00");
    const semanas=[];
    let s=new Date(ini);
    while(s<=fim){
      const e=new Date(s);e.setDate(s.getDate()+6);
      const sStr=s.toISOString().slice(0,10),eStr=e>fim?fim.toISOString().slice(0,10):e.toISOString().slice(0,10);
      const v=turnos.filter(t=>t.data&&t.data>=sStr&&t.data<=eStr&&parseN(t.km_f)>0&&parseN(t.bruto)>0).reduce((a,t)=>a+extrairApp(t,appFiltro).bruto,0);
      semanas.push({l:s.getDate()+"/"+(s.getMonth()+1),v:Math.round(v)});
      s=new Date(e);s.setDate(e.getDate()+1);
    }
    return semanas;
  })();

  const pedirIA=useCallback(async()=>{
    setLoadingAI(true);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:"Consultor financeiro de motoristas. Portugues (4-5 frases). Ciclo: bruto R$"+mes.bruto.toFixed(2)+", custos R$"+mes.custos.toFixed(2)+", lucro R$"+mes.lucro.toFixed(2)+", "+mes.dias+" dias, "+mes.viagens+" viagens, "+mes.km_total+"km. R$/km:"+mes.r_km.toFixed(2)+"(meta:"+cfg.meta_km+"), R$/hora:"+mes.r_hr.toFixed(2)+"(meta:"+cfg.meta_hora+"). De 2 sugestoes praticas."}]})});
      const d=await res.json();setAiMsg(d.content?.[0]?.text||"Sem resposta.");
    }catch{setAiMsg("Nao foi possivel conectar a IA.");}
    setLoadingAI(false);
  },[mes,cfg]);

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <p style={{fontSize:12,color:K.muted}}>{mesTotal.dias} dias trabalhados</p>
            <p style={{fontSize:11,color:K.muted}}>{dataFmt(dataIni)} / {dataFmt(dataFim)}</p>
          </div>
          <button onClick={()=>setMostrarFiltro(!mostrarFiltro)} style={{padding:"6px 12px",background:mostrarFiltro?K.text:K.bg,color:mostrarFiltro?K.bg:K.text,border:"1px solid "+K.border,borderRadius:2,fontSize:12,fontWeight:600,cursor:"pointer"}}>Periodo</button>
        </div>
        {mostrarFiltro&&(
          <div style={{marginTop:10,background:K.bg,borderRadius:2,padding:12,border:"1px solid "+K.border}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><Lbl c="Data inicio"/><input type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)} style={inputStyle}/></div>
              <div><Lbl c="Data fim"/><input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)} style={inputStyle}/></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:10}}>
              {[{l:"Ciclo atual",i:ca.ini,f:ca.fim},{l:"Ult. 30d",i:(()=>{const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);})(),f:hoje()}].map(({l,i,f})=>(
                <button key={l} onClick={()=>{setDataIni(i);setDataFim(f);setMostrarFiltro(false);}} style={{padding:"7px 4px",background:K.card,border:"1px solid "+K.border,borderRadius:2,fontSize:11,color:K.text,fontWeight:600,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <Card>
          <div style={{fontSize:11,color:K.muted}}>Lucro liquido</div>
          <div style={{fontSize:22,fontWeight:700,color:mesTotal.lucro>=0?K.ok:K.err,marginTop:4}}>{fmtR(mesTotal.lucro)}</div>
          <div style={{fontSize:11,color:K.muted,marginTop:4}}>de {fmtR(mesTotal.bruto)} bruto</div>
        </Card>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Card style={{padding:10}}><div style={{fontSize:10,color:K.muted}}>Dias trabalhados</div><div style={{fontSize:17,fontWeight:700,color:K.text}}>{mesTotal.dias} dias</div></Card>
          <Card style={{padding:10}}><div style={{fontSize:10,color:K.muted}}>Viagens / KM</div><div style={{fontSize:15,fontWeight:700,color:K.text}}>{mesTotal.viagens} / {mesTotal.km_total}km</div></Card>
        </div>
      </div>
      <Card style={{marginBottom:10}}>
        <SecTitle t="Eficiencia (IE)"/>
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          {APPS.map(({id,label})=>(
            <button key={id} onClick={()=>setAppFiltro(id)}
              style={{flex:1,padding:"7px 4px",borderRadius:2,border:"1px solid "+(appFiltro===id?K.text:K.border),background:appFiltro===id?K.text:K.card,color:appFiltro===id?K.bg:K.muted,fontSize:11,fontWeight:700,cursor:"pointer"}}>
              {label}
            </button>
          ))}
        </div>
        <IEBar label="R$/km" real={mes.r_km} meta={parseN(cfg.meta_km)} valor={fmtR(mes.r_km)+"/km"}/>
        <IEBar label="R$/hora" real={mes.r_hr} meta={parseN(cfg.meta_hora)} valor={fmtR(mes.r_hr)+"/h"}/>
      </Card>
      <Card style={{marginBottom:10}}>
        <SecTitle t={"Lucro por semana -- "+APPS.find(a=>a.id===appFiltro)?.label}/>
        <BarChart data={semanasDociclo}/>
      </Card>
      <Card style={{marginBottom:10}}>
        <SecTitle t="Custos fixos"/>
        {[["Parcela do carro",mes.fixo*(parseN(cfg.parcela)/(parseN(cfg.parcela)+parseN(cfg.ipva)/12+parseN(cfg.seguro)/12||1))],["IPVA (proporcional)",parseN(cfg.ipva)/12],["Seguro (proporcional)",parseN(cfg.seguro)/12]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"7px 0",borderBottom:"1px solid "+K.sep}}><span style={{color:K.muted}}>{l}</span><b style={{color:K.text}}>{fmtR(v)}</b></div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:8,color:K.err}}><span>Total fixo</span><span>{fmtR(mes.fixo)}</span></div>
      </Card>
      <Card style={{marginBottom:10}}>
        <SecTitle t="Custos variaveis"/>
        {[["Combustivel",mes.comb_total],["Revisao e manutencao",mes.rev_t],["Pneu",mes.pneu_t],["Reserva emergencia",mes.emer_t]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"7px 0",borderBottom:"1px solid "+K.sep}}><span style={{color:K.muted}}>{l}</span><b style={{color:K.text}}>{fmtR(v)}</b></div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:8,color:K.err}}><span>Total variavel</span><span>{fmtR(mes.custos_var)}</span></div>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["Viagens/dia",mes.dias>0?fmt(mes.viagens/mes.dias,1):"--"],["Horas/dia",mes.dias>0?fmt(mes.hrs_total/mes.dias,1)+"h":"--"],["Viagens/hora",mes.hrs_total>0?fmt(mes.viagens/mes.hrs_total,2):"--"],["% comb/bruto",mes.bruto>0?fmt(mes.comb_total/mes.bruto*100,1)+"%":"--"]].map(([l,v])=>(
          <Card key={l} style={{padding:10}}><div style={{fontSize:10,color:K.muted,marginBottom:2}}>{l}</div><div style={{fontSize:17,fontWeight:700,color:K.text}}>{v}</div></Card>
        ))}
      </div>
      <div style={{background:K.card,borderRadius:2,padding:14,border:"1px solid "+K.border}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:12,fontWeight:600,color:K.text}}>Analise do ciclo -- IA</span>
          <button onClick={pedirIA} disabled={loadingAI} style={{padding:"5px 10px",fontSize:11,background:K.text,color:K.bg,border:"none",borderRadius:1,cursor:"pointer",opacity:loadingAI?0.5:1}}>{loadingAI?"Analisando...":"Analisar"}</button>
        </div>
        {aiMsg?<p style={{fontSize:12,color:K.muted,lineHeight:1.8}}>{aiMsg}</p>
          :<p style={{fontSize:12,color:K.muted,fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu ciclo.</p>}
      </div>
    </div>
  );
}

// -- ADMIN -----------------------------------------------------
function TelaAdmin({onSair}){
  const[usuarios,setUsuarios]=useState([]),[loading,setLoading]=useState(true);
  const[busca,setBusca]=useState(""),[filtro,setFiltro]=useState("todos");
  useEffect(()=>{sb.from("usuarios_controle").select("*").order("data_cadastro",{ascending:false}).then(({data})=>{if(data)setUsuarios(data);setLoading(false);});},[]);
  const toggleAtivo=async(u)=>{
    const n=!u.ativo;
    await sb.from("usuarios_controle").update({ativo:n,data_ativacao:n?new Date().toISOString():null}).eq("id",u.id);
    setUsuarios(p=>p.map(x=>x.id===u.id?{...x,ativo:n}:x));
  };
  const filtrados=usuarios.filter(u=>{
    const mb=(u.email||"").toLowerCase().includes(busca.toLowerCase())||(u.nome||"").toLowerCase().includes(busca.toLowerCase());
    const mf=filtro==="todos"||(filtro==="ativos"&&u.ativo)||(filtro==="pendentes"&&!u.ativo&&!u.admin);
    return mb&&mf;
  });
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontSize:12,color:"#AAA"}}>Gerenciar usuarios</p>
        <button onClick={onSair} style={{fontSize:12,color:"#AAA",background:"none",border:"1px solid #444",borderRadius:2,padding:"5px 10px",cursor:"pointer"}}>Voltar</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
        {[["Total",usuarios.filter(u=>!u.admin).length],["Ativos",usuarios.filter(u=>u.ativo&&!u.admin).length],["Pendentes",usuarios.filter(u=>!u.ativo&&!u.admin).length]].map(([l,v])=>(
          <div key={l} style={{background:"#222",borderRadius:2,padding:10,textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:700,color:l==="Pendentes"&&v>0?"#FF6B6B":l==="Ativos"?"#69DB7C":"#FFF"}}>{v}</div>
            <div style={{fontSize:10,color:"#888",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
      <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Buscar por nome ou e-mail"
        style={{width:"100%",border:"1px solid #333",borderRadius:2,padding:"9px 12px",fontSize:13,background:"#222",color:"#FFF",outline:"none",boxSizing:"border-box",marginBottom:10}}/>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {["todos","ativos","pendentes"].map(f=>(
          <button key={f} onClick={()=>setFiltro(f)} style={{padding:"6px 12px",borderRadius:2,border:"1px solid #333",background:filtro===f?"#FFF":"#222",color:filtro===f?"#111":"#AAA",fontSize:12,cursor:"pointer",flex:1,textTransform:"capitalize"}}>{f}</button>
        ))}
      </div>
      {loading&&<p style={{textAlign:"center",color:"#AAA",padding:20}}>Carregando...</p>}
      {filtrados.filter(u=>!u.admin).map(u=>(
        <div key={u.id} style={{background:"#1A1A1A",border:"1px solid #333",borderRadius:2,padding:12,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <div>
              <p style={{fontSize:13,fontWeight:600,color:"#FFF"}}>{u.nome||"Sem nome"}</p>
              <p style={{fontSize:11,color:"#888"}}>{u.email}</p>
              <p style={{fontSize:10,color:"#666",marginTop:2}}>Cadastro: {u.data_cadastro?new Date(u.data_cadastro).toLocaleDateString("pt-BR"):"--"}</p>
            </div>
            <button onClick={()=>toggleAtivo(u)} style={{padding:"7px 12px",borderRadius:2,border:"none",background:u.ativo?"#7B1010":"#1B4332",color:u.ativo?"#FF6B6B":"#69DB7C",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              {u.ativo?"Desativar":"Ativar"}
            </button>
          </div>
          <input defaultValue={u.observacoes||""} onBlur={e=>sb.from("usuarios_controle").update({observacoes:e.target.value}).eq("id",u.id)} placeholder="Observacoes (ex: Pagou em 10/05)"
            style={{width:"100%",border:"1px solid #333",borderRadius:2,padding:"7px 10px",fontSize:12,background:"#111",color:"#FFF",outline:"none",boxSizing:"border-box"}}/>
        </div>
      ))}
    </div>
  );
}

// -- APP PRINCIPAL ---------------------------------------------
function App(){
  const[session,setSession]=useState(null),[loading,setLoading]=useState(true);
  const[nav,setNav]=useState("dashboard");
  const[cfg,setCfg]=useState(CFG0),[turnos,setTurnos]=useState([]),[abast,setAbast]=useState([]);
  const[controle,setControle]=useState(null),[telaAdmin,setTelaAdmin]=useState(false);
  // Periodo compartilhado entre Dashboard e Combustivel
  const ca0=calcCiclo(CFG0.dia_ciclo||1);
  const[periodoIni,setPeriodoIni]=useState(ca0.ini);
  const[periodoFim,setPeriodoFim]=useState(ca0.fim);
  const isAdmin=session?.user?.email===ADMIN_EMAIL;

  const carregarDados=async(uid)=>{
    setLoading(true);
    try{const{data:ctrl}=await sb.from("usuarios_controle").select("*").eq("user_id",uid).single();setControle(ctrl||null);}catch(e){}
    try{const{data:c}=await sb.from("configuracoes").select("*").eq("user_id",uid).single();if(c)setCfg(c);}catch(e){}
    try{const{data:t}=await sb.from("turnos").select("*").eq("user_id",uid).order("data",{ascending:false}).order("num",{ascending:false});if(t)setTurnos(t);}catch(e){console.warn("turnos:",e);}
    try{const{data:a}=await sb.from("abastecimentos").select("*").eq("user_id",uid).order("data",{ascending:false});if(a)setAbast(a);}catch(e){}
    setLoading(false);
  };

  useEffect(()=>{
    const timer=setTimeout(()=>setLoading(false),6000);
    sb.auth.getSession().then(({data:{session}})=>{
      clearTimeout(timer);setSession(session);
      if(session)carregarDados(session.user.id);else setLoading(false);
    }).catch(()=>{clearTimeout(timer);setLoading(false);});
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{setSession(s);if(s)carregarDados(s.user.id);});
    return()=>subscription.unsubscribe();
  },[]);

  const sair=async()=>{await sb.auth.signOut();setSession(null);setTurnos([]);setAbast([]);setCfg(CFG0);setControle(null);setTelaAdmin(false);};

  const navItems=[
    {id:"dashboard",icon:"🏠",label:"Dashboard"},
    {id:"diario",icon:"📋",label:"Diario"},
    {id:"combustivel",icon:"⛽",label:"Combust."},
    {id:"comparativo",icon:"📊",label:"Comparar"},
    {id:"historico",icon:"📁",label:"Historico"},
    {id:"config",icon:"⚙",label:"Config."},
  ];

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12,background:K.bg}}>
      <div style={{fontSize:32,fontFamily:"Arial"}}>&#128663;</div>
      <p style={{color:K.muted,fontSize:14}}>Carregando...</p>
    </div>
  );

  if(!session)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg,fontFamily:"Georgia,serif"}}>
      <TelaAuth onLogado={()=>sb.auth.getSession().then(({data:{session}})=>{if(session)carregarDados(session.user.id);})}/>
    </div>
  );

  if(telaAdmin&&isAdmin)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:"#111",fontFamily:"Georgia,serif"}}>
      <div style={{padding:"14px 16px 12px",borderBottom:"1px solid #222",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{fontSize:18,fontWeight:700,color:"#FFF",margin:0}}>Por km Admin</h1>
        <button onClick={sair} style={{background:"none",border:"none",color:"#AAA",fontSize:12,cursor:"pointer"}}>Sair</button>
      </div>
      <TelaAdmin onSair={()=>setTelaAdmin(false)}/>
    </div>
  );

  if(controle&&!controle.ativo&&!isAdmin)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg,fontFamily:"Georgia,serif"}}>
      <TelaAguardando onSair={sair}/>
    </div>
  );

  return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg,fontFamily:"Georgia,serif"}}>
      <div style={{padding:"12px 16px 10px",borderBottom:"1px solid "+K.border,background:K.card,flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{fontSize:20,fontWeight:700,color:K.text,margin:0,fontFamily:"Georgia,serif"}}>Por km</h1>
        <span style={{fontSize:12,color:K.muted}}>{navItems.find(n=>n.id===nav)?.label}</span>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {isAdmin&&<button onClick={()=>setTelaAdmin(true)} style={{fontSize:11,background:K.text,color:K.bg,border:"none",borderRadius:2,padding:"4px 8px",cursor:"pointer"}}>Admin</button>}
          <button onClick={sair} style={{background:"none",border:"none",color:K.muted,fontSize:12,cursor:"pointer"}}>Sair</button>
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {nav==="dashboard"&&<TelaDashboard turnos={turnos} abastecimentos={abast} cfg={cfg} periodoIni={periodoIni} periodoFim={periodoFim} setPeriodoIni={setPeriodoIni} setPeriodoFim={setPeriodoFim}/>}
        {nav==="diario"&&<TelaDiario turnos={turnos} cfg={cfg} userId={session.user.id} onAdd={t=>setTurnos(p=>[t,...p])} onUpdate={t=>setTurnos(p=>p.map(x=>x.id===t.id?t:x))} onDelete={id=>setTurnos(p=>p.filter(x=>x.id!==id))}/>}
        {nav==="combustivel"&&<TelaCombustivel abastecimentos={abast} cfg={cfg} userId={session.user.id} onAdd={a=>setAbast(p=>[a,...p])} onUpdate={a=>setAbast(p=>p.map(x=>x.id===a.id?a:x))} periodoIni={periodoIni} periodoFim={periodoFim}/>}
        {nav==="comparativo"&&<TelaComparativo turnos={turnos} cfg={cfg}/>}
        {nav==="historico"&&<TelaHistorico turnos={turnos} abastecimentos={abast} cfg={cfg}/>}
        {nav==="config"&&<TelaConfig cfg={cfg} userId={session.user.id} onSalvo={c=>setCfg(c)}/>}
      </div>
      <div style={{display:"flex",borderTop:"1px solid "+K.border,background:K.card,flexShrink:0,overflowX:"auto"}}>
        {navItems.map(n=>(
          <button key={n.id} onClick={()=>setNav(n.id)}
            style={{flex:1,minWidth:52,padding:"8px 2px 6px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:18,color:nav===n.id?K.text:K.muted}}>{n.icon}</span>
            <span style={{fontSize:8,color:nav===n.id?K.text:K.muted,fontFamily:"Arial,sans-serif",fontWeight:nav===n.id?700:400,whiteSpace:"nowrap"}}>{n.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
