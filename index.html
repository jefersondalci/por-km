function fmt(n,dec=2){if(n==null||isNaN(n))return"--";return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}

function parseN(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}

function horasDiff(h1,h2){if(!h1||!h2)return 0;const[a,b]=[h1,h2].map(h=>{const[hh,mm]=h.split(":").map(Number);return hh*60+mm;});return Math.max(0,(b-a)/60);}

function calcCiclo(dia){const d=parseInt(dia)||1,ag=new Date(),dc=ag.getDate();let ini,fim;if(dc>=d){ini=new Date(ag.getFullYear(),ag.getMonth(),d);fim=new Date(ag.getFullYear(),ag.getMonth()+1,d-1);}else{ini=new Date(ag.getFullYear(),ag.getMonth()-1,d);fim=new Date(ag.getFullYear(),ag.getMonth(),d-1);}return{ini:ini.toISOString().slice(0,10),fim:fim.toISOString().slice(0,10)};}

function TelaDashboard({turnos,abast,cfg,controle}){const ca=calcCiclo(cfg.dia_ciclo||1);const turnosCiclo=turnos.filter(t=>t.data&&t.data>=ca.ini&&t.data<=ca.fim&&parseN(t.km_f)>0);const m=calcPeriodo(turnos,abast,cfg,ca.ini,ca.fim);const[aiMsg,setAiMsg]=useState("");const pedirIA=()=>{if(!ehPro(controle)){setAiMsg("🔒 Análise de IA exclusiva para assinantes Pro.");return;}if(m.lucro>0)setAiMsg(`✅ Ciclo positivo! Lucro de ${fmtR(m.lucro)} em ${m.dias} dias. Dica: monitore o combustível.`);else setAiMsg(`⚠️ Ciclo no vermelho. Dica: revise custos fixos.`);};return(<div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}><Card><div style={{fontSize:11,color:K.muted}}>Lucro liquido</div><div style={{fontSize:22,fontWeight:700,color:m.lucro>=0?K.ok:K.err,marginTop:4}}>{fmtR(m.lucro)}</div></Card><Card><div style={{fontSize:11,color:K.muted}}>Dias</div><div style={{fontSize:17,fontWeight:700}}>{m.dias}</div></Card></div><Card style={{marginBottom:10}}><p style={{fontSize:10,fontWeight:700,color:K.muted,textTransform:"uppercase",marginBottom:10}}>Eficiencia</p><div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span>R$/km</span><b style={{color:m.r_km>=cfg.meta_km?K.ok:K.err}}>{fmtR(m.r_km)}</b></div><div style={{height:2,background:K.border}}><div style={{height:"100%",width:Math.min(100,(m.r_km/cfg.meta_km)*60)+"%",background:m.r_km>=cfg.meta_km?K.ok:K.err}}/></div></div><div><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span>R$/hora</span><b style={{color:m.r_hr>=cfg.meta_hora?K.ok:K.err}}>{fmtR(m.r_hr)}</b></div><div style={{height:2,background:K.border}}><div style={{height:"100%",width:Math.min(100,(m.r_hr/cfg.meta_hora)*60)+"%",background:m.r_hr>=cfg.meta_hora?K.ok:K.err}}/></div></div></Card><Card style={{marginBottom:10}}><p style={{fontSize:10,fontWeight:700,color:K.muted,textTransform:"uppercase",marginBottom:8}}>Custos</p><div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"6px 0",borderBottom:"1px solid "+K.sep}}><span>Combustivel</span><b>{fmtR(m.comb_total)}</b></div><div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"6px 0",borderBottom:"1px solid "+K.sep}}><span>Fixos</span><b>{fmtR(m.fixo)}</b></div><div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:8,color:K.err}}><span>Total</span><span>{fmtR(m.custos)}</span></div></Card><div style={{background:K.card,borderRadius:2,padding:14,border:"1px solid "+K.border}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontSize:12,fontWeight:600}}>Análise do ciclo -- IA</span><button onClick={pedirIA} style={{padding:"5px 10px",fontSize:11,background:K.text,color:K.bg,border:"none",borderRadius:1,cursor:"pointer"}}>Analisar</button></div>{aiMsg?<p style={{fontSize:12,color:K.muted,lineHeight:1.7}}>{aiMsg}</p>:<p style={{fontSize:12,color:K.muted,fontStyle:"italic"}}>Toque em "Analisar"</p>}</div></div>);}

function TelaComparativo({controle}){if(!ehPro(controle))return(<div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}><UpgradeCard titulo="Comparativo de Semanas" descricao="Motoristas Pro ganham 18% mais ao comparar semanas."/></div>);return(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center",color:K.muted}}><p>Em desenvolvimento</p></div>);}

function TelaHistorico({turnos,abast,cfg,controle}){const ciclos=useMemo(()=>{const c=calcCiclo(cfg.dia_ciclo||1);return[{ini:c.ini,fim:c.fim,label:"Ciclo atual"}];},[cfg]);if(!ehPro(controle))return(<div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}><UpgradeCard titulo="Histórico Completo" descricao="Veja todos os seus ciclos e identifique tendências."/></div>);return(<div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}><p style={{fontSize:10,fontWeight:700,color:K.muted,textTransform:"uppercase",margin:"16px 0 8px"}}>Historico de ciclos</p>{ciclos.map((c,i)=>{const m=calcPeriodo(turnos,abast,cfg,c.ini,c.fim);return(<Card key={i} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between"}}><div><p style={{fontSize:13,fontWeight:600}}>{c.label}</p><p style={{fontSize:12,color:m.lucro>=0?K.ok:K.err}}>{fmtR(m.lucro)} lucro</p></div></div></Card>);})}</div>);}

function TelaCombustivel({abast,userId,onAdd}){const[form,setForm]=useState({data:hoje(),tipo:"Gasolina",km_rod:"",litros:"",preco:""});const[mostrar,setMostrar]=useState(false);const salvar=async()=>{if(!form.km_rod||!form.litros||!form.preco)return alert("Preencha tudo");setLoading(true);await sb.from("abastecimentos").insert({user_id:userId,...form,km_rod:parseN(form.km_rod),litros:parseN(form.litros),preco:parseN(form.preco)});setMostrar(false);setForm({data:hoje(),tipo:"Gasolina",km_rod:"",litros:"",preco:""});};return(<div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><p style={{fontSize:12,color:K.muted}}>Combustivel</p><button onClick={()=>setMostrar(!mostrar)} style={{padding:"7px 14px",background:K.text,color:K.bg,border:"none",borderRadius:2,fontSize:13,fontWeight:600,cursor:"pointer"}}>+ Novo</button></div>{mostrar&&<Card style={{marginBottom:14}}><p style={{fontSize:13,fontWeight:600,marginBottom:8}}>Novo abastecimento</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Inp label="Data" type="date" value={form.data} onChange={v=>setForm(f=>({...f,data:v}))}/><Inp label="Preco/L" type="number" value={form.preco} onChange={v=>setForm(f=>({...f,preco:v}))}/><Inp label="Litros" type="number" value={form.litros} onChange={v=>setForm(f=>({...f,litros:v}))}/><Inp label="KM rodado" type="number" value={form.km_rod} onChange={v=>setForm(f=>({...f,km_rod:v}))}/></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}><Btn sec onClick={()=>setMostrar(false)}>Cancelar</Btn><Btn onClick={salvar}>Salvar</Btn></div></Card>}</div>);}

function App(){const[session,setSession]=useState(null),[loading,setLoading]=useState(true);const[nav,setNav]=useState("dashboard");const[cfg,setCfg]=useState(CFG0),[turnos,setTurnos]=useState([]),[abast,setAbast]=useState([]);const[controle,setControle]=useState(null);const isAdmin=session?.user?.email===ADMIN_EMAIL;const carregarDados=async(uid)=>{const{data:ctrl}=await sb.from("usuarios_controle").select("*").eq("user_id",uid).single();setControle(ctrl||null);const{data:c}=await sb.from("configuracoes").select("*").eq("user_id",uid).single();if(c)setCfg(c);const{data:t}=await sb.from("turnos").select("*").eq("user_id",uid).order("data",{ascending:false});if(t)setTurnos(t);const{data:a}=await sb.from("abastecimentos").select("*").eq("user_id",uid).order("data",{ascending:false});if(a)setAbast(a);setLoading(false);};useEffect(()=>{sb.auth.getSession().then(({data:{session}})=>{setSession(session);if(session)carregarDados(session.user.id);else setLoading(false);});const{data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>{setSession(s);if(s)carregarDados(s.user.id);});return()=>subscription.unsubscribe();},[]);const sair=async()=>{await sb.auth.signOut();setSession(null);setTurnos([]);setAbast([]);setCfg(CFG0);setControle(null);};const navItems=[{id:"dashboard",icon:"🏠",label:"Dashboard"},{id:"diario",icon:"📋",label:"Diario"},{id:"combustivel",icon:"⛽",label:"Combust."},{id:"comparativo",icon:"📊",label:"Comparar"},{id:"historico",icon:"📁",label:"Historico"},{id:"config",icon:"",label:"Config."}];if(loading)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column"}}><p style={{color:K.muted}}>Carregando...</p></div>);if(!session)return(<div style={{maxWidth:480,margin:"0 auto",height:"100%"}}><TelaAuth onLogado={()=>sb.auth.getSession().then(({data:{session}})=>{if(session)carregarDados(session.user.id);})}/></div>);return(<div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:K.bg}}><div style={{padding:"12px 16px",borderBottom:"1px solid "+K.border,background:K.card,display:"flex",justifyContent:"space-between",alignItems:"center"}}><h1 style={{fontSize:20,fontWeight:700,color:K.text}}>Por km v1.5</h1><button onClick={sair} style={{background:"none",border:"none",color:K.muted,fontSize:12,cursor:"pointer"}}>Sair</button></div><div style={{flex:1,overflow:"hidden"}}>{nav==="dashboard"&&<TelaDashboard turnos={turnos} abast={abast} cfg={cfg} controle={controle}/>}
{nav==="diario"&&<TelaDiario turnos={turnos} cfg={cfg} userId={session.user.id} onAdd={t=>setTurnos(p=>[t,...p])} onUpdate={t=>setTurnos(p=>p.map(x=>x.id===t.id?t:x))} onDelete={id=>setTurnos(p=>p.filter(x=>x.id!==id))} controle={controle}/>}
{nav==="combustivel"&&<TelaCombustivel abast={abast} userId={session.user.id} onAdd={a=>setAbast(p=>[a,...p])}/>}
{nav==="comparativo"&&<TelaComparativo controle={controle}/>}
{nav==="historico"&&<TelaHistorico turnos={turnos} abast={abast} cfg={cfg} controle={controle}/>}
{nav==="config"&&<TelaConfig cfg={cfg} userId={session.user.id} onSalvo={setCfg}/>}</div>
<div style={{display:"flex",borderTop:"1px solid "+K.border,background:K.card}}>
{navItems.map(n=>(<button key={n.id} onClick={()=>setNav(n.id)}style={{flex:1,padding:"8px 2px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center"}}><span style={{fontSize:18,color:nav===n.id?K.text:K.muted}}>{n.icon}</span><span style={{fontSize:8,color:nav===n.id?K.text:K.muted}}>{n.label}</span></button>))}
</div></div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
