function fmt(n, dec = 2) {
  if (n == null || isNaN(n)) return "—";
  return Number(n).toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtR(n) {
  return n == null || isNaN(n) ? "—" : "R$ " + fmt(n);
}
function parseN(v) {
  const n = parseFloat(String(v).replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function horasDiff(h1, h2) {
  if (!h1 || !h2) return 0;
  const [a, b] = [h1, h2].map(h => {
    const [hh, mm] = h.split(":").map(Number);
    return hh * 60 + mm;
  });
  return Math.max(0, (b - a) / 60);
}
function hoje() {
  return new Date().toISOString().slice(0, 10);
}
function dataFmt(d) {
  if (!d) return "";
  const [y, m, dd] = d.split("-");
  return `${dd}/${m}/${y}`;
}
function periodoDefault() {
  const hj = new Date();
  const diaAtual = hj.getDate();
  let ini, fim;
  if (diaAtual >= 12) {
    ini = new Date(hj.getFullYear(), hj.getMonth(), 12);
    fim = new Date(hj.getFullYear(), hj.getMonth() + 1, 11);
  } else {
    ini = new Date(hj.getFullYear(), hj.getMonth() - 1, 12);
    fim = new Date(hj.getFullYear(), hj.getMonth(), 11);
  }
  return { ini: ini.toISOString().slice(0, 10), fim: fim.toISOString().slice(0, 10) };
}

function calcMes(turnos, abast, cfg, dataIni = null, dataFim = null) {
  const pd = periodoDefault();
  const ini = dataIni || pd.ini;
  const fim = dataFim || pd.fim;
  
  const mes = turnos.filter(t => t.data && t.data >= ini && t.data <= fim);
  const dias = [...new Set(mes.map(t => t.data))].length;
  
  const km_total = mes.reduce((s, t) => s + (t.km_f - t.km_i), 0);
  const hrs_total = mes.reduce((s, t) => s + horasDiff(t.h_i, t.h_f), 0);
  const bruto = mes.reduce((s, t) => s + parseN(t.bruto) + parseN(t.bonus), 0);
  const viajes = mes.reduce((s, t) => s + parseN(t.viagens), 0);
  
  const abastP = abast.filter(a => a.data && a.data >= ini && a.data <= fim);
  const mediaKmL = abastP.length > 0 
    ? abastP.reduce((s, a) => s + parseN(a.km_rod) / Math.max(1, parseN(a.litros)), 0) / abastP.length 
    : Math.max(1, parseN(cfg.autonomia));
    
  const precoComb = abastP.length > 0 
    ? parseN([...abastP].sort((a, b) => b.data.localeCompare(a.data))[0].preco) 
    : parseN(cfg.preco_litro);
    
  const comb_total = mediaKmL > 0 ? (km_total / mediaKmL) * precoComb : 0;
  const pneu_t = km_total * (parseN(cfg.pneu_total) / Math.max(1, parseN(cfg.pneu_km)));
  const rev_t = km_total * parseN(cfg.revisao_km);
  const emer_t = km_total * parseN(cfg.emergencia_km);
  
  const diasPeriodo = Math.max(1, Math.round((new Date(fim) - new Date(ini)) / (1000 * 60 * 60 * 24)) + 1);
  const fixo = (parseN(cfg.parcela) + parseN(cfg.ipva) / 12 + parseN(cfg.seguro) / 12) * (diasPeriodo / 30);
  
  const custos = comb_total + pneu_t + rev_t + emer_t + fixo;
  const lucro = bruto - custos;
  
  return {
    dias, km_total, hrs_total, bruto, viagens: viajes, comb_total, pneu_t, rev_t, emer_t, fixo, custos, lucro, ini, fim,
    r_km: km_total > 0 ? bruto / km_total : 0,
    r_via: viajes > 0 ? bruto / viajes : 0,
    r_hr: hrs_total > 0 ? bruto / hrs_total : 0
  };
}

function BarChart({ data, color = "#4CAF50" }) {
  const max = Math.max(...data.map(d => d.v), 1);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 90, padding: "0 4px" }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
          <div style={{ fontSize: 9, color, fontWeight: 600 }}>{d.v > 0 ? fmt(d.v, 0) : ""}</div>
          <div style={{ width: "100%", height: Math.max(4, (d.v / max) * 65), background: color, borderRadius: "4px 4px 0 0", opacity: 0.85 }} />
          <div style={{ fontSize: 9, color: "#999" }}>{d.l}</div>
        </div>
      ))}
    </div>
  );
}

function TelaAuth({ onLogado }) {
  const [modo, setModo] = useState("login");

  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState("");
  const [msgTipo, setMsgTipo] = useState("ok");

  const toast = (m, t = "ok") => {
    setMsg(m); setMsgTipo(t);
    setTimeout(() => setMsg(""), 4000);
  };

  const entrar = async () => {
    if (!email || !senha) return toast("Preencha e-mail e senha.", "erro");
    setLoading(true);
    const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
    if (error) {
      toast(error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message, "erro");
    } else {
      toast("Bem-vindo! ✅");
      onLogado();
    }
    setLoading(false);
  };

  const cadastrar = async () => {
    if (modo === "cadastro" && !nome) return toast("Preencha seu nome.", "erro");
    if (!email || !senha) return toast("Preencha e-mail e senha.", "erro");
    if (senha.length < 6) return toast("Senha deve ter no mínimo 6 caracteres.", "erro");
    
    setLoading(true);
    const { data, error } = await supabase.auth.signUp({
      email, password: senha,
      options: { data: { nome } }
    });
    
    if (error) {
      toast(error.message, "erro");
      setLoading(false);
      return;
    }
    
    if (data.user) {
      await supabase.from("configuracoes").insert({ user_id: data.user.id, ...CFG0 });
    }
    
    toast("Conta criada! Verifique seu e-mail para confirmar. ✅");
    setModo("login");
    setLoading(false);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", justifyContent: "center", flex: 1, padding: "32px 24px", overflowY: "auto" }}>
      <Toast msg={msg} tipo={msgTipo} />
      <div style={{ textAlign: "center", marginBottom: 32 }}>
        <div style={{ width: 64, height: 64, background: "#F5F5F5", border: "1px solid #E0E0E0", borderRadius: 16, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px", fontSize: 28 }}>🚗</div>
        <h1 style={{ fontSize: 28, fontWeight: 700, color: "#111", margin: 0 }}>Por km</h1>
        <p style={{ color: "#888", fontSize: 13, marginTop: 6 }}>Controle financeiro para motoristas</p>
      </div>

      {modo === "cadastro" && <Inp label="Seu nome" value={nome} onChange={setNome} placeholder="João Silva" />}
      <Inp label="E-mail" type="email" value={email} onChange={setEmail} placeholder="seu@email.com" />
      <Inp label="Senha" type="password" value={senha} onChange={setSenha} placeholder="Mínimo 6 caracteres" />

      <div style={{ marginTop: 20 }}>
        {modo === "login" 
          ? <Btn onClick={entrar} disabled={loading}>{loading ? "Entrando..." : "Entrar"}</Btn>
          : <Btn onClick={cadastrar} disabled={loading}>{loading ? "Criando conta..." : "Criar minha conta"}</Btn>
        }

      <button onClick={() => setModo(modo === "login" ? "cadastro" : "login")}
        style={{ marginTop: 12, background: "none", border: "1px solid #DDD", borderRadius: 8, padding: 11, fontSize: 13, color: "#555", cursor: "pointer", width: "100%" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 600 }}>🕐 {t.num}º Turno — {dataFmt(t.data)}</span>
          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
            <Badge ok={l > 0}>{l > 0 ? "✓" : "✗"}</Badge>
            {mostrarEditar && (
              <button onClick={() => { setEditando(t); setMostrar(false); }}
                style={{ fontSize: 11, padding: "3px 8px", background: "#F5F5F5", border: "1px solid #DDD", borderRadius: 6, cursor: "pointer", color: "#555" }}>✏️ Editar</button>
            )}
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "3px 0", borderTop: "1px solid #F5F5F5" }}>
          <span style={{ color: "#888" }}>KM rodado</span><b>{k} km</b>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "3px 0", borderTop: "1px solid #F5F5F5" }}>
          <span style={{ color: "#888" }}>Horário</span><b>{t.h_i || "—"} → {t.h_f || "—"} ({fmt(h, 1)}h)</b>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "3px 0", borderTop: "1px solid #F5F5F5" }}>
          <span style={{ color: "#888" }}>Viagens / Bruto</span><b>{t.viagens} · {fmtR(b)}</b>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "3px 0", borderTop: "1px solid #F5F5F5" }}>
          <span style={{ color: "#888" }}>Lucro est.</span><b style={{ color: l > 0 ? "#2E7D32" : "#C62828" }}>{fmtR(l)}</b>
        </div>
      </Card>
    );
  };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 80px" }}>
      {turnos.length > 0 && (
        <>
          <p style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Suas médias gerais</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
            <Card style={{ padding: 10, textAlign: "center" }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#1A56A0" }}>{fmt(mediaKmDia, 0)} km</div>
              <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>KM/dia</div>
            </Card>
            <Card style={{ padding: 10, textAlign: "center" }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#1A56A0" }}>{fmtR(mediaBrutoDia)}</div>
              <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>Bruto/dia</div>
            </Card>
            <Card style={{ padding: 10, textAlign: "center" }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#1A56A0" }}>{fmt(mediaViagensDia, 1)}</div>
              <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>Viagens/dia</div>
            </Card>
            <Card style={{ padding: 10, textAlign: "center" }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#1A56A0" }}>{fmtR(mediaRKm)}</div>
              <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>R$/km</div>
            </Card>
          </div>
        </>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <p style={{ fontSize: 13, fontWeight: 600 }}>Hoje, {dataFmt(hoje())}</p>
        <button onClick={() => { setMostrar(!mostrar); setEditando(null); }}
          style={{ padding: "7px 14px", background: "#1A1A1A", color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>+ Turno</button>
      </div>

      {mostrar && <FormTurno titulo={`Novo turno — ${turnosHoje.length + 1}º`} inicial={{ data: hoje(), num: turnosHoje.length + 1, km_i: "", km_f: "", h_i: "", h_f: "", bruto: "", viagens: "", bonus: "0" }} onSalvar={salvarNovo} onCancelar={() => setMostrar(false)} loading={loading} />}
      {editando && <FormTurno titulo={`Editar turno — ${editando.num}º (${dataFmt(editando.data)})`} inicial={{ data: editando.data, num: editando.num, km_i: editando.km_i, km_f: editando.km_f, h_i: editando.h_i || "", h_f: editando.h_f || "", bruto: editando.bruto, viajes: editando.viagens, bonus: editando.bonus || "0" }} onSalvar={salvarEdicao} onCancelar={() => setEditando(null)} loading={loading} />}

      {turnosHoje.length === 0 && !mostrar && !editando && (
        <div style={{ textAlign: "center", padding: "24px 20px", color: "#AAA", background: "#F9F9F9", borderRadius: 10, marginBottom: 14 }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>📋</div>
          <p style={{ fontSize: 13 }}>Nenhum turno hoje ainda.</p>
        </div>
      )}
      {turnosHoje.map(t => <CardTurno key={t.id} t={t} />)}

      {turnosHoje.length > 0 && (
        <div style={{ background: "#F1EFE8", borderRadius: 10, padding: 14, marginTop: 4, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: "#444" }}>✨ Análise do dia — IA</span>
            <button onClick={pedirIA} disabled={loadingAI} style={{ padding: "5px 10px", fontSize: 11, background: "#1A1A1A", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer", opacity: loadingAI ? 0.6 : 1 }}>
              {loadingAI ? "Analisando..." : "Analisar ↗"}
            </button>
          </div>
          {aiMsg ? <p style={{ fontSize: 12, color: "#555", lineHeight: 1.7 }}>{aiMsg}</p> : <p style={{ fontSize: 12, color: "#888", fontStyle: "italic" }}>Toque em "Analisar" para a IA avaliar seu dia.</p>}
        </div>
      )}

      {turnosAnt.length > 0 && (
        <>
          <p style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1, margin: "16px 0 8px" }}>Histórico</p>
          {turnosAnt.map(t => <CardTurno key={t.id} t={t} />)}
        </>
      )}
    </div>
  );
}

function TelaCombustivel({ abastecimentos, cfg, userId, onAdd, onUpdate }) {
  const [form, setForm] = useState({ data: hoje(), tipo: "Gasolina", km_rod: "", litros: "", preco: "" });
  const [mostrar, setMostrar] = useState(false);
  const [editando, setEditando] = useState(null);
  const [loading, setLoading] = useState(false);

  const media = abastecimentos.length > 0 ? abastecimentos.reduce((s, a) => s + parseN(a.km_rod) / Math.max(0.01, parseN(a.litros)), 0) / abastecimentos.length : 0;
  const totalGasto = abastecimentos.reduce((s, a) => s + parseN(a.litros) * parseN(a.preco), 0);
  const totalLitros = abastecimentos.reduce((s, a) => s + parseN(a.litros), 0);
  const mediaCustKm = media > 0 && abastecimentos.length > 0 ? (abastecimentos.reduce((s, a) => s + parseN(a.preco), 0) / abastecimentos.length) / media : 0;

  const salvar = async () => {
    if (!form.km_rod || !form.litros || !form.preco) return alert("Preencha todos os campos.");
    setLoading(true);
    const novo = { user_id: userId, data: form.data, tipo: form.tipo, km_rod: parseN(form.km_rod), litros: parseN(form.litros), preco: parseN(form.preco) };
    const { data, error } = await supabase.from("abastecimentos").insert(novo).select().single();
    if (!error) {
      onAdd(data); setMostrar(false); setForm({ data: hoje(), tipo: "Gasolina", km_rod: "", litros: "", preco: "" });
    } else alert("Erro: " + error.message);
    setLoading(false);
  };

  const salvarEdicao = async () => {
    if (!editando.km_rod || !editando.litros || !editando.preco) return alert("Preencha todos os campos.");
    setLoading(true);
    const upd = { data: editando.data, tipo: editando.tipo, km_rod: parseN(editando.km_rod), litros: parseN(editando.litros), preco: parseN(editando.preco) };
    const { data, error } = await supabase.from("abastecimentos").update(upd).eq("id", editando.id).select().single();
    if (!error) {
      onUpdate(data); setEditando(null);
    } else alert("Erro: " + error.message);
    setLoading(false);
  };

  const FormAbast = ({ dados, setDados, onSalvar, onCancelar, titulo }) => {
    const kmlF = parseN(dados.litros) > 0 ? parseN(dados.km_rod) / parseN(dados.litros) : 0;
    const totF = parseN(dados.litros) * parseN(dados.preco);
    const ckmF = kmlF > 0 ? parseN(dados.preco) / kmlF : 0;
    return (
      <Card style={{ border: "1px dashed #CCC", marginBottom: 14 }}>
        <p style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>{titulo}</p>
        <Lbl>Tipo de combustível</Lbl>
        <div style={{ display: "flex", border: "1px solid #DDD", borderRadius: 8, overflow: "hidden", marginBottom: 4 }}>
          {["Gasolina", "Álcool"].map(t => (
            <button key={t} type="button" onClick={() => setDados(f => ({ ...f, tipo: t }))}
              style={{ flex: 1, padding: 10, border: "none", cursor: "pointer", fontSize: 13, background: dados.tipo === t ? "#1A1A1A" : "#FFF", color: dados.tipo === t ? "#FFF" : "#555", fontWeight: dados.tipo === t ? 600 : 400 }}>
              {t === "Gasolina" ? "⛽ Gasolina" : "🌿 Álcool"}
            </button>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Inp label="Data" type="date" value={dados.data} onChange={v => setDados(f => ({ ...f, data: v }))} />
          <Inp label="Preço/litro (R$)" type="number" value={dados.preco} onChange={v => setDados(f => ({ ...f, preco: v }))} placeholder="4.89" />
          <Inp label="Litros" type="number" value={dados.litros} onChange={v => setDados(f => ({ ...f, litros: v }))} placeholder="40.0" />
          <Inp label="KM rodado" type="number" value={dados.km_rod} onChange={v => setDados(f => ({ ...f, km_rod: v }))} placeholder="280" />
        </div>
        {kmlF > 0 && (
          <div style={{ marginTop: 12, background: "#E3F2FD", borderRadius: 8, padding: 10, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>{fmt(kmlF)}</div>
              <div style={{fontSize: 10, color: "#666"}}>km/L</div>
            </div>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>R$ {fmt(ckmF, 3)}</div>
              <div style={{fontSize: 10, color: "#666"}}>Custo/km</div>
            </div>
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>{fmtR(totF)}</div>
              <div style={{fontSize: 10, color: "#666"}}>Total</div>
            </div>
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 }}>
          <Btn sec onClick={onCancelar}>Cancelar</Btn>
          <Btn onClick={onSalvar} disabled={loading}>Salvar</Btn>
        </div>
      </Card>
    );
  };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 80px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <p style={{ fontSize: 12, color: "#888" }}>Controle de consumo</p>
        <button onClick={() => { setMostrar(!mostrar); setEditando(null); }} style={{ padding: "7px 14px", background: "#1A1A1A", color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>+ Registrar</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
        <Card style={{ padding: 10, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>{fmt(media)}</div>
          <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>Média km/L</div>
        </Card>
        <Card style={{ padding: 10, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>R$ {fmt(mediaCustKm, 3)}</div>
          <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>Custo médio/km</div>
        </Card>
        <Card style={{ padding: 10, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>{fmt(totalLitros, 1)}L</div>
          <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>Total litros</div>
        </Card>
        <Card style={{ padding: 10, textAlign: "center" }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: "#1565C0" }}>{fmtR(totalGasto)}</div>
          <div style={{ fontSize: 10, color: "#999", marginTop: 2 }}>Total gasto</div>
        </Card>
      </div>

      {abastecimentos.length > 1 && (
        <Card style={{ marginBottom: 14 }}>
          <p style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Evolução km/L</p>
          <BarChart color="#1565C0" data={[...abastecimentos].reverse().map(a => ({ v: parseFloat((parseN(a.km_rod) / Math.max(0.01, parseN(a.litros))).toFixed(2)), l: dataFmt(a.data).slice(0, 5) }))} />
        </Card>
      )}

      {mostrar && <FormAbast titulo="Novo abastecimento" dados={form} setDados={setForm} onSalvar={salvar} onCancelar={() => setMostrar(false)} />}
      {editando && <FormAbast titulo={`Editar abastecimento — ${dataFmt(editando.data)}`} dados={editando} setDados={setEditando} onSalvar={salvarEdicao} onCancelar={() => setEditando(null)} />}

      <p style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Histórico</p>
      {abastecimentos.length === 0 && <p style={{ color: "#AAA", textAlign: "center", padding: 24, fontSize: 13 }}>Nenhum abastecimento registrado.</p>}
      {abastecimentos.map(a => {
        const kmlA = parseN(a.litros) > 0 ? parseN(a.km_rod) / parseN(a.litros) : 0;
        return (
          <Card key={a.id} style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <span style={{ fontSize: 13, fontWeight: 600 }}>{dataFmt(a.data)}</span>
                <span style={{ fontSize: 11, padding: "2px 8px", borderRadius: 10, border: "1px solid #EEE", color: "#666" }}>{a.tipo === "Gasolina" ? "⛽" : "🌿"} {a.tipo}</span>
              </div>
              <button onClick={() => { setEditando({ ...a, km_rod: a.km_rod, litros: a.litros, preco: a.preco }); setMostrar(false); }}
                style={{ fontSize: 11, padding: "3px 8px", background: "#F5F5F5", border: "1px solid #DDD", borderRadius: 6, cursor: "pointer", color: "#555" }}>✏️ Editar</button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr" }}>
              <div style={{ textAlign: "center", borderRight: "1px solid #F0F0F0" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#222" }}>{a.km_rod} km</div>
                <div style={{ fontSize: 10, color: "#999" }}>KM rod.</div>
              </div>
              <div style={{ textAlign: "center", borderRight: "1px solid #F0F0F0" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#222" }}>{fmt(a.litros)}L</div>
                <div style={{ fontSize: 10, color: "#999" }}>Litros</div>
              </div>
              <div style={{ textAlign: "center", borderRight: "1px solid #F0F0F0" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#222" }}>{fmtR(parseN(a.litros) * parseN(a.preco))}</div>
                <div style={{ fontSize: 10, color: "#999" }}>Total</div>
              </div>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: kmlA >= media * 0.92 ? "#2E7D32" : "#C62828" }}>{fmt(kmlA)}</div>
                <div style={{ fontSize: 10, color: "#999" }}>km/L</div>
              </div>
            </div>
          </Card>
        );
      })}
    </div>
  );
}

function TelaDashboard({ turnos, abastecimentos, cfg }) {

  const [dataFim, setDataFim] = useState(pd.fim);

    <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 80px" }}>

          </div>

        <Card style={{ background: mes.lucro >= 0 ? "#F1F8E9" : "#FFEBEE" }}>
          <div style={{ fontSize: 11, color: "#888" }}>Lucro líquido</div>
          <div style={{ fontSize: 24, fontWeight: 800, color: mes.lucro >= 0 ? "#2E7D32" : "#C62828", marginTop: 4 }}>{fmtR(mes.lucro)}</div>
          <div style={{ fontSize: 11, color: "#999", marginTop: 4 }}>de {fmtR(mes.bruto)} bruto</div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <Card style={{ padding: 10 }}><div style={{ fontSize: 10, color: "#999" }}>Dias</div><div style={{ fontSize: 20, fontWeight: 700 }}>{mes.dias} dias</div></Card>
          <Card style={{ padding: 10 }}><div style={{ fontSize: 10, color: "#999" }}>KM rodado</div><div style={{ fontSize: 20, fontWeight: 700 }}>{mes.km_total}</div></Card>
        </div>
      </div>

      <Card style={{ marginBottom: 10 }}>
        <p style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>Eficiência (IE)</p>
        <IEBar label="R$/km" real={mes.r_km} meta={parseN(cfg.meta_km)} valor={fmtR(mes.r_km) + "/km"} />
        <IEBar label="R$/viagem" real={mes.r_via} meta={parseN(cfg.meta_viagem)} valor={fmtR(mes.r_via)} />
        <IEBar label="R$/hora" real={mes.r_hr} meta={parseN(cfg.meta_hora)} valor={fmtR(mes.r_hr) + "/h"} />
      </Card>

      <Card style={{ marginBottom: 10 }}>
        <p style={{ fontSize: 11, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Custos do mês</p>
        {[
          ["Parcela do carro", parseN(cfg.parcela)],
          ["Combustível", mes.comb_total],
          ["Revisão", mes.rev_t],
          ["Pneu", mes.pneu_t],
          ["IPVA + Seguro", parseN(cfg.ipva) / 12 + parseN(cfg.seguro) / 12]
        ].map(([l, v]) => (
          <div key={l} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "8px 0", borderBottom: "1px solid #F5F5F5" }}>
            <span style={{ color: "#666" }}>{l}</span><b>{fmtR(v)}</b>
          </div>
        ))}
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, fontWeight: 700, paddingTop: 10 }}>
          <span>Total despesas</span><span style={{ color: "#C62828" }}>{fmtR(mes.custos)}</span>
        </div>
      </Card>
    </div>
  );
}

function TelaAdmin() {
  const [usuarios, setUsuarios] = useState([]);
  const [loading, setLoading] = useState(true);

  const carregarUsuarios = async () => {
    setLoading(true);
    const { data } = await supabase.from("usuarios_controle").select("*").order("nome", { ascending: true });
    if (data) setUsuarios(data);
    setLoading(false);
  };

  useEffect(() => {
    carregarUsuarios();
  }, []);

  const alternarStatus = async (user) => {
    const novoStatus = !user.ativo;
    const { error } = await supabase.from("usuarios_controle").update({ ativo: novoStatus }).eq("id", user.id);
    if (!error) {
      setUsuarios(p => p.map(u => u.id === user.id ? { ...u, ativo: novoStatus } : u));
    } else {
      alert("Erro ao alterar status: " + error.message);
    }
  };

  if (loading) return <div style={{ textAlign: "center", padding: 20, fontSize: 13, color: "#666" }}>Carregando usuários...</div>;

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 80px" }}>
      <p style={{ fontSize: 11, fontWeight: 700, color: "#1A56A0", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>Painel de Controle — Usuários</p>
      {usuarios.length === 0 && <p style={{ fontSize: 13, color: "#999", textAlign: "center", padding: 20 }}>Nenhum usuário encontrado.</p>}
      {usuarios.map(u => (
        <Card key={u.id} style={{ marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 14, fontWeight: 600, color: "#111" }}>{u.nome || "Sem nome"} {u.admin && <span style={{ fontSize: 9, background: "#E0F7FA", color: "#006064", padding: "2px 4px", borderRadius: 4, marginLeft: 4 }}>ADMIN</span>}</div>
            <div style={{ fontSize: 11, color: "#666", marginTop: 2 }}>{u.email}</div>
          </div>
          <button onClick={() => alternarStatus(u)}
            style={{ padding: "6px 12px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: u.ativo ? "#E8F5E9" : "#FFEBEE", color: u.ativo ? "#2E7D32" : "#C62828" }}>
            {u.ativo ? "✓ Ativo" : "✕ Bloqueado"}
          </button>
        </Card>
      ))}
    </div>
  );
}

function TelaAguardando({ onSair }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flex: 1, padding: 32, textAlign: "center" }}>
      <div style={{ fontSize: 56, marginBottom: 20 }}>⏳</div>
      <h2>Conta em análise</h2>
      <p style={{ fontSize: 14, color: "#666", marginTop: 8, marginBottom: 24 }}>Aguarde a ativação pelo administrador.</p>
      <button onClick={onSair} style={{ padding: "10px 24px", background: "#1A1A1A", color: "#FFF", border: "none", borderRadius: 8 }}>Sair</button>
    </div>
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [nav, setNav] = useState("dashboard");
  const [cfg, setCfg] = useState(CFG0);
  const [turnos, setTurnos] = useState([]);
  const [abast, setAbast] = useState([]);
  const [controle, setControle] = useState(null);

  const carregarDados = async (uid) => {
    setLoading(true);
    try {
      // 1. Puxa o controle de acesso de forma direta e limpa
      const { data: ctrl } = await supabase.from("usuarios_controle").select("*").eq("user_id", uid).maybeSingle();
      if (ctrl) {
        setControle(ctrl);
      } else {
        setControle({ ativo: true, admin: false });
      }

      // 2. Busca as tabelas de motorista individualmente sem correr risco de timeout ou travar por falta de dados
      const { data: cData } = await supabase.from("configuracoes").select("*").eq("user_id", uid).maybeSingle();
      if (cData) setCfg(cData);
      else setCfg(CFG0);

      const { data: tData } = await supabase.from("turnos").select("*").eq("user_id", uid).order("data", { ascending: false });
      if (tData) setTurnos(tData);

      const { data: aData } = await supabase.from("abastecimentos").select("*").eq("user_id", uid).order("data", { ascending: false });
      if (aData) setAbast(aData);

    } catch (e) {
      console.warn("Aviso ao carregar banco:", e);
      setCfg(CFG0);
    }
    setLoading(false);
  };

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      if (session) carregarDados(session.user.id);
      else setLoading(false);
    });
  }, []);

  const sair = async () => {
    await supabase.auth.signOut();
    setSession(null);
    setControle(null);
  };

  const navItems = [
    { id: "dashboard", icon: "▦", label: "Dashboard" },
    { id: "diario", icon: "📋", label: "Diário" },
    { id: "combustivel", icon: "⛽", label: "Combust." },
    { id: "config", icon: "⚙️", label: "Config." }
  ];

  if (controle && controle.admin) {
    navItems.push({ id: "admin", icon: "👑", label: "Admin" });
  }

  if (loading) return <div style={{ textAlign: "center", padding: 50, fontFamily: "Arial", color: "#666" }}>Carregando app...</div>;

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", height: "100vh", display: "flex", flexDirection: "column", background: "#FAFAFA" }}>
      {!session ? (
        <TelaAuth onLogado={() => { supabase.auth.getSession().then(({ data: { session } }) => { if (session) carregarDados(session.user.id); }); }} />
      ) : controle && !controle.ativo ? (
        <TelaAguardando onSair={sair} />
      ) : (
        <>
          <div style={{ padding: 14, background: "#FFF", display: "flex", justifyContent: "space-between", borderBottom: "1px solid #E8E8E8", alignItems: "center" }}>
            <b style={{ color: "#111" }}>Por km</b>
            <button onClick={sair} style={{ background: "none", border: "none", color: "#888", cursor: "pointer", fontSize: 13 }}>Sair</button>
          </div>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            {nav === "dashboard" && <TelaDashboard turnos={turnos} abastecimentos={abast} cfg={cfg} />}
            {nav === "diario" && <TelaDiario turnos={turnos} cfg={cfg} userId={session.user.id} onAdd={t => setTurnos(p => [t, ...p])} onUpdate={t => setTurnos(p => p.map(x => x.id === t.id ? t : x))} />}
            {nav === "combustivel" && <TelaCombustivel abastecimentos={abast} cfg={cfg} userId={session.user.id} onAdd={a => setAbast(p => [a, ...p])} onUpdate={a => setAbast(p => p.map(x => x.id === a.id ? a : x))} />}
            {nav === "config" && <TelaConfig cfg={cfg} userId={session.user.id} onSalvo={c => setCfg(c)} />}
            {nav === "admin" && <TelaAdmin />}
          </div>
          <div style={{ display: "flex", borderTop: "1px solid #E8E8E8", background: "#FFF", flexShrink: 0 }}>
            {navItems.map(n => (
              <button key={n.id} onClick={() => setNav(n.id)}
                style={{ flex: 1, padding: "10px 4px 8px", background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
                <span style={{ fontSize: 18, color: nav === n.id ? "#1A56A0" : "#888" }}>{n.icon}</span>
                <span style={{ fontSize: 10, color: nav === n.id ? "#1A56A0" : "#888", fontWeight: nav === n.id ? 600 : 400 }}>{n.label}</span>
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
