// utils
function fmt(n,dec=2){if(n==null||isNaN(n))return"—";return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtR(n){return(n==null||isNaN(n))?"—":"R$ "+fmt(n);}
function parseN(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
function horasDiff(h1,h2){if(!h1||!h2)return 0;const[a,b]=[h1,h2].map(h=>{const[hh,mm]=h.split(":").map(Number);return hh*60+mm;});return Math.max(0,(b-a)/60);}
function hoje(){return new Date().toISOString().slice(0,10);}
function dataFmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;}
function diaSemana(d){return["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(d+"T12:00:00").getDay()];}

const CFG0={meta_km:2.30,meta_hora:39.00,parcela:0,ipva:0,seguro:0,pneu_total:1000,pneu_km:60000,revisao_km:0.30,emergencia_km:0.12,autonomia:7.0,preco_litro:4.89,dia_ciclo:1,usar_media_comb:false};

function calcCiclo(dia){
  const d=parseInt(dia)||1;
  const ag=new Date();
  const dc=ag.getDate();
  let ini,fim;
  if(dc>=d){ini=new Date(ag.getFullYear(),ag.getMonth(),d);fim=new Date(ag.getFullYear(),ag.getMonth()+1,d-1);}
  else{ini=new Date(ag.getFullYear(),ag.getMonth()-1,d);fim=new Date(ag.getFullYear(),ag.getMonth(),d-1);}
  return{ini:ini.toISOString().slice(0,10),fim:fim.toISOString().slice(0,10)};
}

function gerarCiclos(dia,turnos){
  if(!turnos.length)return[];
  const d=parseInt(dia)||1;
  const datas=turnos.map(t=>t.data).sort();
  const primeira=new Date(datas[0]+"T12:00:00");
  const ciclos=[];
  let ini=new Date(primeira.getFullYear(),primeira.getMonth(),d);
  if(ini>primeira)ini=new Date(primeira.getFullYear(),primeira.getMonth()-1,d);
  for(let i=0;i<24;i++){
    const fim=new Date(ini.getFullYear(),ini.getMonth()+1,d-1);
    const iniStr=ini.toISOString().slice(0,10);
    const fimStr=fim.toISOString().slice(0,10);
    if(iniStr>hoje())break;
    ciclos.push({ini:iniStr,fim:fimStr,label:`${dataFmt(iniStr)} → ${dataFmt(fimStr)}`});
    ini=new Date(ini.getFullYear(),ini.getMonth()+1,d);
  }
  return ciclos.reverse();
}

function calcPeriodo(turnos,abast,cfg,ini,fim){
  const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim);
  const dias=[...new Set(mes.map(t=>t.data))].length;
  const km_total=mes.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
  const hrs_total=mes.reduce((s,t)=>s+horasDiff(t.h_i,t.h_f),0);
  const bruto=mes.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const viagens=mes.reduce((s,t)=>s+parseN(t.viagens),0);
  const abastP=abast.filter(a=>a.data&&a.data>=ini&&a.data<=fim);
  let kmL=parseN(cfg.autonomia)||7;
  let precoComb=parseN(cfg.preco_litro)||5;
  if(cfg.usar_media_comb&&abastP.length>0){
    kmL=abastP.reduce((s,a)=>s+parseN(a.km_rod)/Math.max(0.01,parseN(a.litros)),0)/abastP.length;
    precoComb=parseN([...abastP].sort((a,b)=>b.data.localeCompare(a.data))[0].preco);
  }
  const comb_total=kmL>0?(km_total/kmL)*precoComb:0;
  const pneu_t=km_total*(parseN(cfg.pneu_total)/Math.max(1,parseN(cfg.pneu_km)));
  const rev_t=km_total*parseN(cfg.revisao_km);
  const emer_t=km_total*parseN(cfg.emergencia_km);
  const dp=Math.max(1,Math.round((new Date(fim+"T12:00:00")-new Date(ini+"T12:00:00"))/(1000*60*60*24))+1);
  const fixo=(parseN(cfg.parcela)+parseN(cfg.ipva)/12+parseN(cfg.seguro)/12)*(dp/30);
  const custos_var=comb_total+pneu_t+rev_t+emer_t;
  const custos=custos_var+fixo;
  return{dias,km_total,hrs_total,bruto,viagens,comb_total,pneu_t,rev_t,emer_t,fixo,custos_var,custos,lucro:bruto-custos,ini,fim,
    r_km:km_total>0?bruto/km_total:0,r_hr:hrs_total>0?bruto/hrs_total:0};
}

function BarChart({data,color="#4CAF50"}){
  const max=Math.max(...data.map(d=>Math.abs(d.v)),1);
  return<div style={{display:"flex",alignItems:"flex-end",gap:4,height:90,padding:"0 2px"}}>
    {data.map((d,i)=>(

    ))}

}

          {[["KM rodado",km>0?km+" km":"—"],["Horas",hrs>0?fmt(hrs,1)+"h":"—"],["Bruto",fmtR(parseN(form.bruto)+parseN(form.bonus))]].map(([l,v])=>(
            <div key={l}><div style={{fontSize:15,fontWeight:700,color:"#E65100"}}>{v}</div><div style={{fontSize:10,color:"#666"}}>{l}</div></div>
          ))}
        </div>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:14}}>
        <Btn sec onClick={onCancelar}>Cancelar</Btn>
        <Btn onClick={()=>{if(!form.km_f||!form.h_f||!form.bruto||!form.viagens)return alert("Preencha todos os campos.");onSalvar({...turno,...form,km_f:parseN(form.km_f),bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:parseN(form.bonus)});}} disabled={loading}>{loading?"Fechando...":"Fechar turno"}</Btn>
      </div>
    </Card>
  );
}

// DIÁRIO
function TelaDiario({turnos,cfg,userId,onAdd,onUpdate}){
  const[modo,setModo]=useState(null);
  const[editando,setEditando]=useState(null);
  const[loading,setLoading]=useState(false);
  const[aiMsg,setAiMsg]=useState("");
  const[loadingAI,setLoadingAI]=useState(false);
  const turnosHoje=turnos.filter(t=>t.data===hoje()).sort((a,b)=>a.num-b.num);
  const turnosAnt=turnos.filter(t=>t.data!==hoje()).sort((a,b)=>b.data.localeCompare(a.data)||a.num-b.num);
  const turnoAberto=turnosHoje.find(t=>t.km_i&&(!t.km_f||!t.bruto));
  const totalDias=[...new Set(turnos.map(t=>t.data))].length;
  const totalKm=turnos.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
  const totalBruto=turnos.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const totalViagens=turnos.reduce((s,t)=>s+parseN(t.viagens),0);
  const calcT=(t)=>{
    const k=parseN(t.km_f)-parseN(t.km_i);const h=horasDiff(t.h_i,t.h_f);const b=parseN(t.bruto)+parseN(t.bonus);
    const aut=parseN(cfg.autonomia)||7;const c=k>0?(k/aut)*parseN(cfg.preco_litro):0;
    const lucro=b-c-k*(parseN(cfg.pneu_total)/Math.max(1,parseN(cfg.pneu_km)))-k*parseN(cfg.revisao_km)-k*parseN(cfg.emergencia_km);
    return{k,h,b,lucro,r_km:k>0?b/k:0,r_hr:h>0?b/h:0};
  };
  const abrirTurno=async(form)=>{
    setLoading(true);
    const{data,error}=await supabase.from("turnos").insert({user_id:userId,data:form.data,num:parseN(form.num),km_i:parseN(form.km_i),km_f:0,h_i:form.h_i,h_f:"",bruto:0,viagens:0,bonus:0}).select().single();
    if(!error){onAdd(data);setModo(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  const fecharTurno=async(form)=>{
    setLoading(true);
    const{data,error}=await supabase.from("turnos").update({km_f:parseN(form.km_f),h_f:form.h_f,bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:parseN(form.bonus)}).eq("id",turnoAberto.id).select().single();
    if(!error){onUpdate(data);setModo(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  const salvarEd=async(form)=>{
    setLoading(true);
    const{data,error}=await supabase.from("turnos").update({data:form.data,num:parseN(form.num),km_i:parseN(form.km_i),km_f:parseN(form.km_f),h_i:form.h_i,h_f:form.h_f,bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:parseN(form.bonus)}).eq("id",editando.id).select().single();
    if(!error){onUpdate(data);setEditando(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  const pedirIA=useCallback(async()=>{
    setLoadingAI(true);
    const totB=turnosHoje.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
    const totK=turnosHoje.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
    const totV=turnosHoje.reduce((s,t)=>s+parseN(t.viagens),0);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:`Consultor financeiro de motoristas. Em português (3-4 frases). Dia: ${turnosHoje.length} turno(s), R$${totB.toFixed(2)} bruto, ${totK}km, ${totV} viagens. Metas: R$${cfg.meta_km}/km, R$${cfg.meta_hora}/h. Avalie e dê 1 dica.`}]})});
      const d=await res.json();setAiMsg(d.content?.[0]?.text||"Sem resposta.");
    }catch{setAiMsg("Não foi possível conectar à IA.");}
    setLoadingAI(false);
  },[turnosHoje,cfg]);

  const CardTurno=({t})=>{
    const aberto=t.km_i&&(!t.km_f||!t.bruto);
    const{k,h,b,lucro,r_km,r_hr}=calcT(t);
    const okKm=r_km>=parseN(cfg.meta_km);const okHr=r_hr>=parseN(cfg.meta_hora);
    return(
      <Card style={{marginBottom:8,borderLeft:`3px solid ${aberto?"#FF9800":"#4CAF50"}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:600}}>{aberto?"🟡":"🕐"} {t.num}º Turno — {dataFmt(t.data)}</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {aberto?<span style={{fontSize:10,background:"#FFF3E0",color:"#E65100",padding:"2px 7px",borderRadius:4,fontWeight:600}}>Em aberto</span>:<Badge ok={lucro>0}>{lucro>0?"✓":"✗"}</Badge>}
            <button onClick={()=>{setEditando(t);setModo(null);}} style={{fontSize:11,padding:"3px 8px",background:"#F5F5F5",border:"1px solid #DDD",borderRadius:6,cursor:"pointer",color:"#555"}}>✏️</button>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid #F5F5F5"}}><span style={{color:"#888"}}>KM inicial · Hora início</span><b>{t.km_i} · {t.h_i||"—"}</b></div>
        {!aberto&&<>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid #F5F5F5"}}><span style={{color:"#888"}}>KM rodado · Horas</span><b>{k} km · {fmt(h,1)}h</b></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid #F5F5F5"}}><span style={{color:"#888"}}>Viagens · Bruto</span><b>{t.viagens} · {fmtR(b)}</b></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid #F5F5F5"}}><span style={{color:"#888"}}>Lucro est.</span><b style={{color:lucro>0?"#2E7D32":"#C62828"}}>{fmtR(lucro)}</b></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:8,paddingTop:8,borderTop:"1px solid #F0F0F0"}}>
            <div style={{textAlign:"center",background:okKm?"#E8F5E9":"#FFEBEE",borderRadius:6,padding:"4px 6px"}}>
              <div style={{fontSize:12,fontWeight:700,color:okKm?"#2E7D32":"#C62828"}}>{fmtR(r_km)}/km</div>
              <div style={{fontSize:9,color:"#888"}}>meta {fmtR(parseN(cfg.meta_km))}/km</div>
            </div>
            <div style={{textAlign:"center",background:okHr?"#E8F5E9":"#FFEBEE",borderRadius:6,padding:"4px 6px"}}>
              <div style={{fontSize:12,fontWeight:700,color:okHr?"#2E7D32":"#C62828"}}>{fmtR(r_hr)}/h</div>
              <div style={{fontSize:9,color:"#888"}}>meta {fmtR(parseN(cfg.meta_hora))}/h</div>
            </div>
          </div>
        </>}
      </Card>
    );
  };

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      {turnos.length>0&&<>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Suas médias gerais</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          {[["KM/dia",fmt(totalDias>0?totalKm/totalDias:0,0)+" km"],["Bruto/dia",fmtR(totalDias>0?totalBruto/totalDias:0)],["Viagens/dia",fmt(totalDias>0?totalViagens/totalDias:0,1)],["R$/km",fmtR(totalKm>0?totalBruto/totalKm:0)]].map(([l,v])=>(
            <Card key={l} style={{padding:10,textAlign:"center"}}><div style={{fontSize:15,fontWeight:700,color:"#1A56A0"}}>{v}</div><div style={{fontSize:10,color:"#999",marginTop:2}}>{l}</div></Card>
          ))}
        </div>
      </>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <p style={{fontSize:13,fontWeight:600}}>Hoje, {dataFmt(hoje())}</p>
        {!turnoAberto
          ?<button onClick={()=>setModo(modo==="abrir"?null:"abrir")} style={{padding:"9px 16px",background:"#2E7D32",color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>🟢 Abrir turno</button>
          :<button onClick={()=>setModo(modo==="fechar"?null:"fechar")} style={{padding:"9px 16px",background:"#E65100",color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>🔴 Fechar turno</button>
        }
      </div>
      {modo==="abrir"&&!turnoAberto&&<FormAbrirTurno numTurno={turnosHoje.length+1} onSalvar={abrirTurno} onCancelar={()=>setModo(null)} loading={loading}/>}
      {modo==="fechar"&&turnoAberto&&<FormFecharTurno turno={turnoAberto} onSalvar={fecharTurno} onCancelar={()=>setModo(null)} loading={loading}/>}
      {editando&&<FormTurnoEdit titulo={`Editar — ${editando.num}º turno (${dataFmt(editando.data)})`}
        inicial={{data:editando.data,num:editando.num,km_i:editando.km_i,km_f:editando.km_f||"",h_i:editando.h_i||"",h_f:editando.h_f||"",bruto:editando.bruto||"",viagens:editando.viagens||"",bonus:editando.bonus||"0"}}
        onSalvar={salvarEd} onCancelar={()=>setEditando(null)} loading={loading}/>}
      {turnosHoje.length===0&&!modo&&!editando&&(
        <div style={{textAlign:"center",padding:"24px 20px",color:"#AAA",background:"#F9F9F9",borderRadius:10,marginBottom:14}}>
          <div style={{fontSize:32,marginBottom:8}}>📋</div>
          <p style={{fontSize:13}}>Nenhum turno hoje ainda.</p>
          <p style={{fontSize:12,marginTop:4}}>Toque em "Abrir turno" para começar.</p>
        </div>
      )}
      {turnosHoje.map(t=><CardTurno key={t.id} t={t}/>)}
      {turnosHoje.filter(t=>t.bruto>0).length>0&&(
        <div style={{background:"#F1EFE8",borderRadius:10,padding:14,marginTop:4,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:600,color:"#444"}}>✨ Análise do dia — IA</span>
            <button onClick={pedirIA} disabled={loadingAI} style={{padding:"5px 10px",fontSize:11,background:"#1A1A1A",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",opacity:loadingAI?0.6:1}}>
              {loadingAI?"Analisando...":"Analisar ↗"}
            </button>
          </div>
          {aiMsg?<p style={{fontSize:12,color:"#555",lineHeight:1.7}}>{aiMsg}</p>:<p style={{fontSize:12,color:"#888",fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu dia.</p>}
        </div>
      )}
      {turnosAnt.length>0&&<>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,margin:"16px 0 8px"}}>Histórico</p>
        {turnosAnt.map(t=><CardTurno key={t.id} t={t}/>)}
      </>}
    </div>
  );
}

// FORM ABASTECIMENTO
function FormAbast({titulo,dados,setDados,onSalvar,onCancelar,loading}){
  const isGNV=dados.tipo==="GNV";
  const quant=parseN(dados.litros);
  const kmlF=quant>0?parseN(dados.km_rod)/quant:0;
  const unidade=isGNV?"m³":"L";
  const labelQuant=isGNV?"m³ abastecidos":"Litros abastecidos";
  const labelPreco=isGNV?"Preço por m³ (R$)":"Preço por litro (R$)";
  const labelCalc=isGNV?"km/m³":"km/L";
  return(
    <Card style={{border:"1px dashed #CCC",marginBottom:14}}>
      <p style={{fontSize:13,fontWeight:600,marginBottom:8}}>{titulo}</p>
      <Lbl c="Tipo de combustível"/>
      <div style={{display:"flex",border:"1px solid #DDD",borderRadius:8,overflow:"hidden",marginBottom:4}}>
        {[["Gasolina","⛽"],["Álcool","🌿"],["GNV","🔵"]].map(([t,ic])=>(
          <button key={t} onClick={()=>setDados(f=>({...f,tipo:t}))}
            style={{flex:1,padding:"9px 4px",border:"none",cursor:"pointer",fontSize:12,background:dados.tipo===t?"#1A1A1A":"#FFF",color:dados.tipo===t?"#FFF":"#555",fontWeight:dados.tipo===t?600:400}}>
            {ic} {t}
          </button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Data" type="date" value={dados.data} onChange={v=>setDados(f=>({...f,data:v}))}/>
        <Inp label={labelPreco} type="number" value={dados.preco} onChange={v=>setDados(f=>({...f,preco:v}))} placeholder="4.89"/>
        <Inp label={labelQuant} type="number" value={dados.litros} onChange={v=>setDados(f=>({...f,litros:v}))} placeholder={isGNV?"8.0":"40.0"}/>
        <Inp label="KM rodado" type="number" value={dados.km_rod} onChange={v=>setDados(f=>({...f,km_rod:v}))} placeholder="280"/>
      </div>
      {kmlF>0&&(
        <div style={{marginTop:10,background:"#E3F2FD",borderRadius:8,padding:10,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,textAlign:"center"}}>
          {[[labelCalc,fmt(kmlF)],[`R$/${isGNV?"m³":"km"}`,"R$"+fmt(parseN(dados.preco)/kmlF,3)],["Total",fmtR(parseN(dados.litros)*parseN(dados.preco))]].map(([l,v])=>(
            <div key={l}><div style={{fontSize:15,fontWeight:700,color:"#1565C0"}}>{v}</div><div style={{fontSize:10,color:"#666"}}>{l}</div></div>
          ))}
        </div>
      )}
      <p style={{fontSize:11,color:"#999",textAlign:"center",marginTop:8,fontStyle:"italic"}}>{labelCalc} = km rodado ÷ {isGNV?"m³":"litros"}</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}>
        <Btn sec onClick={onCancelar}>Cancelar</Btn>
        <Btn onClick={onSalvar} disabled={loading}>{loading?"Salvando...":"Salvar"}</Btn>
      </div>
    </Card>
  );
}

// COMBUSTÍVEL
function TelaCombustivel({abastecimentos,cfg,userId,onAdd,onUpdate}){
  const[form,setForm]=useState({data:hoje(),tipo:"Gasolina",km_rod:"",litros:"",preco:""});
  const[mostrar,setMostrar]=useState(false);
  const[editando,setEditando]=useState(null);
  const[loading,setLoading]=useState(false);
  const media=abastecimentos.length>0?abastecimentos.reduce((s,a)=>s+parseN(a.km_rod)/Math.max(0.01,parseN(a.litros)),0)/abastecimentos.length:0;
  const totalGasto=abastecimentos.reduce((s,a)=>s+parseN(a.litros)*parseN(a.preco),0);
  const totalLitros=abastecimentos.reduce((s,a)=>s+parseN(a.litros),0);
  const mediaCkm=media>0&&abastecimentos.length>0?(abastecimentos.reduce((s,a)=>s+parseN(a.preco),0)/abastecimentos.length)/media:0;
  const salvar=async()=>{
    if(!form.km_rod||!form.litros||!form.preco)return alert("Preencha km rodado, quantidade e preço.");
    setLoading(true);
    const{data,error}=await supabase.from("abastecimentos").insert({user_id:userId,data:form.data,tipo:form.tipo,km_rod:parseN(form.km_rod),litros:parseN(form.litros),preco:parseN(form.preco)}).select().single();
    if(!error){onAdd(data);setMostrar(false);setForm({data:hoje(),tipo:"Gasolina",km_rod:"",litros:"",preco:""});}
    else alert("Erro: "+error.message);
    setLoading(false);
  };
  const salvarEd=async()=>{
    setLoading(true);
    const{data,error}=await supabase.from("abastecimentos").update({data:editando.data,tipo:editando.tipo,km_rod:parseN(editando.km_rod),litros:parseN(editando.litros),preco:parseN(editando.preco)}).eq("id",editando.id).select().single();
    if(!error){onUpdate(data);setEditando(null);}else alert("Erro: "+error.message);
    setLoading(false);
  };
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontSize:12,color:"#888"}}>Controle de consumo</p>
        <button onClick={()=>{setMostrar(!mostrar);setEditando(null);}} style={{padding:"7px 14px",background:"#1A1A1A",color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>+ Registrar</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        {[["Média km/L",fmt(media)],["Custo médio/km","R$"+fmt(mediaCkm,3)],["Total volume",fmt(totalLitros,1)],["Total gasto",fmtR(totalGasto)]].map(([l,v])=>(
          <Card key={l} style={{padding:10,textAlign:"center"}}><div style={{fontSize:15,fontWeight:700,color:"#1565C0"}}>{v}</div><div style={{fontSize:10,color:"#999",marginTop:2}}>{l}</div></Card>
        ))}
      </div>
      {abastecimentos.length>1&&(
        <Card style={{marginBottom:14}}>
          <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Evolução km/L (ou km/m³)</p>
          <BarChart color="#1565C0" data={[...abastecimentos].reverse().map(a=>({v:parseFloat((parseN(a.km_rod)/Math.max(0.01,parseN(a.litros))).toFixed(2)),l:dataFmt(a.data).slice(0,5)}))}/>
        </Card>
      )}
      {mostrar&&<FormAbast titulo="Novo abastecimento" dados={form} setDados={setForm} onSalvar={salvar} onCancelar={()=>setMostrar(false)} loading={loading}/>}
      {editando&&<FormAbast titulo={`Editar — ${dataFmt(editando.data)}`} dados={editando} setDados={setEditando} onSalvar={salvarEd} onCancelar={()=>setEditando(null)} loading={loading}/>}
      <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Histórico</p>
      {abastecimentos.length===0&&<p style={{color:"#AAA",textAlign:"center",padding:24,fontSize:13}}>Nenhum abastecimento registrado.</p>}
      {abastecimentos.map(a=>{
        const kmlA=parseN(a.litros)>0?parseN(a.km_rod)/parseN(a.litros):0;
        const ic=a.tipo==="Gasolina"?"⛽":a.tipo==="Álcool"?"🌿":"🔵";
        const un=a.tipo==="GNV"?"m³":"L";
        return(
          <Card key={a.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:13,fontWeight:600}}>{dataFmt(a.data)}</span>
                <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,border:"1px solid #EEE",color:"#666"}}>{ic} {a.tipo}</span>
              </div>

// COMPARATIVO
function TelaComparativo({turnos,cfg}){
  const semanas=useMemo(()=>{
    if(!turnos.length)return[];
    const porDia={};
    turnos.forEach(t=>{
      if(!porDia[t.data])porDia[t.data]={bruto:0,km:0,hrs:0,viagens:0};
      porDia[t.data].bruto+=parseN(t.bruto)+parseN(t.bonus);
      porDia[t.data].km+=parseN(t.km_f)-parseN(t.km_i);
      porDia[t.data].hrs+=horasDiff(t.h_i,t.h_f);
      porDia[t.data].viagens+=parseN(t.viagens);
    });
    const dias=Object.keys(porDia).sort();
    const sems=[];
    for(let i=0;i<dias.length;i+=7){
      const bloco=dias.slice(i,i+7);
      sems.push({label:`${dataFmt(bloco[0]).slice(0,5)}`,dias:bloco.map(d=>({data:d,...porDia[d]}))});
    }
    return sems.reverse();
  },[turnos]);
  const[semA,setSemA]=useState(0);const[semB,setSemB]=useState(1);const[metrica,setMetrica]=useState("r_km");
  if(semanas.length<2)return(
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center",color:"#AAA",flexDirection:"column",gap:12}}>
      <div style={{fontSize:40}}>📊</div><p style={{fontSize:14}}>Registre pelo menos 2 semanas para comparar.</p>
    </div>
  );
  const DIAS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const getSemDias=(idx)=>{
    const sem=semanas[idx];if(!sem)return[];
    return sem.dias.map(d=>({ds:diaSemana(d.data),r_km:d.km>0?d.bruto/d.km:0,r_hr:d.hrs>0?d.bruto/d.hrs:0,bruto:d.bruto,viagens:d.viagens}));
  };
  const diasA=getSemDias(semA);const diasB=getSemDias(semB);
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Comparar semanas</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div><Lbl c="Semana A (azul)"/>
          <select value={semA} onChange={e=>setSemA(parseInt(e.target.value))} style={{width:"100%",border:"1px solid #DDD",borderRadius:8,padding:"9px 10px",fontSize:13,background:"#FAFAFA",outline:"none"}}>
            {semanas.map((s,i)=><option key={i} value={i}>{s.label}</option>)}
          </select></div>
        <div><Lbl c="Semana B (verde)"/>
          <select value={semB} onChange={e=>setSemB(parseInt(e.target.value))} style={{width:"100%",border:"1px solid #DDD",borderRadius:8,padding:"9px 10px",fontSize:13,background:"#FAFAFA",outline:"none"}}>
            {semanas.map((s,i)=><option key={i} value={i}>{s.label}</option>)}
          </select></div>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["r_km","R$/km"],["r_hr","R$/hora"],["bruto","Bruto"]].map(([v,l])=>(
          <button key={v} onClick={()=>setMetrica(v)} style={{padding:"7px 10px",borderRadius:7,border:"1px solid #DDD",background:metrica===v?"#1A1A1A":"#FFF",color:metrica===v?"#FFF":"#555",fontSize:12,fontWeight:600,cursor:"pointer",flex:1}}>{l}</button>
        ))}
      </div>
      {/* Gráfico */}
      <Card style={{marginBottom:14}}>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>{metrica==="r_km"?"R$/km":metrica==="r_hr"?"R$/hora":"Bruto"} — dia a dia</p>
        <div style={{display:"flex",gap:4}}>
          {DIAS.map(ds=>{
            const dA=diasA.find(d=>d.ds===ds);const dB=diasB.find(d=>d.ds===ds);
            const vA=dA?dA[metrica]:0;const vB=dB?dB[metrica]:0;
            const max=Math.max(vA,vB,1);
            return(
              <div key={ds} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:70}}>
                  <div style={{flex:1,height:Math.max(2,(vA/max)*65),background:"#1565C0",borderRadius:"3px 3px 0 0",opacity:0.85}}/>
                  <div style={{flex:1,height:Math.max(2,(vB/max)*65),background:"#4CAF50",borderRadius:"3px 3px 0 0",opacity:0.85}}/>
                </div>
                <div style={{fontSize:8,color:"#999"}}>{ds}</div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:16,marginTop:10,justifyContent:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:10,background:"#1565C0",borderRadius:2}}/><span style={{fontSize:11,color:"#555"}}>{semanas[semA]?.label}</span></div>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:10,height:10,background:"#4CAF50",borderRadius:2}}/><span style={{fontSize:11,color:"#555"}}>{semanas[semB]?.label}</span></div>
        </div>
      </Card>
      {/* Tabela dia a dia */}
      <Card style={{marginBottom:14}}>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Detalhamento — {metrica==="r_km"?"R$/km":metrica==="r_hr"?"R$/hora":"Bruto"}</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:4,marginBottom:6,paddingBottom:6,borderBottom:"1px solid #F0F0F0"}}>
          {["Dia","Sem A","Viag A","Sem B","Dif."].map(h=><div key={h} style={{fontSize:9,fontWeight:700,color:"#888",textAlign:"center"}}>{h}</div>)}
        </div>
        {DIAS.map(ds=>{
          const dA=diasA.find(d=>d.ds===ds);const dB=diasB.find(d=>d.ds===ds);
          if(!dA&&!dB)return null;
          const vA=dA?dA[metrica]:null;const vB=dB?dB[metrica]:null;
          const diff=vA&&vA>0&&vB!=null?((vB-vA)/vA)*100:null;
          return(
            <div key={ds} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:4,padding:"6px 0",borderBottom:"1px solid #F9F9F9",alignItems:"center"}}>
              <div style={{fontSize:12,fontWeight:600,color:"#333",textAlign:"center"}}>{ds}</div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:"#1565C0"}}>{vA&&vA>0?fmtR(vA):"—"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,color:"#888"}}>{dA?dA.viagens+"v":"—"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:"#4CAF50"}}>{vB&&vB>0?fmtR(vB):"—"}</span></div>
              <div style={{textAlign:"center"}}>
                {diff!=null?<span style={{fontSize:10,fontWeight:700,padding:"2px 4px",borderRadius:4,background:diff>=0?"#E8F5E9":"#FFEBEE",color:diff>=0?"#2E7D32":"#C62828"}}>{diff>=0?"+":""}{fmt(diff,1)}%</span>:<span style={{fontSize:10,color:"#CCC"}}>—</span>}
              </div>
            </div>
          );
        })}
        {/* Totais */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:4,paddingTop:8,marginTop:4,borderTop:"2px solid #EEE"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#555",textAlign:"center"}}>Méd.</div>
          <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:"#1565C0"}}>{(()=>{const v=diasA.filter(d=>d[metrica]>0);return v.length?fmtR(v.reduce((s,d)=>s+d[metrica],0)/v.length):"—";})()}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:10,color:"#888"}}>{diasA.length?diasA.reduce((s,d)=>s+d.viagens,0)+"v":"—"}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:11,fontWeight:700,color:"#4CAF50"}}>{(()=>{const v=diasB.filter(d=>d[metrica]>0);return v.length?fmtR(v.reduce((s,d)=>s+d[metrica],0)/v.length):"—";})()}</span></div>
          <div style={{textAlign:"center"}}>{(()=>{
            const mA=diasA.filter(d=>d[metrica]>0);const mB=diasB.filter(d=>d[metrica]>0);
            if(!mA.length||!mB.length)return<span style={{fontSize:10,color:"#CCC"}}>—</span>;
            const vA=mA.reduce((s,d)=>s+d[metrica],0)/mA.length;const vB=mB.reduce((s,d)=>s+d[metrica],0)/mB.length;
            const d=vA>0?((vB-vA)/vA)*100:0;
            return<span style={{fontSize:10,fontWeight:700,padding:"2px 4px",borderRadius:4,background:d>=0?"#E8F5E9":"#FFEBEE",color:d>=0?"#2E7D32":"#C62828"}}>{d>=0?"+":""}{fmt(d,1)}%</span>;
          })()}</div>
        </div>
      </Card>
    </div>
  );
}

          <button onClick={pedirIA} disabled={loadingAI} style={{padding:"5px 10px",fontSize:11,background:"#1A1A1A",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",opacity:loadingAI?0.6:1}}>{loadingAI?"Analisando...":"Analisar ↗"}</button>
        </div>
        {aiMsg?<p style={{fontSize:12,color:"#555",lineHeight:1.8}}>{aiMsg}</p>:<p style={{fontSize:12,color:"#888",fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu ciclo.</p>}
      </div>
    </div>
  );
}

// ADMIN
function TelaAdmin({onSair}){
  const[usuarios,setUsuarios]=useState([]);const[loading,setLoading]=useState(true);
  const[busca,setBusca]=useState("");const[filtro,setFiltro]=useState("todos");
  useEffect(()=>{supabase.from("usuarios_controle").select("*").order("data_cadastro",{ascending:false}).then(({data})=>{if(data)setUsuarios(data);setLoading(false);});},[]);
  const toggleAtivo=async(u)=>{
    const n=!u.ativo;
    await supabase.from("usuarios_controle").update({ativo:n,data_ativacao:n?new Date().toISOString():null}).eq("id",u.id);
    setUsuarios(p=>p.map(x=>x.id===u.id?{...x,ativo:n}:x));
  };
  const filtrados=usuarios.filter(u=>{
    const mb=(u.email||"").toLowerCase().includes(busca.toLowerCase())||(u.nome||"").toLowerCase().includes(busca.toLowerCase());
    const mf=filtro==="todos"||(filtro==="ativos"&&u.ativo)||(filtro==="pendentes"&&!u.ativo&&!u.admin);
    return mb&&mf;
  });
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontSize:12,color:"#AAA"}}>Gerenciar usuários</p>
        <button onClick={onSair} style={{fontSize:12,color:"#AAA",background:"none",border:"1px solid #444",borderRadius:6,padding:"5px 10px",cursor:"pointer"}}>← Sair do admin</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
        {[["Total",usuarios.filter(u=>!u.admin).length],["Ativos",usuarios.filter(u=>u.ativo&&!u.admin).length],["Pendentes",usuarios.filter(u=>!u.ativo&&!u.admin).length]].map(([l,v])=>(
          <div key={l} style={{background:"#222",borderRadius:10,padding:10,textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:700,color:l==="Pendentes"&&v>0?"#FF6B6B":l==="Ativos"?"#69DB7C":"#FFF"}}>{v}</div>
            <div style={{fontSize:10,color:"#888",marginTop:2}}>{l}</div>
          </div>
        ))}
      </div>
      <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar" style={{width:"100%",border:"1px solid #333",borderRadius:8,padding:"9px 12px",fontSize:13,background:"#222",color:"#FFF",outline:"none",boxSizing:"border-box",marginBottom:10}}/>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {["todos","ativos","pendentes"].map(f=>(
          <button key={f} onClick={()=>setFiltro(f)} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #333",background:filtro===f?"#FFF":"#222",color:filtro===f?"#111":"#AAA",fontSize:12,cursor:"pointer",flex:1,textTransform:"capitalize"}}>{f}</button>
        ))}
      </div>
      {loading&&<p style={{textAlign:"center",color:"#AAA",padding:20}}>Carregando...</p>}
      {filtrados.filter(u=>!u.admin).map(u=>(
        <div key={u.id} style={{background:"#1A1A1A",border:`1px solid ${u.ativo?"#2E7D32":"#7B5A00"}`,borderRadius:10,padding:12,marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <div>
              <p style={{fontSize:13,fontWeight:600,color:"#FFF"}}>{u.nome||"Sem nome"}</p>
              <p style={{fontSize:11,color:"#888"}}>{u.email}</p>
              <p style={{fontSize:10,color:"#666",marginTop:2}}>Cadastro: {u.data_cadastro?new Date(u.data_cadastro).toLocaleDateString("pt-BR"):"—"}</p>
            </div>
            <button onClick={()=>toggleAtivo(u)} style={{padding:"7px 12px",borderRadius:8,border:"none",background:u.ativo?"#7B1010":"#1B4332",color:u.ativo?"#FF6B6B":"#69DB7C",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              {u.ativo?"⛔ Desativar":"✅ Ativar"}
            </button>
          </div>
          <input defaultValue={u.observacoes||""} onBlur={e=>supabase.from("usuarios_controle").update({observacoes:e.target.value}).eq("id",u.id)} placeholder="Observações (ex: Pagou em 10/05)"
            style={{width:"100%",border:"1px solid #333",borderRadius:6,padding:"7px 10px",fontSize:12,background:"#111",color:"#FFF",outline:"none",boxSizing:"border-box"}}/>
        </div>
      ))}
    </div>
  );
}

// APP PRINCIPAL
function App(){
  const[session,setSession]=useState(null);const[loading,setLoading]=useState(true);
  const[nav,setNav]=useState("dashboard");
  const[cfg,setCfg]=useState(CFG0);const[turnos,setTurnos]=useState([]);const[abast,setAbast]=useState([]);
  const[controle,setControle]=useState(null);const[telaAdmin,setTelaAdmin]=useState(false);
  const isAdmin=session?.user?.email===ADMIN_EMAIL;

  const carregarDados=async(uid)=>{
    setLoading(true);
    try{
      const{data:ctrl}=await supabase.from("usuarios_controle").select("*").eq("user_id",uid).single();
      setControle(ctrl||null);
      const[{data:c},{data:t},{data:a}]=await Promise.all([
        supabase.from("configuracoes").select("*").eq("user_id",uid).single(),
        supabase.from("turnos").select("*").eq("user_id",uid).order("data",{ascending:false}).order("num",{ascending:false}),
        supabase.from("abastecimentos").select("*").eq("user_id",uid).order("data",{ascending:false}),
      ]);
      if(c)setCfg(c);if(t)setTurnos(t);if(a)setAbast(a);
    }catch(e){console.warn(e);}
    setLoading(false);
  };

  useEffect(()=>{
    const timer=setTimeout(()=>setLoading(false),6000);
    supabase.auth.getSession().then(({data:{session}})=>{
      clearTimeout(timer);setSession(session);
      if(session)carregarDados(session.user.id);else setLoading(false);
    }).catch(()=>{clearTimeout(timer);setLoading(false);});
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_,s)=>{setSession(s);if(s)carregarDados(s.user.id);});
    return()=>subscription.unsubscribe();
  },[]);

  const sair=async()=>{await supabase.auth.signOut();setSession(null);setTurnos([]);setAbast([]);setCfg(CFG0);setControle(null);setTelaAdmin(false);};

  const navItems=[
    {id:"dashboard",icon:"▦",label:"Dashboard"},
    {id:"diario",icon:"📋",label:"Diário"},
    {id:"combustivel",icon:"⛽",label:"Combust."},
    {id:"comparativo",icon:"📊",label:"Comparar"},
    {id:"historico",icon:"🗂️",label:"Histórico"},
    {id:"config",icon:"⚙️",label:"Config."},
  ];

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:12}}>
      <div style={{fontSize:36}}>🚗</div>
      <p style={{color:"#888",fontSize:14,fontFamily:"Georgia,serif"}}>Car    </div>
  );

  if(!session)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:"#FAFAFA",fontFamily:"Georgia,serif"}}>
      <TelaAuth onLogado={()=>supabase.auth.getSession().then(({data:{session}})=>{if(session)carregarDados(session.user.id);})}/>
    </div>
  );

  if(telaAdmin&&isAdmin)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:"#111",fontFamily:"Georgia,serif"}}>
      <div style={{padding:"14px 16px 12px",borderBottom:"1px solid #222",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{fontSize:18,fontWeight:700,color:"#FFF",margin:0}}>&#128272; Por km Admin</h1>
        <button onClick={sair} style={{background:"none",border:"none",color:"#AAA",fontSize:12,cursor:"pointer"}}>Sair</button>
      </div>
      <TelaAdmin onSair={()=>setTelaAdmin(false)}/>
    </div>
  );

  if(controle&&!controle.ativo&&!isAdmin)return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:"#FAFAFA",fontFamily:"Georgia,serif"}}>
      <TelaAguardando onSair={sair}/>
    </div>
  );

  return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100%",display:"flex",flexDirection:"column",background:"#FAFAFA",fontFamily:"Georgia,serif"}}>
      <div style={{padding:"12px 16px 10px",borderBottom:"1px solid #E8E8E8",background:"#FFF",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h1 style={{fontSize:20,fontWeight:700,color:"#111",margin:0}}>Por km</h1>
        <span style={{fontSize:12,color:"#888"}}>{navItems.find(n=>n.id===nav)?.label}</span>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {isAdmin&&<button onClick={()=>setTelaAdmin(true)} style={{fontSize:11,background:"#1A1A1A",color:"#fff",border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer"}}>&#128274; Admin</button>}
          <button onClick={sair} style={{background:"none",border:"none",color:"#AAA",fontSize:12,cursor:"pointer"}}>Sair</button>
        </div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {nav==="dashboard"&&<TelaDashboard turnos={turnos} abastecimentos={abast} cfg={cfg}/>}
        {nav==="diario"&&<TelaDiario turnos={turnos} cfg={cfg} userId={session.user.id} onAdd={t=>setTurnos(p=>[t,...p])} onUpdate={t=>setTurnos(p=>p.map(x=>x.id===t.id?t:x))}/>}
        {nav==="combustivel"&&<TelaCombustivel abastecimentos={abast} cfg={cfg} userId={session.user.id} onAdd={a=>setAbast(p=>[a,...p])} onUpdate={a=>setAbast(p=>p.map(x=>x.id===a.id?a:x))}/>}
        {nav==="comparativo"&&<TelaComparativo turnos={turnos} cfg={cfg}/>}
        {nav==="historico"&&<TelaHistorico turnos={turnos} abastecimentos={abast} cfg={cfg}/>}
        {nav==="config"&&<TelaConfig cfg={cfg} userId={session.user.id} onSalvo={c=>setCfg(c)}/>}
      </div>
      <div style={{display:"flex",borderTop:"1px solid #E8E8E8",background:"#FFF",flexShrink:0,overflowX:"auto"}}>
        {navItems.map(n=>(
          <button key={n.id} onClick={()=>setNav(n.id)}
            style={{flex:1,minWidth:52,padding:"8px 2px 6px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:16}}>{n.icon}</span>
            <span style={{fontSize:8,color:nav===n.id?"#111":"#AAA",fontFamily:"Arial,sans-serif",fontWeight:nav===n.id?700:400,whiteSpace:"nowrap"}}>{n.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
