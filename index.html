// -- offline ----------------------------------------------------
// Copia local dos dados (o app abre sem internet) e fila das gravacoes feitas sem sinal,
// enviada sozinha quando a conexao volta.
const LOCAL={
  ler(k,padrao){try{const v=localStorage.getItem(k);return v?JSON.parse(v):padrao;}catch(e){return padrao;}},
  gravar(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  apagar(k){try{localStorage.removeItem(k);}catch(e){}}
};
const chaveCache=(uid)=>"porkm_dados_"+uid;
const CHAVE_FILA="porkm_fila";
function novoId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16);});

// sem sinal x erro de verdade do banco (este nao entra na fila)
function ehFalhaDeRede(error){
  if(!navigator.onLine)return true;
  return/Failed to fetch|NetworkError|Load failed|network request failed|fetch failed/i.test(String(error?.message||error||""));
}
let _avisarFila=null; // o App mostra quantos registros aguardam envio
function filaPendentes(){return LOCAL.ler(CHAVE_FILA,[]);}
function salvarFila(f){LOCAL.gravar(CHAVE_FILA,f);if(_avisarFila)_avisarFila(f.length);}

// Grava no Supabase; sem sinal, guarda na fila e devolve a linha como ela vai ficar.
// op: "insert" (dados ja com id) | "update" | "delete"; atual = linha antes da mudanca
async function gravarDados(tabela,op,id,dados,atual){
  if(navigator.onLine){
    try{
      const r=op==="insert"?await sb.from(tabela).insert(dados).select().single()
        :op==="update"?await sb.from(tabela).update(dados).eq("id",id).select().single()
        :await sb.from(tabela).delete().eq("id",id);
      if(!r.error||!ehFalhaDeRede(r.error))return r;
    }catch(e){if(!ehFalhaDeRede(e))return{data:null,error:e};}
  }
  const fila=filaPendentes();
  // registro criado sem sinal e ainda na fila: a mudanca entra nele mesmo
  const i=fila.findIndex(x=>x.tabela===tabela&&x.id===id&&x.op==="insert");
  if(i>=0&&op==="update")fila[i].dados={...fila[i].dados,...dados};
  else if(i>=0&&op==="delete")fila.splice(i,1);
  else fila.push({tabela,op,id,dados,quando:Date.now()});
  salvarFila(fila);
  avisar("Sem internet: salvo no celular. Envia sozinho quando o sinal voltar.");
  return{data:op==="delete"?null:{...(atual||{}),...dados,id},error:null,offline:true};
}
// Envia a fila na ordem. Para no primeiro erro de rede; erro do banco descarta o item e avisa.
let _sincronizando=false;
async function sincronizarFila(){
  if(_sincronizando||!navigator.onLine)return 0;
  _sincronizando=true;let enviados=0;
  try{
    while(filaPendentes().length){
      const it=filaPendentes()[0];
      let r;
      try{
        // upsert: se o envio anterior chegou mas a resposta se perdeu, nao duplica
        if(it.op==="insert")r=await sb.from(it.tabela).upsert(it.dados);
        else if(it.op==="update")r=await sb.from(it.tabela).update(it.dados).eq("id",it.id);
        else r=await sb.from(it.tabela).delete().eq("id",it.id);
      }catch(e){r={error:e};}
      if(r.error&&ehFalhaDeRede(r.error))break;
      if(r.error)avisar("Um registro feito sem internet não pôde ser enviado: "+r.error.message);
      else enviados++;
      salvarFila(filaPendentes().slice(1));
    }
  }finally{_sincronizando=false;}
  return enviados;
}

// -- utils ------------------------------------------------------
function fmt(n,dec=2){if(n==null||isNaN(n))return"--";return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtR(n){return(n==null||isNaN(n))?"--":(n<0?"−R$ "+fmt(-n):"R$ "+fmt(n));}
function parseN(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
function fmtHora(h){if(!h||h<=0)return"0h00m";const hh=Math.floor(h);const mm=Math.round((h-hh)*60);return hh+"h"+(mm<10?"0":"")+mm+"m";}
// turno que vira a meia-noite (22:00 -> 02:00) soma 24h no fim
function horasDiff(h1,h2){if(!h1||!h2)return 0;const[a,b]=[h1,h2].map(h=>{const[hh,mm]=h.split(":").map(Number);return hh*60+mm;});if(isNaN(a)||isNaN(b))return 0;return((b<a?b+1440:b)-a)/60;}
// data AAAA-MM-DD no horario do aparelho (toISOString usa UTC e adianta o dia depois das 21h)
function isoLocal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function hoje(){return isoLocal(new Date());}
function turnoEstaAberto(t){return t.km_i&&(!parseN(t.km_f)||!parseN(t.bruto));}
function dataFmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y;}
// Analise IA: roda na Edge Function "analise-ia" do Supabase, que guarda a chave da Anthropic.
// O navegador so manda os numeros; o texto do pedido e montado no servidor.
async function pedirAnalise(tipo,dados){
  try{
    const{data,error}=await sb.functions.invoke("analise-ia",{body:{tipo,dados}});
    if(error)return"Não foi possível conectar à IA.";
    return data?.texto||data?.erro||"Sem resposta.";
  }catch{return"Não foi possível conectar à IA.";}
}
function diaSemana(d){return["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(d+"T12:00:00").getDay()];}

const CFG0={meta_km:2.30,meta_hora:39.00,parcela:0,ipva:0,seguro:0,pneu_total:1000,pneu_km:60000,revisao_km:0.30,emergencia_km:0.12,autonomia:7.0,preco_litro:4.89,dia_ciclo:1,usar_media_comb:false};

// -- ciclo ------------------------------------------------------
function calcCiclo(dia){
  const d=parseInt(dia)||1,ag=new Date(),dc=ag.getDate();
  let ini,fim;
  if(dc>=d){ini=new Date(ag.getFullYear(),ag.getMonth(),d);fim=new Date(ag.getFullYear(),ag.getMonth()+1,d-1);}
  else{ini=new Date(ag.getFullYear(),ag.getMonth()-1,d);fim=new Date(ag.getFullYear(),ag.getMonth(),d-1);}
  return{ini:isoLocal(ini),fim:isoLocal(fim)};
}

function gerarCiclos(dia,turnos){
  if(!turnos.length)return[];
  const d=parseInt(dia)||1;
  const datas=turnos.map(t=>t.data).sort();
  const primeira=new Date(datas[0]+"T12:00:00");
  const ciclos=[];
  let ini=new Date(primeira.getFullYear(),primeira.getMonth(),d);
  if(ini>primeira)ini=new Date(primeira.getFullYear(),primeira.getMonth()-1,d);
  for(let i=0;i<24;i++){
    const fim=new Date(ini.getFullYear(),ini.getMonth()+1,d-1);
    const iniStr=isoLocal(ini);
    const fimStr=isoLocal(fim);
    if(iniStr>hoje())break;
    ciclos.push({ini:iniStr,fim:fimStr,label:dataFmt(iniStr)+" a "+dataFmt(fimStr)});
    ini=new Date(ini.getFullYear(),ini.getMonth()+1,d);
  }
  return ciclos.reverse();
}

// -- calculos --------------------------------------------------
// custos salvos para o ciclo que contem a data; sem registro, usa a config geral
function custosDaData(custosCiclos,data,cfg){
  return(custosCiclos&&custosCiclos.find(c=>data>=c.ciclo_ini&&data<=(c.ciclo_fim||c.ciclo_ini)))||cfg;
}
// km/L e preco medio ponderados: total de km / total de litros
function mediaAbast(lista){
  const litros=lista.reduce((s,a)=>s+parseN(a.litros),0);
  const km=lista.reduce((s,a)=>s+parseN(a.km_rod),0);
  const gasto=lista.reduce((s,a)=>s+parseN(a.litros)*parseN(a.preco),0);
  return{kmL:litros>0?km/litros:0,preco:litros>0?gasto/litros:0};
}
// parte dos custos fixos mensais que cabe no periodo: ciclo completo = 1, senao proporcional aos dias
function fatorFixo(ini,fim,diaCiclo){
  const d=parseInt(diaCiclo)||1;
  const i=new Date(ini+"T12:00:00");
  const fimCiclo=isoLocal(new Date(i.getFullYear(),i.getMonth()+1,d-1));
  if(i.getDate()===d&&fim===fimCiclo)return 1;
  const dias=Math.round((new Date(fim+"T12:00:00")-i)/86400000)+1;
  return Math.max(0,dias)/30.4375;
}
function calcPeriodo(turnos,abast,cfg,ini,fim,custosCiclo){
  const cc=custosCiclo||cfg; // usa custos do ciclo se disponivel, senao usa cfg global
  const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);
  const dias=[...new Set(mes.map(t=>t.data))].length;
  const km_total=mes.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
  const hrs_total=mes.reduce((s,t)=>s+horasDiff(t.h_i,t.h_f),0);
  const bruto=mes.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const viagens=mes.reduce((s,t)=>s+parseN(t.viagens),0);
  const abastP=abast.filter(a=>a.data&&a.data>=ini&&a.data<=fim);
  let kmL=parseN(cc.autonomia)||7,precoComb=parseN(cc.preco_litro)||5,comb_real=false;
  if(cfg.usar_media_comb&&abastP.length>0){
    const m=mediaAbast(abastP);
    if(m.kmL>0){kmL=m.kmL;precoComb=m.preco;comb_real=true;}
  }
  const comb_total=kmL>0?(km_total/kmL)*precoComb:0;
  const pneu_t=km_total*(parseN(cc.pneu_total)/Math.max(1,parseN(cc.pneu_km)));
  const rev_t=km_total*parseN(cc.revisao_km);
  const emer_t=km_total*parseN(cc.emergencia_km);
  const fator_fixo=fatorFixo(ini,fim,cfg.dia_ciclo);
  const fixo=(parseN(cc.parcela)+parseN(cc.ipva)/12+parseN(cc.seguro)/12)*fator_fixo;
  const custos_var=comb_total+pneu_t+rev_t+emer_t;
  const custos=custos_var+fixo;
  return{dias,km_total,hrs_total,bruto,viagens,comb_total,comb_real,pneu_t,rev_t,emer_t,fixo,fator_fixo,custos_var,custos,lucro:bruto-custos,ini,fim,
    r_km:km_total>0?bruto/km_total:0,r_hr:hrs_total>0?bruto/hrs_total:0};
}

let _mostrarAviso=null;

function AvisosGlobais(){
  const[msg,setMsg]=useState("");
  useEffect(()=>{
    let t;
    _mostrarAviso=(m)=>{setMsg(m);clearTimeout(t);t=setTimeout(()=>setMsg(""),3500);};

}
// Ganho x meta: a barra enche ate a meta (risco = meta); o texto diz quanto acima/abaixo
function IEBar({label,real,meta,valor}){
  const ie=meta>0?real/meta:0,ok=ie>=1,dif=(ie-1)*100;
  return <div style={{marginBottom:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6,gap:8}}>
      <span style={{fontSize:13,color:K.muted}}>{label} · meta {fmtR(meta)}</span>
      <span style={{fontSize:15,fontWeight:700,color:ok?K.ok:K.err,whiteSpace:"nowrap"}}>{valor}</span>
    </div>
    <div style={{height:6,background:K.sep,borderRadius:3,position:"relative"}}>
      <div style={{height:"100%",width:Math.min(100,ie*100)+"%",background:ok?K.ok:K.err,borderRadius:3,transition:"width .5s"}}/>
    </div>
    <div style={{fontSize:12,color:ok?K.ok:K.err,marginTop:4,textAlign:"right"}}>
      {meta>0&&real>0?(ok?"▲ ":"▼ ")+fmt(Math.abs(dif),0)+"% "+(ok?"acima":"abaixo")+" da meta":"sem dados"}
    </div>
  </div>;
}
// Grafico Kindle -- barras cinza escuro
function BarChart({data,fmtV}){
  const max=Math.max(...data.map(d=>Math.abs(d.v)),1);
  const fB=fmtV||((v)=>v>=1000?"R$"+fmt(v/1000,1)+"k":"R$"+Math.round(v));
  return <div style={{display:"flex",alignItems:"flex-end",gap:3,height:100,padding:"0 2px"}}>
    {data.map((d,i)=>(
      <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
        <div style={{fontSize:12,color:K.text,fontWeight:600,textAlign:"center",lineHeight:1.2}}>{d.v>0?fB(d.v):""}</div>
        <div style={{width:"100%",height:Math.max(3,(Math.abs(d.v)/max)*62),background:d.v>=0?K.bar:K.bar2,borderRadius:"1px 1px 0 0"}}/>
        <div style={{fontSize:12,color:K.muted,textAlign:"center"}}>{d.l}</div>
      </div>
    ))}
  </div>;
}

function TelaAuth({onLogado}){
  const[modo,setModo]=useState("login");
  const[nome,setNome]=useState(""),[email,setEmail]=useState(""),[senha,setSenha]=useState(""),[tel,setTel]=useState("");
  const[loading,setLoading]=useState(false),[msg,setMsg]=useState("");
  const toast=(m)=>{setMsg(m);setTimeout(()=>setMsg(""),4000);};
  const entrar=async()=>{
    if(!email||!senha)return toast("Preencha e-mail e senha.");
    setLoading(true);
    const{error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error)toast(error.message==="Invalid login credentials"?"E-mail ou senha incorretos.":error.message);
    else{toast("Bem-vindo!");onLogado();}
    setLoading(false);
  };
  const recuperar=async()=>{
    if(!email)return toast("Digite seu e-mail primeiro.");
    setLoading(true);
    const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:"https://jefersondalci.github.io/por-km"});
    if(error)toast("Erro: "+error.message);else toast("E-mail de recuperação enviado!");
    setLoading(false);
  };
  const cadastrar=async()=>{
    if(!nome||!email||!senha)return toast("Preencha todos os campos.");
    if(senha.length<6)return toast("Senha precisa ter 6 caracteres.");
    setLoading(true);
    // nome e WhatsApp vao junto no cadastro; com confirmacao de e-mail ainda nao ha sessao aqui,
    // entao configuracoes e telefone sao completados no primeiro login (carregarDados)
    const{data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome,telefone:tel}}});
    if(error){toast(error.message);setLoading(false);return;}
    if(data.user&&data.session){
      await sb.from("configuracoes").upsert({user_id:data.user.id,...CFG0},{onConflict:"user_id",ignoreDuplicates:true});
      if(tel)await sb.from("usuarios_controle").update({telefone:tel,nome}).eq("user_id",data.user.id);
    }
    toast("Conta criada! Verifique seu e-mail.");setModo("login");setLoading(false);
  };
  return(
    <div style={{display:"flex",flexDirection:"column",justifyContent:"center",flex:1,padding:"32px 24px",overflowY:"auto"}}>
      <Toast msg={msg}/>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:64,height:64,background:K.card,border:"1px solid "+K.border,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}}><Icone nome="carro" tam={36} cor={K.text}/></div>
        <h1 style={{fontSize:28,fontWeight:700,color:K.text,margin:0}}>Por km</h1>
        <p style={{color:K.muted,fontSize:12,margin:"2px 0 0"}}>v1.7</p>
        <p style={{color:K.muted,fontSize:13,margin:"6px 0 0"}}>Controle financeiro para motoristas</p>
      </div>
      {modo==="cadastro"&&<>
        <Inp label="Seu nome" value={nome} onChange={setNome} placeholder="João Silva"/>
        <Inp label="WhatsApp (com DDD)" type="tel" value={tel} onChange={setTel} placeholder="21999999999"/>
      </>}
      <Inp label="E-mail" type="email" value={email} onChange={setEmail} placeholder="seu@email.com"/>
      <Inp label="Senha" type="password" value={senha} onChange={setSenha} placeholder="Mínimo 6 caracteres"/>
      <div style={{marginTop:20}}>
        {modo==="login"?<Btn onClick={entrar} disabled={loading}>{loading?"Entrando...":"Entrar"}</Btn>
          :<Btn onClick={cadastrar} disabled={loading}>{loading?"Criando...":"Criar minha conta"}</Btn>}
      </div>
      <button onClick={()=>setModo(modo==="login"?"cadastro":"login")}
        style={{marginTop:10,background:"none",border:"1px solid "+K.border,borderRadius:2,padding:11,fontSize:13,color:K.text,cursor:"pointer",width:"100%"}}>
        {modo==="login"?"Criar conta grátis":"Já tenho conta · Entrar"}
      </button>
      {modo==="login"&&<button onClick={recuperar} disabled={loading}
        style={{marginTop:8,background:"none",border:"none",fontSize:12,color:K.muted,cursor:"pointer",width:"100%",padding:"6px 0"}}>
        Esqueci minha senha
      </button>}
    </div>
  );
}

// "liberada", "pendente" (aguardando ativacao) ou "vencida" (passou do vencimento; vitalicio nunca vence)
function situacaoConta(controle,isAdmin){
  if(isAdmin||!controle)return"liberada";
  if(!controle.ativo)return"pendente";
  if(!controle.vitalicio&&controle.vencimento&&controle.vencimento<hoje())return"vencida";
  return"liberada";
}

const Ajuda=({t})=><p style={{fontSize:12,color:K.muted,lineHeight:1.5,marginTop:6}}>{t}</p>;

// tema fica so neste aparelho (localStorage); "auto" segue o modo claro/escuro do celular
function SeletorTema(){
  const ler=()=>{try{return localStorage.getItem("porkm_tema")||"auto";}catch(e){return"auto";}};
  const[tema,setTema]=useState(ler);
  const escolher=(t)=>{
    setTema(t);
    try{if(t==="auto")localStorage.removeItem("porkm_tema");else localStorage.setItem("porkm_tema",t);}catch(e){}
    if(t==="auto")document.documentElement.removeAttribute("data-tema");else document.documentElement.setAttribute("data-tema",t);
  };
  return(
    <div>
      <div style={{display:"flex",border:"1px solid "+K.border,borderRadius:2,overflow:"hidden"}}>
        {[["auto","Automático"],["claro","Claro"],["escuro","Escuro"]].map(([v,l])=>(
          <button key={v} onClick={()=>escolher(v)} aria-pressed={tema===v}
            style={{flex:1,padding:"11px 4px",border:"none",cursor:"pointer",fontSize:14,background:tema===v?K.text:K.card,color:tema===v?K.bg:K.muted,fontWeight:tema===v?700:400}}>{l}</button>
        ))}
      </div>
      <Ajuda t="Automático segue o modo do celular. O escuro cansa menos a vista dirigindo à noite."/>
    </div>
  );
}
function TelaConfig({cfg,userId,onSalvo,onSalvoCustos}){
  const[form,setForm]=useState({...CFG0,...cfg});
  const[loading,setLoading]=useState(false);
  const f=key=>({value:form[key]??"",onChange:v=>setForm(p=>({...p,[key]:v}))});
  const ca=calcCiclo(form.dia_ciclo||1);

  // Carrega custos do ciclo atual ao abrir
  useEffect(()=>{
    const carregar=async()=>{
      const{data}=await sb.from("custos_ciclo").select("*").eq("user_id",userId).eq("ciclo_ini",ca.ini).single();
      if(data){
        setForm(p=>({...p,parcela:data.parcela,ipva:data.ipva,seguro:data.seguro,
          pneu_total:data.pneu_total,pneu_km:data.pneu_km,revisao_km:data.revisao_km,
          emergencia_km:data.emergencia_km,autonomia:data.autonomia,preco_litro:data.preco_litro}));
      }
    };
    carregar();
  },[userId,ca.ini]);

  const salvar=async()=>{
    if(!navigator.onLine)return avisar("Sem internet: os ajustes só podem ser salvos com sinal.");
    setLoading(true);
    // Salva metas e ciclo na configuracoes (globais)
    const dadosGlobais={meta_km:parseN(form.meta_km),meta_hora:parseN(form.meta_hora),dia_ciclo:parseN(form.dia_ciclo)||1,usar_media_comb:!!form.usar_media_comb};
    const{data:ex}=await sb.from("configuracoes").select("id").eq("user_id",userId).single();
    if(ex){await sb.from("configuracoes").update(dadosGlobais).eq("user_id",userId);}
    else{await sb.from("configuracoes").insert({user_id:userId,...CFG0,...dadosGlobais});}

    // Salva custos SOMENTE para o ciclo atual (upsert)
    const dadosCiclo={user_id:userId,ciclo_ini:ca.ini,ciclo_fim:ca.fim,
      parcela:parseN(form.parcela),ipva:parseN(form.ipva),seguro:parseN(form.seguro),
      pneu_total:parseN(form.pneu_total),pneu_km:parseN(form.pneu_km),
      revisao_km:parseN(form.revisao_km),emergencia_km:parseN(form.emergencia_km),
      autonomia:parseN(form.autonomia),preco_litro:parseN(form.preco_litro)};
    await sb.from("custos_ciclo").upsert(dadosCiclo,{onConflict:"user_id,ciclo_ini"});

    // Recarrega config global e custos do ciclo
    const{data:novo}=await sb.from("configuracoes").select("*").eq("user_id",userId).single();
    if(novo)onSalvo(novo);
    // Recarrega custos do ciclo para atualizar o dashboard
    const{data:cc}=await sb.from("custos_ciclo").select("*").eq("user_id",userId);
    if(cc)onSalvoCustos(cc);
    setLoading(false);avisar("Ajustes salvos para o ciclo atual.");
  };
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <SecTitle t="Metas de ganho"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Meta R$/km" type="number" {...f("meta_km")}/>
        <Inp label="Meta R$/hora" type="number" {...f("meta_hora")}/>
      </div>
      <SecTitle t="Ciclo financeiro"/>
      <Lbl c="Dia de início do ciclo (ex.: 12 para ciclo do dia 12 ao 11)"/>
      <input type="number" inputMode="numeric" value={form.dia_ciclo??1} onChange={e=>setForm(p=>({...p,dia_ciclo:e.target.value}))} min="1" max="28" style={inputStyle}/>
      <Ajuda t="Ao trocar o dia de início, ciclos antigos podem deixar de achar os custos que foram salvos para eles."/>
      <div style={{marginTop:16,padding:"10px 12px",border:"1px solid "+K.border,borderRadius:2,background:K.bg}}>
        <p style={{fontSize:13,color:K.text,lineHeight:1.5}}>Os custos abaixo valem para o <b>ciclo atual ({dataFmt(ca.ini)} a {dataFmt(ca.fim)})</b>. Ciclos anteriores continuam com os custos que tinham.</p>
      </div>
      <SecTitle t="Custos fixos mensais"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Parcela do carro (R$)" type="number" {...f("parcela")}/>
        <Inp label="IPVA anual (R$)" type="number" {...f("ipva")}/>
        <Inp label="Seguro anual (R$)" type="number" {...f("seguro")}/>
      </div>
      <SecTitle t="Custos variáveis por km"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Total dos pneus (R$)" type="number" {...f("pneu_total")}/>
        <Inp label="Duração dos pneus (km)" type="number" {...f("pneu_km")}/>
        <Inp label="Revisão R$/km" type="number" {...f("revisao_km")}/>
        <Inp label="Emergência R$/km" type="number" {...f("emergencia_km")}/>
      </div>
      <Ajuda t="Revisão: some o gasto de um ano com óleo, filtros, freios e revisões e divida pelos km rodados no ano (costuma ficar entre R$ 0,15 e R$ 0,35/km)."/>
      <Ajuda t="Emergência: reserva para imprevistos (batida, guincho, peça quebrada). Sugestão: R$ 0,10/km."/>
      <SecTitle t="Combustível"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Autonomia fixa (km/L)" type="number" {...f("autonomia")}/>
        <Inp label="Preço do litro (R$)" type="number" {...f("preco_litro")}/>
      </div>
      <div style={{marginTop:14,background:K.bg,borderRadius:2,padding:12,border:"1px solid "+K.border}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <p style={{fontSize:13,fontWeight:600,color:K.text}}>Usar média real dos abastecimentos</p>
            <p style={{fontSize:12,color:K.muted,marginTop:3}}>Calcula a autonomia com base nos abastecimentos do ciclo</p>
          </div>
          <div onClick={()=>setForm(p=>({...p,usar_media_comb:!p.usar_media_comb}))}
            style={{width:44,height:24,borderRadius:12,background:form.usar_media_comb?K.text:K.border,position:"relative",cursor:"pointer",flexShrink:0,marginLeft:12}}>
            <div style={{position:"absolute",top:2,left:form.usar_media_comb?20:2,width:20,height:20,borderRadius:"50%",background:K.card,transition:"left .2s"}}/>
          </div>
        </div>
      </div>
      <div style={{marginTop:24}}><Btn onClick={salvar} disabled={loading}>{loading?"Salvando...":"Salvar ajustes"}</Btn></div>
      <SecTitle t="Aparência"/>
      <SeletorTema/>
    </div>
  );
}

// Edicao: turno com divisao por app edita cada app (o total e a soma, para o filtro por app nao

function FormTurnoEdit({turno,onSalvar,onExcluir,onCancelar,loading}){
  const divisao=temDivisaoApps(turno);

  const[uber,setUber]=useState({bruto:v0(turno.uber_bruto),viagens:v0(turno.uber_viagens),bonus:v0(turno.uber_bonus)});
  const[nov,setNov]=useState({bruto:v0(turno.nov99_bruto),viagens:v0(turno.nov99_viagens),bonus:v0(turno.nov99_bonus)});
  const[part,setPart]=useState({bruto:v0(turno.part_bruto),viagens:v0(turno.part_viagens)});
  const campo=(k)=>({value:form[k],onChange:v=>setForm(f=>({...f,[k]:v}))});
  const salvar=()=>{
    const base={data:form.data,num:parseN(form.num),km_i:parseN(form.km_i),km_f:parseN(form.km_f),h_i:form.h_i,h_f:form.h_f};
    if(!divisao)return onSalvar({...base,bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:parseN(form.bonus)});
    onSalvar({...base,
      bruto:parseN(uber.bruto)+parseN(nov.bruto)+parseN(part.bruto),
      viagens:parseN(uber.viagens)+parseN(nov.viagens)+parseN(part.viagens),
      bonus:parseN(uber.bonus)+parseN(nov.bonus),
      uber_bruto:parseN(uber.bruto),uber_viagens:parseN(uber.viagens),uber_bonus:parseN(uber.bonus),
      nov99_bruto:parseN(nov.bruto),nov99_viagens:parseN(nov.viagens),nov99_bonus:parseN(nov.bonus),
      part_bruto:parseN(part.bruto),part_viagens:parseN(part.viagens)});
  };
  return(
    <Card style={{marginBottom:14}}>
      <p style={{fontSize:14,fontWeight:600,marginBottom:4,color:K.text}}>Editar {turno.num}º turno ({dataFmt(turno.data)})</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Data" type="date" {...campo("data")}/>
        <Inp label="Nº do turno" type="number" {...campo("num")}/>
        <Inp label="KM inicial" type="number" {...campo("km_i")}/>
        <Inp label="KM final" type="number" {...campo("km_f")}/>
        <InpHora label="Hora início" {...campo("h_i")}/>
        <InpHora label="Hora fim" {...campo("h_f")}/>
      </div>
      {divisao?<>
        <SecaoApp titulo="Uber" dados={uber} setDados={setUber}/>
        <SecaoApp titulo="99" dados={nov} setDados={setNov}/>
        <SecaoApp titulo="Particular" dados={part} setDados={setPart} temBonus={false}/>
      </>:<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Valor bruto (R$)" type="number" {...campo("bruto")}/>
          <Inp label="Nº de viagens" type="number" {...campo("viagens")}/>
        </div>
        <Inp label="Bônus (R$)" type="number" {...campo("bonus")} placeholder="0"/>
        <p style={{fontSize:12,color:K.muted,marginTop:8,lineHeight:1.5}}>Turno registrado antes da divisão por app: só os totais podem ser editados.</p>
      </>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:14}}>
        <Btn sec onClick={onCancelar}>Cancelar</Btn>
        <Btn onClick={salvar} disabled={loading}>{loading?"Salvando...":"Salvar"}</Btn>
      </div>
      <button onClick={onExcluir} disabled={loading}
        style={{marginTop:12,width:"100%",minHeight:44,background:"none",border:"1px solid "+K.err,borderRadius:2,color:K.err,fontSize:14,fontWeight:600,cursor:"pointer"}}>
        Excluir este turno
      </button>
    </Card>
  );
}

// -- DIARIO ---------------------------------------------------
function TelaDiario({turnos,cfg,custosCiclos,userId,onAdd,onUpdate,onDelete}){
  const[modo,setModo]=useState(null),[editando,setEditando]=useState(null);
  const topo=React.useRef(null); // a edicao aparece no topo: rola ate ela
  const[loading,setLoading]=useState(false),[aiMsg,setAiMsg]=useState(""),[loadingAI,setLoadingAI]=useState(false);
  const turnosHoje=turnos.filter(t=>t.data===hoje()).sort((a,b)=>a.num-b.num);
  const turnosAnt=turnos.filter(t=>t.data!==hoje()).sort((a,b)=>b.data.localeCompare(a.data)||a.num-b.num);
  // procura em qualquer data: turno aberto antes da meia-noite tambem precisa poder ser fechado
  const turnoAberto=[...turnos].sort((a,b)=>b.data.localeCompare(a.data)||b.num-a.num).find(turnoEstaAberto);

  // Medias do ciclo atual
  const ca=calcCiclo(cfg.dia_ciclo||1);
  const turnosCiclo=turnos.filter(t=>t.data&&t.data>=ca.ini&&t.data<=ca.fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);
  const totalDias=[...new Set(turnosCiclo.map(t=>t.data))].length;
  const totalKm=turnosCiclo.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
  const totalBruto=turnosCiclo.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const totalViagens=turnosCiclo.reduce((s,t)=>s+parseN(t.viagens),0);

  const calcT=(t)=>{
    const k=parseN(t.km_f)-parseN(t.km_i),h=horasDiff(t.h_i,t.h_f),b=parseN(t.bruto),bonus=parseN(t.bonus);
    const cc=custosDaData(custosCiclos,t.data,cfg); // mesmos custos que o Dashboard usa para o ciclo
    const aut=parseN(cc.autonomia)||7;
    const c=k>0?(k/aut)*parseN(cc.preco_litro):0;
    const lucro=b-c-k*(parseN(cc.pneu_total)/Math.max(1,parseN(cc.pneu_km)))-k*parseN(cc.revisao_km)-k*parseN(cc.emergencia_km);
    return{k,h,b,bonus,lucro,r_km:k>0?b/k:0,r_hr:h>0?b/h:0};
  };

  const turnosHojeFechados=turnosHoje.filter(t=>parseN(t.km_f)>0&&parseN(t.bruto)>0);
  const resumoDia=turnosHojeFechados.reduce((acc,t)=>{
    const k=parseN(t.km_f)-parseN(t.km_i),h=horasDiff(t.h_i,t.h_f);
    return{bruto:acc.bruto+parseN(t.bruto),bonus:acc.bonus+parseN(t.bonus),km:acc.km+k,hrs:acc.hrs+h,viagens:acc.viagens+parseN(t.viagens)};
  },{bruto:0,bonus:0,km:0,hrs:0,viagens:0});
  const totDia=resumoDia.bruto+resumoDia.bonus;
  const diaRkm=resumoDia.km>0?totDia/resumoDia.km:0;
  const diaRhr=resumoDia.hrs>0?totDia/resumoDia.hrs:0;

  const abrirTurno=async(form)=>{
    setLoading(true);
    const id=novoId();
    const{data,error}=await gravarDados("turnos","insert",id,{id,user_id:userId,data:form.data,num:parseN(form.num),km_i:parseN(form.km_i),km_f:0,h_i:form.h_i,h_f:"",bruto:0,viagens:0,bonus:0});
    if(!error){onAdd(data);setModo(null);}else avisar("Erro: "+error.message);
    setLoading(false);
  };
  const fecharTurno=async(form)=>{
    setLoading(true);
    const upd={km_f:parseN(form.km_f),h_f:form.h_f,bruto:parseN(form.bruto),viagens:parseN(form.viagens),bonus:parseN(form.bonus),
      uber_bruto:parseN(form.uber_bruto)||0,uber_viagens:parseN(form.uber_viagens)||0,uber_bonus:parseN(form.uber_bonus)||0,
      nov99_bruto:parseN(form.nov99_bruto)||0,nov99_viagens:parseN(form.nov99_viagens)||0,nov99_bonus:parseN(form.nov99_bonus)||0,
      part_bruto:parseN(form.part_bruto)||0,part_viagens:parseN(form.part_viagens)||0};
    const{data,error}=await gravarDados("turnos","update",turnoAberto.id,upd,turnoAberto);
    if(!error){onUpdate(data);setModo(null);}else avisar("Erro: "+error.message);
    setLoading(false);
  };
  const salvarEd=async(upd)=>{
    setLoading(true);
    const{data,error,offline}=await gravarDados("turnos","update",editando.id,upd,editando);
    if(!error){onUpdate(data);setEditando(null);if(!offline)avisar("Turno salvo.");}else avisar("Erro: "+error.message);
    setLoading(false);
  };
  const excluir=async(t)=>{
    if(!window.confirm("Excluir o "+t.num+"º turno de "+dataFmt(t.data)+"? Não dá para desfazer."))return;
    setLoading(true);
    const{error,offline}=await gravarDados("turnos","delete",t.id);
    if(!error){onDelete(t.id);setEditando(null);if(!offline)avisar("Turno excluído.");}else avisar("Erro: "+error.message);
    setLoading(false);
  };
  const pedirIA=useCallback(async()=>{
    setLoadingAI(true);
    const totB=turnosHoje.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
    const totK=turnosHoje.reduce((s,t)=>s+(parseN(t.km_f)-parseN(t.km_i)),0);
    const totV=turnosHoje.reduce((s,t)=>s+parseN(t.viagens),0);
    setAiMsg(await pedirAnalise("dia",{turnos:turnosHoje.length,bruto:totB,km:totK,viagens:totV,meta_km:parseN(cfg.meta_km),meta_hora:parseN(cfg.meta_hora)}));
    setLoadingAI(false);
  },[turnosHoje,cfg]);

  const CardTurno=({t})=>{
    const aberto=turnoEstaAberto(t);
    const{k,h,b,bonus,lucro,r_km,r_hr}=calcT(t);
    const okKm=r_km>=parseN(cfg.meta_km),okHr=r_hr>=parseN(cfg.meta_hora);
    return(
      <Card style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:14,fontWeight:600,color:K.text}}>{t.num}º turno · {dataFmt(t.data)}</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {aberto?<span style={{fontSize:12,color:K.muted,border:"1px solid "+K.border,padding:"2px 6px",borderRadius:1}}>Em aberto</span>
              :<span style={{fontSize:12,color:lucro>0?K.ok:K.err,border:"1px solid "+(lucro>0?K.ok:K.err),padding:"2px 6px",borderRadius:1}}>{lucro>0?"▲ lucro":"▼ prejuízo"}</span>}
            <button onClick={()=>{setEditando(t);setModo(null);topo.current?.scrollTo({top:0,behavior:"smooth"});}} aria-label="Editar turno"
              style={{display:"flex",alignItems:"center",gap:4,minHeight:36,padding:"4px 10px",background:K.bg,border:"1px solid "+K.border,borderRadius:2,cursor:"pointer",color:K.text,fontSize:13}}>
              <Icone nome="editar" tam={15} cor={K.muted}/>Editar
            </button>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"4px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>KM inicial / Hora início</span><b style={{color:K.text}}>{t.km_i} / {t.h_i||"--"}</b></div>
        {!aberto&&<>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>KM rodado / Horas</span><b style={{color:K.text}}>{k} km / {fmtHora(h)}</b></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>Viagens / Bruto</span><b style={{color:K.text}}>{t.viagens} / {fmtR(b)}</b></div>
          {bonus>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>Bônus (entra no resumo do dia)</span><b style={{color:K.text}}>{fmtR(bonus)}</b></div>}
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid "+K.sep}}><span style={{color:K.muted}}>Lucro est.</span><b style={{color:lucro>0?K.ok:K.err}}>{fmtR(lucro)}</b></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginTop:8,paddingTop:8,borderTop:"1px solid "+K.sep}}>
            <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"4px 6px"}}>
              <div style={{fontSize:13,fontWeight:700,color:okKm?K.ok:K.err}}>{okKm?"▲":"▼"} {fmtR(r_km)}/km</div>
              <div style={{fontSize:12,color:K.muted}}>sem bônus · meta {fmtR(parseN(cfg.meta_km))}</div>
            </div>
            <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"4px 6px"}}>
              <div style={{fontSize:13,fontWeight:700,color:okHr?K.ok:K.err}}>{okHr?"▲":"▼"} {fmtR(r_hr)}/h</div>
              <div style={{fontSize:12,color:K.muted}}>sem bônus · meta {fmtR(parseN(cfg.meta_hora))}</div>
            </div>
          </div>
        </>}
      </Card>
    );
  };

  const ResumoDiaCard=({res,rKm,rHr,tot})=>(
    <Card style={{marginBottom:12}}>
      <SecTitle t="Resumo do dia"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"8px 6px"}}>
          <div style={{fontSize:15,fontWeight:700,color:K.text}}>{fmtR(tot)}</div>
          <div style={{fontSize:12,color:K.muted}}>Bruto c/ bônus</div>
        </div>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"8px 6px"}}>
          <div style={{fontSize:15,fontWeight:700,color:K.text}}>{res.viagens}v / {res.km}km</div>
          <div style={{fontSize:12,color:K.muted}}>Viagens / KM</div>
        </div>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"8px 6px"}}>
          <div style={{fontSize:15,fontWeight:700,color:K.text}}>{fmtHora(res.hrs)}</div>
          <div style={{fontSize:12,color:K.muted}}>Horas trabalhadas</div>
        </div>
      </div>
      {res.bonus>0&&<div style={{background:K.bg,borderRadius:1,padding:"6px 10px",marginBottom:8,display:"flex",justifyContent:"space-between",fontSize:12,border:"1px solid "+K.border}}>
        <span style={{color:K.text}}>Bônus do dia</span><b style={{color:K.text}}>{fmtR(res.bonus)}</b>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"6px"}}>
          <div style={{fontSize:14,fontWeight:700,color:rKm>=parseN(cfg.meta_km)?K.ok:K.err}}>{rKm>=parseN(cfg.meta_km)?"▲":"▼"} {fmtR(rKm)}/km</div>
          <div style={{fontSize:12,color:K.muted}}>com bônus · meta {fmtR(parseN(cfg.meta_km))}</div>
        </div>
        <div style={{textAlign:"center",border:"1px solid "+K.border,borderRadius:1,padding:"6px"}}>
          <div style={{fontSize:14,fontWeight:700,color:rHr>=parseN(cfg.meta_hora)?K.ok:K.err}}>{rHr>=parseN(cfg.meta_hora)?"▲":"▼"} {fmtR(rHr)}/h</div>
          <div style={{fontSize:12,color:K.muted}}>com bônus · meta {fmtR(parseN(cfg.meta_hora))}</div>
        </div>
      </div>
    </Card>
  );

  return(
    <div ref={topo} style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      {turnosCiclo.length>0&&<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
          <SecTitle t="Médias do ciclo"/>
          <span style={{fontSize:12,color:K.muted}}>{dataFmt(ca.ini)} / {dataFmt(ca.fim)}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          {[["KM/dia",fmt(totalDias>0?totalKm/totalDias:0,0)+" km"],["Bruto/dia",fmtR(totalDias>0?totalBruto/totalDias:0)],["Viagens/dia",fmt(totalDias>0?totalViagens/totalDias:0,1)],["R$/km",fmtR(totalKm>0?totalBruto/totalKm:0)]].map(([l,v])=>(
            <Card key={l} style={{padding:10,textAlign:"center"}}>
              <div style={{fontSize:15,fontWeight:700,color:K.text}}>{v}</div>
              <div style={{fontSize:12,color:K.muted,marginTop:2}}>{l}</div>
            </Card>
          ))}
        </div>
      </>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <p style={{fontSize:13,fontWeight:600,color:K.text}}>Hoje, {dataFmt(hoje())}</p>
        {!turnoAberto
          ?<button onClick={()=>setModo(modo==="abrir"?null:"abrir")} style={{padding:"9px 16px",background:K.text,color:K.bg,border:"none",borderRadius:2,fontSize:13,fontWeight:600,cursor:"pointer"}}>Abrir turno</button>
          :<button onClick={()=>setModo(modo==="fechar"?null:"fechar")} style={{padding:"9px 16px",background:K.bg,color:K.text,border:"1px solid "+K.text,borderRadius:2,fontSize:13,fontWeight:600,cursor:"pointer"}}>Fechar turno</button>}
      </div>
      {modo==="abrir"&&!turnoAberto&&<FormAbrirTurno numTurno={turnosHoje.length+1} onSalvar={abrirTurno} onCancelar={()=>setModo(null)} loading={loading}/>}
      {modo==="fechar"&&turnoAberto&&<FormFecharTurno turno={turnoAberto} onSalvar={fecharTurno} onCancelar={()=>setModo(null)} loading={loading}/>}
      {editando&&<FormTurnoEdit key={editando.id} turno={editando}
        onSalvar={salvarEd} onExcluir={()=>excluir(editando)} onCancelar={()=>setEditando(null)} loading={loading}/>}
      {turnosHoje.length===0&&!modo&&!editando&&(
        <div style={{textAlign:"center",padding:"24px 20px",color:K.muted,background:K.card,borderRadius:2,marginBottom:14,border:"1px solid "+K.border}}>
          <p style={{fontSize:13}}>Nenhum turno hoje ainda.</p>
          <p style={{fontSize:12,marginTop:4}}>Toque em "Abrir turno" para começar.</p>
        </div>
      )}
      {turnosHoje.map(t=><CardTurno key={t.id} t={t}/>)}
      {turnosHojeFechados.length>0&&<ResumoDiaCard res={resumoDia} rKm={diaRkm} rHr={diaRhr} tot={totDia}/>}
      {turnosHojeFechados.length>0&&(
        <div style={{background:K.card,borderRadius:2,padding:14,marginBottom:16,border:"1px solid "+K.border}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:600,color:K.text}}>Análise do dia · IA</span>
            <button onClick={pedirIA} disabled={loadingAI} style={{padding:"5px 10px",fontSize:12,background:K.text,color:K.bg,border:"none",borderRadius:1,cursor:"pointer",opacity:loadingAI?0.5:1}}>
              {loadingAI?"Analisando...":"Analisar"}
            </button>
          </div>
          {aiMsg?<p style={{fontSize:12,color:K.muted,lineHeight:1.7}}>{aiMsg}</p>
            :<p style={{fontSize:12,color:K.muted,fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu dia.</p>}
        </div>
      )}
      {turnosAnt.length>0&&<>
        <SecTitle t="Dias anteriores"/>
        {[...new Set(turnosAnt.map(t=>t.data))].map(data=>{
          const td=turnosAnt.filter(t=>t.data===data).sort((a,b)=>a.num-b.num);
          const fechados=td.filter(t=>parseN(t.km_f)>0&&parseN(t.bruto)>0);
          const res=fechados.reduce((acc,t)=>{
            const k=parseN(t.km_f)-parseN(t.km_i),h=horasDiff(t.h_i,t.h_f);
            return{bruto:acc.bruto+parseN(t.bruto),bonus:acc.bonus+parseN(t.bonus),km:acc.km+k,hrs:acc.hrs+h,viagens:acc.viagens+parseN(t.viagens)};
          },{bruto:0,bonus:0,km:0,hrs:0,viagens:0});
          const tot=res.bruto+res.bonus;
          const rKm=res.km>0?tot/res.km:0,rHr=res.hrs>0?tot/res.hrs:0;
          return(
            <div key={data}>
              <p style={{fontSize:12,fontWeight:700,color:K.muted,margin:"12px 0 6px",textTransform:"uppercase",letterSpacing:1}}>{dataFmt(data)}</p>
              {td.map(t=><CardTurno key={t.id} t={t}/>)}
              {fechados.length>0&&<ResumoDiaCard res={res} rKm={rKm} rHr={rHr} tot={tot}/>}
            </div>
          );
        })}
      </>}
    </div>
  );
}

// hodometro do abastecimento anterior (para calcular sozinho os km rodados desde ele)
function hodometroAnterior(abastecimentos,data,ignorarId){
  const ant=abastecimentos.filter(a=>a.id!==ignorarId&&parseN(a.hodometro)>0&&a.data<=data)
    .sort((a,b)=>b.data.localeCompare(a.data)||parseN(b.hodometro)-parseN(a.hodometro))[0];
  return ant?parseN(ant.hodometro):0;
}
function FormAbast({titulo,dados,setDados,hodoAnterior,onSalvar,onCancelar,onExcluir,loading}){
  const isGNV=dados.tipo==="GNV";
  const quant=parseN(dados.litros);
  const kmlF=quant>0?parseN(dados.km_rod)/quant:0;
  const un=isGNV?"m³":"L";
  // digitou o hodometro e ha um anterior: km rodado = diferenca (ainda da para corrigir a mao)
  const mudarHodo=(v)=>setDados(f=>{
    const novo={...f,hodometro:v};
    const dif=parseN(v)-hodoAnterior;
    if(hodoAnterior>0&&dif>0)novo.km_rod=String(Math.round(dif));
    return novo;
  });
  return(
    <Card style={{marginBottom:14}}>
      <p style={{fontSize:14,fontWeight:600,marginBottom:8,color:K.text}}>{titulo}</p>
      <Lbl c="Tipo de combustível"/>
      <div style={{display:"flex",border:"1px solid "+K.border,borderRadius:2,overflow:"hidden",marginBottom:4}}>
        {["Gasolina","Alcool","GNV"].map(t=>(
          <button key={t} onClick={()=>setDados(f=>({...f,tipo:t}))} aria-pressed={dados.tipo===t}
            style={{flex:1,padding:"11px 4px",border:"none",cursor:"pointer",fontSize:14,background:dados.tipo===t?K.text:K.card,color:dados.tipo===t?K.bg:K.muted,fontWeight:dados.tipo===t?700:400}}>
            {t==="Alcool"?"Álcool":t}
          </button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Inp label="Data" type="date" value={dados.data} onChange={v=>setDados(f=>({...f,data:v}))}/>
        <Inp label={"Preço por "+(isGNV?"m³":"litro")+" (R$)"} type="number" value={dados.preco} onChange={v=>setDados(f=>({...f,preco:v}))} placeholder="5,89"/>
        <Inp label={isGNV?"m³ abastecidos":"Litros abastecidos"} type="number" value={dados.litros} onChange={v=>setDados(f=>({...f,litros:v}))} placeholder="40,0"/>
        <Inp label="Hodômetro agora (km)" type="number" value={dados.hodometro} onChange={mudarHodo} placeholder="76031"/>
      </div>
      <Inp label="KM rodados desde o último abastecimento" type="number" value={dados.km_rod} onChange={v=>setDados(f=>({...f,km_rod:v}))} placeholder="280"/>
      <p style={{fontSize:12,color:K.muted,marginTop:6,lineHeight:1.5}}>
        {hodoAnterior>0?"Último hodômetro registrado: "+fmt(hodoAnterior,0)+" km. Digitando o hodômetro, os km rodados são calculados sozinhos."
          :"Digite o hodômetro (km do painel) a cada abastecimento: a partir do próximo, os km rodados são calculados sozinhos."}
      </p>

// grava o abastecimento; se o banco ainda nao tiver a coluna hodometro (SQL da v1.6 nao rodado), grava sem ela
async function gravarAbast(q,dados){
  let r=await q(dados);
  if(r.error&&/hodometro/i.test(r.error.message||"")){const{hodometro,...sem}=dados;r=await q(sem);}
  return r;
}

function TelaComparativo({turnos}){
  const semanas=useMemo(()=>{
    if(!turnos.length)return[];
    const porDia={};
    turnos.forEach(t=>{
      if(!t.data)return;
      if(!porDia[t.data])porDia[t.data]={bruto:0,km:0,hrs:0,viagens:0};
      porDia[t.data].bruto+=parseN(t.bruto)+parseN(t.bonus);
      porDia[t.data].km+=parseN(t.km_f)-parseN(t.km_i);
      porDia[t.data].hrs+=horasDiff(t.h_i,t.h_f);
      porDia[t.data].viagens+=parseN(t.viagens);
    });
    const dias=Object.keys(porDia).sort();
    if(!dias.length)return[];
    const primeiro=new Date(dias[0]+"T12:00:00");
    const ultimo=new Date(dias[dias.length-1]+"T12:00:00");
    const diaSem=primeiro.getDay();
    const inicio=new Date(primeiro);
    inicio.setDate(primeiro.getDate()-(diaSem===0?6:diaSem-1));
    const sems=[];
    let s=new Date(inicio);
    while(s<=ultimo){
      const e=new Date(s);e.setDate(s.getDate()+6);
      const sStr=isoLocal(s),eStr=isoLocal(e);
      const diasSem=Object.keys(porDia).filter(d=>d>=sStr&&d<=eStr);
      if(diasSem.length>0){
        sems.push({label:dataFmt(sStr).slice(0,5)+" a "+dataFmt(eStr).slice(0,5),ini:sStr,fim:eStr,dias:diasSem.map(d=>({data:d,...porDia[d]}))});
      }
      s=new Date(e);s.setDate(e.getDate()+1);
    }
    return sems.reverse();
  },[turnos]);
  const[semA,setSemA]=useState(0),[semB,setSemB]=useState(1),[metrica,setMetrica]=useState("r_km");
  if(semanas.length<2)return(
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center",color:K.muted,flexDirection:"column",gap:12}}>
      <p style={{fontSize:14}}>Registre pelo menos 2 semanas para comparar.</p>
    </div>
  );
  const DIAS=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const getSem=(idx)=>{
    const sem=semanas[idx];if(!sem)return[];
    return sem.dias.map(d=>({ds:diaSemana(d.data),r_km:d.km>0?d.bruto/d.km:0,r_hr:d.hrs>0?d.bruto/d.hrs:0,bruto:d.bruto,viagens:d.viagens}));
  };
  const diasA=getSem(semA),diasB=getSem(semB);
  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <SecTitle t="Comparar semanas"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div><Lbl c="Semana A"/>
          <select value={semA} onChange={e=>setSemA(parseInt(e.target.value))} style={{width:"100%",border:"1px solid "+K.border,borderRadius:2,padding:"10px 10px",fontSize:16,background:K.card,outline:"none",color:K.text}}>
            {semanas.map((s,i)=><option key={i} value={i}>{s.label}</option>)}
          </select></div>
        <div><Lbl c="Semana B"/>
          <select value={semB} onChange={e=>setSemB(parseInt(e.target.value))} style={{width:"100%",border:"1px solid "+K.border,borderRadius:2,padding:"10px 10px",fontSize:16,background:K.card,outline:"none",color:K.text}}>
            {semanas.map((s,i)=><option key={i} value={i}>{s.label}</option>)}
          </select></div>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["r_km","R$/km"],["r_hr","R$/hora"],["bruto","Bruto"]].map(([v,l])=>(
          <button key={v} onClick={()=>setMetrica(v)} style={{padding:"7px 10px",borderRadius:2,border:"1px solid "+K.border,background:metrica===v?K.text:K.card,color:metrica===v?K.bg:K.muted,fontSize:12,fontWeight:600,cursor:"pointer",flex:1}}>{l}</button>
        ))}
      </div>
      <Card style={{marginBottom:14}}>
        <SecTitle t={metrica==="r_km"?"R$/km":metrica==="r_hr"?"R$/hora":"Bruto"}/>
        <div style={{display:"flex",gap:4}}>
          {DIAS.map(ds=>{
            const dA=diasA.find(d=>d.ds===ds),dB=diasB.find(d=>d.ds===ds);
            const vA=dA?dA[metrica]:0,vB=dB?dB[metrica]:0,max=Math.max(vA,vB,1);
            return(
              <div key={ds} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:70}}>
                  <div style={{flex:1,height:Math.max(2,(vA/max)*65),background:K.bar,borderRadius:"1px 1px 0 0"}}/>
                  <div style={{flex:1,height:Math.max(2,(vB/max)*65),background:K.bar2,borderRadius:"1px 1px 0 0"}}/>
                </div>
                <div style={{fontSize:12,color:K.muted}}>{ds}</div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px 16px",marginTop:10,justifyContent:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:12,height:10,background:K.bar}}/><span style={{fontSize:12,color:K.text}}>A: {semanas[semA]?.label}</span></div>
          <div style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:12,height:10,background:K.bar2}}/><span style={{fontSize:12,color:K.text}}>B: {semanas[semB]?.label}</span></div>
        </div>
      </Card>
      <Card style={{marginBottom:14}}>
        <SecTitle t={"Detalhamento · "+(metrica==="r_km"?"R$/km":metrica==="r_hr"?"R$/hora":"Bruto")}/>
        <p style={{fontSize:12,color:K.muted,marginBottom:8,lineHeight:1.5}}>B × A: quanto a semana B ficou acima (+) ou abaixo (−) da semana A.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr 1fr",gap:4,marginBottom:6,paddingBottom:6,borderBottom:"1px solid "+K.sep}}>
          {["Dia","Sem. A","Viag. A","Sem. B","Viag. B","B × A"].map(h=><div key={h} style={{fontSize:12,fontWeight:700,color:K.muted,textAlign:"center"}}>{h}</div>)}
        </div>
        {DIAS.map(ds=>{
          const dA=diasA.find(d=>d.ds===ds),dB=diasB.find(d=>d.ds===ds);
          if(!dA&&!dB)return null;
          const vA=dA?dA[metrica]:null,vB=dB?dB[metrica]:null;
          const diff=vA&&vA>0&&vB!=null?((vB-vA)/vA)*100:null;
          return(
            <div key={ds} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr 1fr",gap:4,padding:"6px 0",borderBottom:"1px solid "+K.sep,alignItems:"center"}}>
              <div style={{fontSize:12,fontWeight:600,color:K.text,textAlign:"center"}}>{ds}</div>
              <div style={{textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:K.text}}>{vA&&vA>0?fmtR(vA):"--"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:12,color:K.muted}}>{dA?dA.viagens+"v":"--"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:K.muted}}>{vB&&vB>0?fmtR(vB):"--"}</span></div>
              <div style={{textAlign:"center"}}><span style={{fontSize:12,color:K.muted}}>{dB?dB.viagens+"v":"--"}</span></div>
              <div style={{textAlign:"center"}}>
                {diff!=null?<span style={{fontSize:12,fontWeight:700,color:diff>=0?K.ok:K.err}}>{diff>=0?"+":""}{fmt(diff,1)}%</span>:<span style={{fontSize:12,color:K.muted}}>--</span>}
              </div>
            </div>
          );
        })}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr 1fr",gap:4,paddingTop:8,marginTop:4,borderTop:"1px solid "+K.border}}>
          <div style={{fontSize:12,fontWeight:700,color:K.muted,textAlign:"center"}}>Média</div>
          <div style={{textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:K.text}}>{(()=>{const v=diasA.filter(d=>d[metrica]>0);return v.length?fmtR(v.reduce((s,d)=>s+d[metrica],0)/v.length):"--";})()}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:12,color:K.muted}}>{diasA.length?diasA.reduce((s,d)=>s+d.viagens,0)+"v":"--"}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:12,fontWeight:700,color:K.muted}}>{(()=>{const v=diasB.filter(d=>d[metrica]>0);return v.length?fmtR(v.reduce((s,d)=>s+d[metrica],0)/v.length):"--";})()}</span></div>
          <div style={{textAlign:"center"}}><span style={{fontSize:12,color:K.muted}}>{diasB.length?diasB.reduce((s,d)=>s+d.viagens,0)+"v":"--"}</span></div>
          <div style={{textAlign:"center"}}>{(()=>{
            const mA=diasA.filter(d=>d[metrica]>0),mB=diasB.filter(d=>d[metrica]>0);
            if(!mA.length||!mB.length)return <span style={{fontSize:12,color:K.muted}}>--</span>;
            const vA=mA.reduce((s,d)=>s+d[metrica],0)/mA.length,vB=mB.reduce((s,d)=>s+d[metrica],0)/mB.length;
            const diff=vA>0?((vB-vA)/vA)*100:0;
            return <span style={{fontSize:12,fontWeight:700,color:diff>=0?K.ok:K.err}}>{diff>=0?"+":""}{fmt(diff,1)}%</span>;
          })()}</div>
        </div>
      </Card>
    </div>
  );
}

function TelaDashboard({turnos,abastecimentos,cfg,periodoIni,periodoFim,setPeriodoIni,setPeriodoFim,custosCiclos}){
  const ca=calcCiclo(cfg.dia_ciclo||1);
  const[dataIni,setDataIni]=[periodoIni,setPeriodoIni];
  const[dataFim,setDataFim]=[periodoFim,setPeriodoFim];
  // Busca custos do ciclo selecionado
  const custosDoPeriodo=custosDaData(custosCiclos,dataIni,cfg);
  const[mostrarFiltro,setMostrarFiltro]=useState(false);
  const[aiMsg,setAiMsg]=useState(""),[loadingAI,setLoadingAI]=useState(false);
  const[appFiltro,setAppFiltro]=useState("total");

  // Parte do turno de cada app. Km e horas do turno sao divididos pela proporcao de viagens
  // (sem viagens, pela proporcao do bruto) — antes o app levava o km do turno inteiro.
  const extrairApp=(t,app)=>{
    const km=parseN(t.km_f)-parseN(t.km_i),hrs=horasDiff(t.h_i,t.h_f);
    const tot={bruto:parseN(t.bruto)+parseN(t.bonus),viagens:parseN(t.viagens),km,hrs};
    if(app==="total")return tot;
    let bruto,viagens,brutoSemBonus;
    if(!temDivisaoApps(t)){
      // turno antigo, sem divisao por app: conta todo como Uber/99
      if(app==="apps")return tot;
      return{bruto:0,viagens:0,km:0,hrs:0};
    }
    if(app==="apps"){
      brutoSemBonus=parseN(t.uber_bruto)+parseN(t.nov99_bruto);
      bruto=brutoSemBonus+parseN(t.uber_bonus)+parseN(t.nov99_bonus);
      viagens=parseN(t.uber_viagens)+parseN(t.nov99_viagens);
    }else{ // "part"
      brutoSemBonus=bruto=parseN(t.part_bruto);
      viagens=parseN(t.part_viagens);
    }
    const parte=tot.viagens>0?viagens/tot.viagens:(parseN(t.bruto)>0?brutoSemBonus/parseN(t.bruto):0);
    return{bruto,viagens,km:km*parte,hrs:hrs*parte};
  };

  const calcApp=(ini,fim)=>{
    const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim&&parseN(t.km_f)>0&&parseN(t.bruto)>0);
    let km_total=0,hrs_total=0,bruto=0,viagens=0;
    mes.forEach(t=>{const d=extrairApp(t,appFiltro);bruto+=d.bruto;viagens+=d.viagens;km_total+=d.km;hrs_total+=d.hrs;});
    const full=calcPeriodo(turnos,abastecimentos,cfg,ini,fim,custosDoPeriodo);
    return{...full,bruto,viagens,km_total,hrs_total,r_km:km_total>0?bruto/km_total:0,r_hr:hrs_total>0?bruto/hrs_total:0,lucro:bruto-full.custos};
  };

  const mes=calcApp(dataIni,dataFim);
  const mesTotal=calcPeriodo(turnos,abastecimentos,cfg,dataIni,dataFim,custosDoPeriodo);
  const APPS=[{id:"total",label:"Todos"},{id:"apps",label:"Uber / 99"},{id:"part",label:"Particular"}];

  const semanasDociclo=(()=>{
    const ini=new Date(dataIni+"T12:00:00"),fim=new Date(dataFim+"T12:00:00");
    const semanas=[];
    let s=new Date(ini);
    while(s<=fim){
      const e=new Date(s);e.setDate(s.getDate()+6);
      const sStr=isoLocal(s),eStr=e>fim?isoLocal(fim):isoLocal(e);
      const v=turnos.filter(t=>t.data&&t.data>=sStr&&t.data<=eStr&&parseN(t.km_f)>0&&parseN(t.bruto)>0).reduce((a,t)=>a+extrairApp(t,appFiltro).bruto,0);
      semanas.push({l:s.getDate()+"/"+(s.getMonth()+1),v:Math.round(v)});
      s=new Date(e);s.setDate(e.getDate()+1);
    }
    return semanas;
  })();

  const pedirIA=useCallback(async()=>{
    setLoadingAI(true);
    setAiMsg(await pedirAnalise("ciclo",{bruto:mes.bruto,custos:mes.custos,lucro:mes.lucro,dias:mes.dias,viagens:mes.viagens,km:mes.km_total,r_km:mes.r_km,r_hr:mes.r_hr,meta_km:parseN(cfg.meta_km),meta_hora:parseN(cfg.meta_hora)}));
    setLoadingAI(false);
  },[mes,cfg]);

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <p style={{fontSize:12,color:K.muted}}>Período</p>
            <p style={{fontSize:14,color:K.text,fontWeight:600}}>{dataFmt(dataIni)} a {dataFmt(dataFim)}</p>
          </div>
          <button onClick={()=>setMostrarFiltro(!mostrarFiltro)} style={{minHeight:40,padding:"8px 14px",background:mostrarFiltro?K.text:K.bg,color:mostrarFiltro?K.bg:K.text,border:"1px solid "+K.border,borderRadius:2,fontSize:14,fontWeight:600,cursor:"pointer"}}>Mudar período</button>
        </div>
        {mostrarFiltro&&(
          <div style={{marginTop:10,background:K.bg,borderRadius:2,padding:12,border:"1px solid "+K.border}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><Lbl c="Data início"/><input type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)} style={inputStyle}/></div>
              <div><Lbl c="Data fim"/><input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)} style={inputStyle}/></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:10}}>
              {[{l:"Ciclo atual",i:ca.ini,f:ca.fim},{l:"Últimos 30 dias",i:(()=>{const d=new Date();d.setDate(d.getDate()-30);return isoLocal(d);})(),f:hoje()}].map(({l,i,f})=>(
                <button key={l} onClick={()=>{setDataIni(i);setDataFim(f);setMostrarFiltro(false);}} style={{padding:"7px 4px",background:K.card,border:"1px solid "+K.border,borderRadius:2,fontSize:12,color:K.text,fontWeight:600,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
          </div>
        )}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <Card>
          <div style={{fontSize:12,color:K.muted}}>Lucro líquido</div>
          <div style={{fontSize:22,fontWeight:700,color:mesTotal.lucro>=0?K.ok:K.err,marginTop:4}}>{fmtR(mesTotal.lucro)}</div>
          <div style={{fontSize:12,color:K.muted,marginTop:4}}>de {fmtR(mesTotal.bruto)} bruto</div>
        </Card>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Card style={{padding:10}}><div style={{fontSize:12,color:K.muted}}>Dias trabalhados</div><div style={{fontSize:17,fontWeight:700,color:K.text}}>{mesTotal.dias} dias</div></Card>
          <Card style={{padding:10}}><div style={{fontSize:12,color:K.muted}}>Viagens / KM</div><div style={{fontSize:15,fontWeight:700,color:K.text}}>{mesTotal.viagens} / {mesTotal.km_total}km</div></Card>
        </div>
      </div>
      <Card style={{marginBottom:10}}>
        <SecTitle t="Ganho x meta"/>
        <p style={{fontSize:12,color:K.muted,marginTop:-4,marginBottom:8}}>O filtro abaixo vale para este quadro e para o gráfico semanal.</p>
        <div style={{display:"flex",gap:6,marginBottom:14}}>
          {APPS.map(({id,label})=>(
            <button key={id} onClick={()=>setAppFiltro(id)}
              style={{flex:1,padding:"7px 4px",borderRadius:2,border:"1px solid "+(appFiltro===id?K.text:K.border),background:appFiltro===id?K.text:K.card,color:appFiltro===id?K.bg:K.muted,fontSize:12,fontWeight:700,cursor:"pointer"}}>
              {label}
            </button>
          ))}
        </div>
        <IEBar label="R$/km" real={mes.r_km} meta={parseN(cfg.meta_km)} valor={fmtR(mes.r_km)+"/km"}/>
        <IEBar label="R$/hora" real={mes.r_hr} meta={parseN(cfg.meta_hora)} valor={fmtR(mes.r_hr)+"/h"}/>
      </Card>
      <Card style={{marginBottom:10}}>
        <SecTitle t={"Bruto por semana · "+APPS.find(a=>a.id===appFiltro)?.label}/>
        <BarChart data={semanasDociclo}/>
      </Card>
      <Card style={{marginBottom:10}}>
        <SecTitle t="Custos fixos"/>
        {(()=>{
          const fx=mesTotal.fator_fixo;
          return[
            ["Parcela do carro",parseN(custosDoPeriodo.parcela)*fx],
            ["IPVA (proporcional)",parseN(custosDoPeriodo.ipva)/12*fx],
            ["Seguro (proporcional)",parseN(custosDoPeriodo.seguro)/12*fx]
          ].map(([l,v])=>(
            <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"7px 0",borderBottom:"1px solid "+K.sep}}>
              <span style={{color:K.muted}}>{l}</span>
              <b style={{color:K.text}}>{fmtR(v)}</b>
            </div>
          ));
        })()}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:8,color:K.err}}>
          <span>Total fixo</span><span>{fmtR(mes.fixo)}</span>
        </div>
      </Card>
      <Card style={{marginBottom:10}}>
        <SecTitle t="Custos variáveis"/>
        {[[mes.comb_real?"Combustível (média dos abastecimentos)":"Combustível (estimado pela autonomia)",mes.comb_total],["Revisão e manutenção",mes.rev_t],["Pneu",mes.pneu_t],["Reserva de emergência",mes.emer_t]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"7px 0",borderBottom:"1px solid "+K.sep}}><span style={{color:K.muted}}>{l}</span><b style={{color:K.text}}>{fmtR(v)}</b></div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,paddingTop:8,color:K.err}}><span>Total variável</span><span>{fmtR(mes.custos_var)}</span></div>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["Viagens/dia",mes.dias>0?fmt(mes.viagens/mes.dias,1):"--"],["Horas/dia",mes.dias>0?fmtHora(mes.hrs_total/mes.dias):"--"],["Viagens/hora",mes.hrs_total>0?fmt(mes.viagens/mes.hrs_total,2):"--"],["% comb/bruto",mes.bruto>0?fmt(mes.comb_total/mes.bruto*100,1)+"%":"--"]].map(([l,v])=>(
          <Card key={l} style={{padding:10}}><div style={{fontSize:12,color:K.muted,marginBottom:2}}>{l}</div><div style={{fontSize:17,fontWeight:700,color:K.text}}>{v}</div></Card>
        ))}
      </div>
      <div style={{background:K.card,borderRadius:2,padding:14,border:"1px solid "+K.border}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:12,fontWeight:600,color:K.text}}>Análise do ciclo · IA</span>
          <button onClick={pedirIA} disabled={loadingAI} style={{padding:"5px 10px",fontSize:12,background:K.text,color:K.bg,border:"none",borderRadius:1,cursor:"pointer",opacity:loadingAI?0.5:1}}>{loadingAI?"Analisando...":"Analisar"}</button>
        </div>
        {aiMsg?<p style={{fontSize:12,color:K.muted,lineHeight:1.8}}>{aiMsg}</p>
          :<p style={{fontSize:12,color:K.muted,fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu ciclo.</p>}
      </div>
    </div>
  );
}

function TelaAdmin({onSair}){
  const[usuarios,setUsuarios]=useState([]),[loading,setLoading]=useState(true);
  const[busca,setBusca]=useState(""),[filtro,setFiltro]=useState("todos");
  const[selecionado,setSelecionado]=useState(null);
  const PRECO=14.90;

  useEffect(()=>{
    sb.from("usuarios_controle").select("*").order("data_cadastro",{ascending:false})
      .then(({data})=>{if(data)setUsuarios(data);setLoading(false);});
  },[]);

  const salvarUsuario=async(u)=>{
    const venc=u.vitalicio?null:(u.vencimento||isoLocal(new Date(Date.now()+30*86400000)));
    const upd={ativo:u.ativo,plano:u.plano||"gratuito",vitalicio:!!u.vitalicio,vencimento:venc,observacoes:u.observacoes||""};
    await sb.from("usuarios_controle").update(upd).eq("id",u.id);
    setUsuarios(p=>p.map(x=>x.id===u.id?{...x,...upd}:x));
    setSelecionado(null);
    avisar("Salvo!");
  };

  const naoAdmin=usuarios.filter(u=>!u.admin);
  const pagantes=naoAdmin.filter(u=>u.plano==="pago"&&u.ativo&&!u.vitalicio);
  const vitaliciosN=naoAdmin.filter(u=>u.vitalicio);
  const pendentes=naoAdmin.filter(u=>!u.ativo);
  const hoje7=new Date();hoje7.setDate(hoje7.getDate()+7);
  const vencendo=naoAdmin.filter(u=>{
    if(!u.vencimento||u.vitalicio)return false;
    const v=new Date(u.vencimento+"T12:00:00");
    return v>=new Date()&&v<=hoje7;
  });

  const filtrados=naoAdmin.filter(u=>{
    const mb=(u.email||"").toLowerCase().includes(busca.toLowerCase())||(u.nome||"").toLowerCase().includes(busca.toLowerCase());

      ||(filtro==="pendentes"&&!u.ativo)
      ||(filtro==="pagantes"&&u.plano==="pago"&&!u.vitalicio&&u.ativo)
      ||(filtro==="vitalicio"&&u.vitalicio)
      ||(filtro==="gratuito"&&u.plano==="gratuito"&&!u.vitalicio&&u.ativo);
    return mb&&mf;
  });

  const PlanoTag=({u})=>{
    if(u.vitalicio)return<span style={{fontSize:12,padding:"2px 7px",borderRadius:10,background:"#7B2FBE",color:"#FFF",fontWeight:700}}>Vitalício</span>;
    if(u.plano==="pago")return<span style={{fontSize:12,padding:"2px 7px",borderRadius:10,background:"#1565C0",color:"#FFF",fontWeight:700}}>Pago</span>;

    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 20px",background:K.bg}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <p style={{fontSize:12,color:K.muted}}>Painel de controle</p>
          <h2 style={{fontSize:20,fontWeight:700,color:K.text}}>Admin</h2>
        </div>
        <button onClick={onSair} style={{fontSize:12,color:K.muted,background:"none",border:"1px solid "+K.border,borderRadius:4,padding:"6px 12px",cursor:"pointer"}}>Voltar</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        <div style={{background:K.card,border:"1px solid "+K.ok,borderRadius:6,padding:12}}>
          <p style={{fontSize:12,color:K.ok,fontWeight:700,letterSpacing:1}}>RECEITA/MÊS</p>
          <p style={{fontSize:20,fontWeight:800,color:K.ok}}>{fmtR(pagantes.length*PRECO)}</p>
          <p style={{fontSize:12,color:K.ok}}>{pagantes.length} pagantes x {fmtR(PRECO)}</p>
        </div>
        <div style={{background:K.bg,borderRadius:6,padding:12}}>
          <p style={{fontSize:12,color:K.muted,fontWeight:700,letterSpacing:1}}>TOTAL USUÁRIOS</p>
          <p style={{fontSize:20,fontWeight:800,color:K.text}}>{naoAdmin.length}</p>
          <p style={{fontSize:12,color:K.muted}}>{naoAdmin.filter(u=>u.plano==="gratuito"&&!u.vitalicio).length} gratuitos / {vitaliciosN.length} vitalícios</p>
        </div>
        <div style={{background:K.bg,borderRadius:6,padding:12}}>
          <p style={{fontSize:12,color:K.muted,fontWeight:700,letterSpacing:1}}>PENDENTES</p>
          <p style={{fontSize:20,fontWeight:800,color:pendentes.length>0?K.err:K.text}}>{pendentes.length}</p>
          <p style={{fontSize:12,color:K.muted}}>aguardando ativação</p>

                WhatsApp
              </a>
            )}
          </div>
        </div>
      ))}
      {selecionado&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.6)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:K.card,borderRadius:"16px 16px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div>
                <p style={{fontSize:16,fontWeight:700,color:K.text}}>{selecionado.nome||"Sem nome"}</p>
                <p style={{fontSize:12,color:K.muted}}>{selecionado.email}</p>
                <p style={{fontSize:12,color:K.muted}}>Cadastro: {selecionado.data_cadastro?new Date(selecionado.data_cadastro).toLocaleDateString("pt-BR"):"--"}</p>
              </div>
              <button onClick={()=>setSelecionado(null)} style={{background:"none",border:"none",color:K.muted,fontSize:22,cursor:"pointer",lineHeight:1}}>x</button>
            </div>
            <div style={{background:K.bg,borderRadius:10,padding:14,marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <p style={{fontSize:13,fontWeight:600,color:K.text}}>Acesso Vitalício</p>

                </div>
                <div onClick={()=>setSelecionado(p=>({...p,vitalicio:!p.vitalicio,plano:!p.vitalicio?"pago":p.plano}))}

                  <div style={{position:"absolute",top:3,left:selecionado.vitalicio?22:3,width:20,height:20,borderRadius:"50%",background:K.text,transition:"left .2s"}}/>
