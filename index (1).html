// ── utilidades ───────────────────────────────────────────────
function fmt(n,dec=2){if(n==null||isNaN(n))return"—";return Number(n).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function fmtR(n){return(n==null||isNaN(n))?"—":"R$ "+fmt(n);}
function parseN(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n;}
function horasDiff(h1,h2){if(!h1||!h2)return 0;const[a,b]=[h1,h2].map(h=>{const[hh,mm]=h.split(":").map(Number);return hh*60+mm;});return Math.max(0,(b-a)/60);}
function hoje(){return new Date().toISOString().slice(0,10);}
function dataFmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return`${dd}/${m}/${y}`;}
function mesAtual(){return new Date().toISOString().slice(0,7);}

const CFG0={meta_km:2.30,meta_viagem:13.20,meta_hora:39.00,parcela:0,ipva:0,seguro:0,pneu_total:1000,pneu_km:60000,revisao_km:0.30,emergencia_km:0.12,autonomia:7.0,preco_litro:4.89};

function periodoDefault(){
  // Período padrão: do dia 12 do mês anterior até o dia 11 do mês atual
  const hoje=new Date();
  const diaAtual=hoje.getDate();
  let ini,fim;
  if(diaAtual>=12){
    ini=new Date(hoje.getFullYear(),hoje.getMonth(),12);
    fim=new Date(hoje.getFullYear(),hoje.getMonth()+1,11);
  }else{
    ini=new Date(hoje.getFullYear(),hoje.getMonth()-1,12);
    fim=new Date(hoje.getFullYear(),hoje.getMonth(),11);
  }
  return{ini:ini.toISOString().slice(0,10),fim:fim.toISOString().slice(0,10)};
}

function calcMes(turnos,abast,cfg,dataIni=null,dataFim=null){
  const pd=periodoDefault();
  const ini=dataIni||pd.ini;
  const fim=dataFim||pd.fim;
  const mes=turnos.filter(t=>t.data&&t.data>=ini&&t.data<=fim);
  const dias=[...new Set(mes.map(t=>t.data))].length;
  const km_total=mes.reduce((s,t)=>s+(t.km_f-t.km_i),0);
  const hrs_total=mes.reduce((s,t)=>s+horasDiff(t.h_i,t.h_f),0);
  const bruto=mes.reduce((s,t)=>s+parseN(t.bruto)+parseN(t.bonus),0);
  const viagens=mes.reduce((s,t)=>s+parseN(t.viagens),0);
  // Combustível: usa a média real de km/L dos abastecimentos do período
  const abastP=abast.filter(a=>a.data&&a.data>=ini&&a.data<=fim);
  const mediaKmL=abastP.length>0?abastP.reduce((s,a)=>s+parseN(a.km_rod)/Math.max(1,parseN(a.litros)),0)/abastP.length:Math.max(1,parseN(cfg.autonomia));
  const precoComb=abastP.length>0?parseN([...abastP].sort((a,b)=>b.data.localeCompare(a.data))[0].preco):parseN(cfg.preco_litro);
  const comb_total=mediaKmL>0?(km_total/mediaKmL)*precoComb:0;
  const pneu_t=km_total*(parseN(cfg.pneu_total)/Math.max(1,parseN(cfg.pneu_km)));
  const rev_t=km_total*parseN(cfg.revisao_km);
  const emer_t=km_total*parseN(cfg.emergencia_km);
  // Custo fixo proporcional aos dias do período
  const diasPeriodo=Math.max(1,Math.round((new Date(fim)-new Date(ini))/(1000*60*60*24))+1);
  const fixo=(parseN(cfg.parcela)+parseN(cfg.ipva)/12+parseN(cfg.seguro)/12)*(diasPeriodo/30);
  const custos=comb_total+pneu_t+rev_t+emer_t+fixo;
  const lucro=bruto-custos;
  return{dias,km_total,hrs_total,bruto,viagens,comb_total,pneu_t,rev_t,emer_t,fixo,custos,lucro,ini,fim,
    r_km:km_total>0?bruto/km_total:0,r_via:viagens>0?bruto/viagens:0,r_hr:hrs_total>0?bruto/hrs_total:0};
}

function BarChart({data,color="#4CAF50"}){

}

            <Badge ok={l>0}>{l>0?"✓":"✗"}</Badge>
            {mostrarEditar&&<button onClick={()=>{setEditando(t);setMostrar(false);}}
              style={{fontSize:11,padding:"3px 8px",background:"#F5F5F5",border:"1px solid #DDD",borderRadius:6,cursor:"pointer",color:"#555"}}>✏️ Editar</button>}
          </div>
        </div>
        {[["KM rodado",`${k} km`],["Horário",`${t.h_i||"—"} → ${t.h_f||"—"} (${fmt(h,1)}h)`],["Viagens / Bruto",`${t.viagens} · ${fmtR(b)}`],["Lucro est.",fmtR(l)]].map(([lk,v])=>(
          <div key={lk} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0",borderTop:"1px solid #F5F5F5"}}>
            <span style={{color:"#888"}}>{lk}</span><b style={{color:lk==="Lucro est."?(l>0?"#2E7D32":"#C62828"):"#222"}}>{v}</b>
          </div>
        ))}
      </Card>
    );
  };

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>

      {/* Cards de médias */}
      {turnos.length>0&&(
        <>
          <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Suas médias gerais</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            {[["KM/dia",fmt(mediaKmDia,0)+" km"],["Bruto/dia",fmtR(mediaBrutoDia)],["Viagens/dia",fmt(mediaViagensDia,1)],["R$/km",fmtR(mediaRKm)]].map(([l,v])=>(
              <Card key={l} style={{padding:10,textAlign:"center"}}>
                <div style={{fontSize:16,fontWeight:700,color:"#1A56A0"}}>{v}</div>
                <div style={{fontSize:10,color:"#999",marginTop:2}}>{l}</div>
              </Card>
            ))}
          </div>
        </>
      )}

      {/* Botão novo turno e header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <p style={{fontSize:13,fontWeight:600}}>Hoje, {dataFmt(hoje())}</p>
        <button onClick={()=>{setMostrar(!mostrar);setEditando(null);}}
          style={{padding:"7px 14px",background:"#1A1A1A",color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>+ Turno</button>
      </div>

      {/* Form novo turno */}
      {mostrar&&<FormTurno titulo={`Novo turno — ${turnosHoje.length+1}º`}
        inicial={{data:hoje(),num:turnosHoje.length+1,km_i:"",km_f:"",h_i:"",h_f:"",bruto:"",viagens:"",bonus:"0"}}
        onSalvar={salvarNovo} onCancelar={()=>setMostrar(false)} loading={loading}/>}

      {/* Form edição */}
      {editando&&<FormTurno titulo={`Editar turno — ${editando.num}º (${dataFmt(editando.data)})`}
        inicial={{data:editando.data,num:editando.num,km_i:editando.km_i,km_f:editando.km_f,h_i:editando.h_i||"",h_f:editando.h_f||"",bruto:editando.bruto,viagens:editando.viagens,bonus:editando.bonus||"0"}}
        onSalvar={salvarEdicao} onCancelar={()=>setEditando(null)} loading={loading}/>}

      {/* Turnos de hoje */}
      {turnosHoje.length===0&&!mostrar&&!editando&&(
        <div style={{textAlign:"center",padding:"24px 20px",color:"#AAA",background:"#F9F9F9",borderRadius:10,marginBottom:14}}>
          <div style={{fontSize:32,marginBottom:8}}>📋</div>
          <p style={{fontSize:13}}>Nenhum turno hoje ainda.</p>
        </div>
      )}
      {turnosHoje.map(t=><CardTurno key={t.id} t={t}/>)}

      {/* Análise IA */}
      {turnosHoje.length>0&&(
        <div style={{background:"#F1EFE8",borderRadius:10,padding:14,marginTop:4,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:12,fontWeight:600,color:"#444"}}>✨ Análise do dia — IA</span>
            <button onClick={pedirIA} disabled={loadingAI}
              style={{padding:"5px 10px",fontSize:11,background:"#1A1A1A",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",opacity:loadingAI?0.6:1}}>
              {loadingAI?"Analisando...":"Analisar ↗"}
            </button>
          </div>
          {aiMsg?<p style={{fontSize:12,color:"#555",lineHeight:1.7}}>{aiMsg}</p>
            :<p style={{fontSize:12,color:"#888",fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu dia.</p>}
        </div>
      )}

      {/* Histórico de dias anteriores */}
      {turnosAnt.length>0&&(
        <>
          <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,margin:"16px 0 8px"}}>Histórico</p>
          {turnosAnt.map(t=><CardTurno key={t.id} t={t}/>)}
        </>
      )}
    </div>
  );
}

// ── COMBUSTÍVEL ───────────────────────────────────────────────
function TelaCombustivel({abastecimentos,cfg,userId,onAdd,onUpdate}){
  const[form,setForm]=useState({data:hoje(),tipo:"Gasolina",km_rod:"",litros:"",preco:""});
  const[mostrar,setMostrar]=useState(false);
  const[editando,setEditando]=useState(null);
  const[loading,setLoading]=useState(false);

  const kml=parseN(form.litros)>0?parseN(form.km_rod)/parseN(form.litros):0;
  const total=parseN(form.litros)*parseN(form.preco);
  const custokm=kml>0?parseN(form.preco)/kml:0;
  const media=abastecimentos.length>0?abastecimentos.reduce((s,a)=>s+parseN(a.km_rod)/Math.max(0.01,parseN(a.litros)),0)/abastecimentos.length:0;
  const totalGasto=abastecimentos.reduce((s,a)=>s+parseN(a.litros)*parseN(a.preco),0);
  const totalLitros=abastecimentos.reduce((s,a)=>s+parseN(a.litros),0);
  const mediaCustKm=media>0&&abastecimentos.length>0?(abastecimentos.reduce((s,a)=>s+parseN(a.preco),0)/abastecimentos.length)/media:0;

  const salvar=async()=>{
    if(!form.km_rod||!form.litros||!form.preco)return alert("Preencha km rodado, litros e preço.");
    setLoading(true);
    const novo={user_id:userId,data:form.data,tipo:form.tipo,km_rod:parseN(form.km_rod),litros:parseN(form.litros),preco:parseN(form.preco)};
    const{data,error}=await supabase.from("abastecimentos").insert(novo).select().single();
    if(!error){onAdd(data);setMostrar(false);setForm({data:hoje(),tipo:"Gasolina",km_rod:"",litros:"",preco:""});}
    else alert("Erro: "+error.message);
    setLoading(false);
  };

  const salvarEdicao=async()=>{
    if(!editando.km_rod||!editando.litros||!editando.preco)return alert("Preencha todos os campos.");
    setLoading(true);
    const upd={data:editando.data,tipo:editando.tipo,km_rod:parseN(editando.km_rod),litros:parseN(editando.litros),preco:parseN(editando.preco)};
    const{data,error}=await supabase.from("abastecimentos").update(upd).eq("id",editando.id).select().single();
    if(!error){onUpdate(data);setEditando(null);}
    else alert("Erro: "+error.message);
    setLoading(false);
  };

  const FormAbast=({dados,setDados,onSalvar,onCancelar,titulo})=>{
    const kmlF=parseN(dados.litros)>0?parseN(dados.km_rod)/parseN(dados.litros):0;
    const totF=parseN(dados.litros)*parseN(dados.preco);
    const ckmF=kmlF>0?parseN(dados.preco)/kmlF:0;
    return(
      <Card style={{border:"1px dashed #CCC",marginBottom:14}}>
        <p style={{fontSize:13,fontWeight:600,marginBottom:8}}>{titulo}</p>
        <Lbl>Tipo de combustível</Lbl>
        <div style={{display:"flex",border:"1px solid #DDD",borderRadius:8,overflow:"hidden",marginBottom:4}}>
          {["Gasolina","Álcool"].map(t=>(
            <button key={t} onClick={()=>setDados(f=>({...f,tipo:t}))}
              style={{flex:1,padding:10,border:"none",cursor:"pointer",fontSize:13,background:dados.tipo===t?"#1A1A1A":"#FFF",color:dados.tipo===t?"#FFF":"#555",fontWeight:dados.tipo===t?600:400}}>
              {t==="Gasolina"?"⛽ Gasolina":"🌿 Álcool"}
            </button>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Inp label="Data" type="date" value={dados.data} onChange={v=>setDados(f=>({...f,data:v}))}/>
          <Inp label="Preço/litro (R$)" type="number" value={dados.preco} onChange={v=>setDados(f=>({...f,preco:v}))} placeholder="4.89"/>
          <Inp label="Litros abastecidos" type="number" value={dados.litros} onChange={v=>setDados(f=>({...f,litros:v}))} placeholder="40.0"/>
          <Inp label="KM rodado" type="number" value={dados.km_rod} onChange={v=>setDados(f=>({...f,km_rod:v}))} placeholder="280"/>
        </div>
        {kmlF>0&&(
          <div style={{marginTop:12,background:"#E3F2FD",borderRadius:8,padding:10,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[["km/L",fmt(kmlF)],["Custo/km","R$"+fmt(ckmF,3)],["Total",fmtR(totF)]].map(([l,v])=>(
              <div key={l} style={{textAlign:"center"}}>
                <div style={{fontSize:15,fontWeight:700,color:"#1565C0"}}>{v}</div>
                <div style={{fontSize:10,color:"#666"}}>{l}</div>
              </div>
            ))}
          </div>
        )}
        <p style={{fontSize:11,color:"#999",textAlign:"center",marginTop:8,fontStyle:"italic"}}>km/L = km rodado ÷ litros abastecidos</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}>
          <Btn sec onClick={onCancelar}>Cancelar</Btn>
          <Btn onClick={onSalvar} disabled={loading}>{loading?"Salvando...":"Salvar"}</Btn>
        </div>
      </Card>
    );
  };

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontSize:12,color:"#888"}}>Controle de consumo</p>
        <button onClick={()=>{setMostrar(!mostrar);setEditando(null);}} style={{padding:"7px 14px",background:"#1A1A1A",color:"#fff",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>+ Registrar</button>
      </div>

      {/* Cards de médias */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        {[["Média km/L",fmt(media)],["Custo médio/km","R$"+fmt(mediaCustKm,3)],["Total litros",fmt(totalLitros,1)+"L"],["Total gasto",fmtR(totalGasto)]].map(([l,v])=>(
          <Card key={l} style={{padding:10,textAlign:"center"}}>
            <div style={{fontSize:15,fontWeight:700,color:"#1565C0"}}>{v}</div>
            <div style={{fontSize:10,color:"#999",marginTop:2}}>{l}</div>
          </Card>
        ))}
      </div>

      {abastecimentos.length>1&&(
        <Card style={{marginBottom:14}}>
          <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Evolução km/L</p>
          <BarChart color="#1565C0" data={[...abastecimentos].reverse().map(a=>({v:parseFloat((parseN(a.km_rod)/Math.max(0.01,parseN(a.litros))).toFixed(2)),l:dataFmt(a.data).slice(0,5)}))}/>
        </Card>
      )}

      {/* Formulário novo */}
      {mostrar&&<FormAbast titulo="Novo abastecimento" dados={form} setDados={setForm} onSalvar={salvar} onCancelar={()=>setMostrar(false)}/>}

      {/* Formulário edição */}
      {editando&&<FormAbast titulo={`Editar abastecimento — ${dataFmt(editando.data)}`} dados={editando} setDados={setEditando} onSalvar={salvarEdicao} onCancelar={()=>setEditando(null)}/>}

      <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Histórico</p>
      {abastecimentos.length===0&&<p style={{color:"#AAA",textAlign:"center",padding:24,fontSize:13}}>Nenhum abastecimento registrado.</p>}
      {abastecimentos.map(a=>{
        const kmlA=parseN(a.litros)>0?parseN(a.km_rod)/parseN(a.litros):0;
        return(
          <Card key={a.id} style={{marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:13,fontWeight:600}}>{dataFmt(a.data)}</span>
                <span style={{fontSize:11,padding:"2px 8px",borderRadius:10,border:"1px solid #EEE",color:"#666"}}>{a.tipo==="Gasolina"?"⛽":"🌿"} {a.tipo}</span>
              </div>
              <button onClick={()=>{setEditando({...a,km_rod:a.km_rod,litros:a.litros,preco:a.preco});setMostrar(false);}}
                style={{fontSize:11,padding:"3px 8px",background:"#F5F5F5",border:"1px solid #DDD",borderRadius:6,cursor:"pointer",color:"#555"}}>✏️ Editar</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr"}}>
              {[["KM rod.",a.km_rod+" km"],["Litros",fmt(a.litros)+"L"],["Total",fmtR(parseN(a.litros)*parseN(a.preco))],["km/L",fmt(kmlA)]].map(([l,v],i)=>(
                <div key={l} style={{textAlign:"center",borderRight:i<3?"1px solid #F0F0F0":"none"}}>
                  <div style={{fontSize:13,fontWeight:600,color:i===3?(kmlA>=media*0.92?"#2E7D32":"#C62828"):"#222"}}>{v}</div>
                  <div style={{fontSize:10,color:"#999"}}>{l}</div>
                </div>
              ))}
            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────
function TelaDashboard({turnos,abastecimentos,cfg}){
  const pd=periodoDefault();
  const[dataIni,setDataIni]=useState(pd.ini);
  const[dataFim,setDataFim]=useState(pd.fim);
  const[mostrarFiltro,setMostrarFiltro]=useState(false);
  const mes=calcMes(turnos,abastecimentos,cfg,dataIni,dataFim);
  const[aiMsg,setAiMsg]=useState("");
  const[loadingAI,setLoadingAI]=useState(false);

  // Divide o período em 4 partes para o gráfico
  const semanas=(()=>{
    const ini=new Date(dataIni+"T12:00:00");
    const fim=new Date(dataFim+"T12:00:00");
    const diff=Math.round((fim-ini)/(1000*60*60*24));
    const bloco=Math.ceil(diff/4);
    return[0,1,2,3].map(i=>{
      const s=new Date(ini);s.setDate(ini.getDate()+i*bloco);
      const e=new Date(ini);e.setDate(ini.getDate()+(i+1)*bloco-1);
      const sStr=s.toISOString().slice(0,10);
      const eStr=e.toISOString().slice(0,10);
      const v=turnos.filter(t=>t.data&&t.data>=sStr&&t.data<=eStr).reduce((acc,t)=>acc+parseN(t.bruto)+parseN(t.bonus),0);
      return{l:`${s.getDate()}/${s.getMonth()+1}`,v:Math.round(v)};
    });
  })();

  const pedirIA=useCallback(async()=>{
    setLoadingAI(true);
    const prompt=`Consultor financeiro de motoristas de app. Analise em português (4-5 frases). Mês: bruto R$${mes.bruto.toFixed(2)}, custos R$${mes.custos.toFixed(2)}, lucro R$${mes.lucro.toFixed(2)}, ${mes.dias} dias, ${mes.viagens} viagens, ${mes.km_total}km. R$/km:${mes.r_km.toFixed(2)}(meta:${cfg.meta_km}), R$/viagem:${mes.r_via.toFixed(2)}(meta:${cfg.meta_viagem}), R$/hora:${mes.r_hr.toFixed(2)}(meta:${cfg.meta_hora}). Dê 2 sugestões práticas.`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const d=await res.json();setAiMsg(d.content?.[0]?.text||"Não foi possível gerar análise.");
    }catch{setAiMsg("Não foi possível conectar à IA.");}
    setLoadingAI(false);
  },[mes,cfg]);

  return(
    <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>

      {/* Seletor de período */}
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <p style={{fontSize:12,color:"#888"}}>{mes.dias} dias trabalhados</p>
            <p style={{fontSize:11,color:"#1A56A0",fontWeight:600}}>{dataFmt(dataIni)} → {dataFmt(dataFim)}</p>
          </div>
          <button onClick={()=>setMostrarFiltro(!mostrarFiltro)}
            style={{padding:"6px 12px",background:mostrarFiltro?"#1A1A1A":"#F0F4FF",color:mostrarFiltro?"#fff":"#1A56A0",border:"1px solid #C5D8FF",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer"}}>
            📅 {mostrarFiltro?"Fechar":"Mudar período"}
          </button>
        </div>
        {mostrarFiltro&&(
          <div style={{marginTop:10,background:"#F0F4FF",borderRadius:10,padding:12,border:"1px solid #C5D8FF"}}>
            <p style={{fontSize:11,color:"#1A56A0",fontWeight:600,marginBottom:8}}>Selecione o período de análise</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div>
                <Lbl>Data início</Lbl>
                <input type="date" value={dataIni} onChange={e=>setDataIni(e.target.value)}
                  style={{width:"100%",border:"1px solid #C5D8FF",borderRadius:8,padding:"9px 10px",fontSize:13,background:"#fff",outline:"none",boxSizing:"border-box"}}/>
              </div>
              <div>
                <Lbl>Data fim</Lbl>
                <input type="date" value={dataFim} onChange={e=>setDataFim(e.target.value)}
                  style={{width:"100%",border:"1px solid #C5D8FF",borderRadius:8,padding:"9px 10px",fontSize:13,background:"#fff",outline:"none",boxSizing:"border-box"}}/>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:10}}>
              {[
                {l:"Este mês",i:mesAtual()+"-01",f:mesAtual()+"-31"},
                {l:"Ciclo 12",i:(()=>{const d=new Date();return d.getDate()>=12?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-12`:(()=>{const p=new Date(d.getFullYear(),d.getMonth()-1,12);return p.toISOString().slice(0,10);})();})(),f:(()=>{const d=new Date();if(d.getDate()>=12){const p=new Date(d.getFullYear(),d.getMonth()+1,11);return p.toISOString().slice(0,10);}else{return`${d.getFullYear()}-${String(d.getMonth()).padStart(2,"0")}-11`;}})()},
                {l:"Últ. 30d",i:(()=>{const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);})(),f:hoje()},
              ].map(({l,i,f})=>(
                <button key={l} onClick={()=>{setDataIni(i);setDataFim(f);setMostrarFiltro(false);}}
                  style={{padding:"7px 4px",background:"#fff",border:"1px solid #C5D8FF",borderRadius:7,fontSize:11,color:"#1A56A0",fontWeight:600,cursor:"pointer"}}>
                  {l}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <Card style={{background:mes.lucro>=0?"#F1F8E9":"#FFEBEE"}}>
          <div style={{fontSize:11,color:"#888"}}>Lucro líquido</div>
          <div style={{fontSize:24,fontWeight:800,color:mes.lucro>=0?"#2E7D32":"#C62828",marginTop:4}}>{fmtR(mes.lucro)}</div>
          <div style={{fontSize:11,color:"#999",marginTop:4}}>de {fmtR(mes.bruto)} bruto</div>
        </Card>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Card style={{padding:10}}><div style={{fontSize:10,color:"#999"}}>Dias trabalhados</div><div style={{fontSize:20,fontWeight:700}}>{mes.dias} dias</div></Card>
          <Card style={{padding:10}}><div style={{fontSize:10,color:"#999"}}>Viagens</div><div style={{fontSize:20,fontWeight:700}}>{mes.viagens}</div></Card>
          <Card style={{padding:10}}><div style={{fontSize:10,color:"#999"}}>KM rodado</div><div style={{fontSize:20,fontWeight:700}}>{mes.km_total}</div></Card>
        </div>
      </div>
      <Card style={{marginBottom:10}}>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:12}}>Eficiência (IE)</p>
        <IEBar label="R$/km" real={mes.r_km} meta={parseN(cfg.meta_km)} valor={fmtR(mes.r_km)+"/km"}/>
        <IEBar label="R$/viagem" real={mes.r_via} meta={parseN(cfg.meta_viagem)} valor={fmtR(mes.r_via)}/>
        <IEBar label="R$/hora" real={mes.r_hr} meta={parseN(cfg.meta_hora)} valor={fmtR(mes.r_hr)+"/h"}/>
      </Card>
      <Card style={{marginBottom:10}}>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Lucro por período</p>
        <BarChart data={semanas}/>
      </Card>
      <Card style={{marginBottom:10}}>
        <p style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Custos do mês</p>
        {[["Parcela do carro",parseN(cfg.parcela)],["Combustível",mes.comb_total],["Revisão e manutenção",mes.rev_t],["Pneu",mes.pneu_t],["IPVA + Seguro",parseN(cfg.ipva)/12+parseN(cfg.seguro)/12],["Reserva emergência",mes.emer_t]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"8px 0",borderBottom:"1px solid #F5F5F5"}}>
            <span style={{color:"#666"}}>{l}</span><b>{fmtR(v)}</b>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:700,paddingTop:10}}>
          <span>Total despesas</span><span style={{color:"#C62828"}}>{fmtR(mes.custos)}</span>
        </div>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        {[["Viagens/dia",mes.dias>0?fmt(mes.viagens/mes.dias,1):"—"],["Horas/dia",mes.dias>0?fmt(mes.hrs_total/mes.dias,1)+"h":"—"],["Viagens/hora",mes.hrs_total>0?fmt(mes.viagens/mes.hrs_total,2):"—"],["% combustível",mes.bruto>0?fmt(mes.comb_total/mes.bruto*100,1)+"%":"—"]].map(([l,v])=>(
          <Card key={l} style={{padding:10}}><div style={{fontSize:10,color:"#999",marginBottom:2}}>{l}</div><div style={{fontSize:18,fontWeight:700}}>{v}</div></Card>
        ))}
      </div>
      <div style={{background:"#F1EFE8",borderRadius:10,padding:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:12,fontWeight:600,color:"#444"}}>✨ Análise do mês — IA</span>
          <button onClick={pedirIA} disabled={loadingAI}
            style={{padding:"5px 10px",fontSize:11,background:"#1A1A1A",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",opacity:loadingAI?0.6:1}}>
            {loadingAI?"Analisando...":"Analisar ↗"}
          </button>
        </div>
        {aiMsg?<p style={{fontSize:12,color:"#555",lineHeight:1.8}}>{aiMsg}</p>
          :<p style={{fontSize:12,color:"#888",fontStyle:"italic"}}>Toque em "Analisar" para a IA avaliar seu mês completo.</p>}
      </div>
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(null);
  const[loading,setLoading]=useState(true);
  const[nav,setNav]=useState("dashboard");
  const[cfg,setCfg]=useState(CFG0);
  const[turnos,setTurnos]=useState([]);
  const[abast,setAbast]=useState([]);

  const carregarDados=async(uid)=>{
    setLoading(true);
    // Timeout de 8 segundos para não travar na tela de carregando
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000));
    try{
      const[{data:c},{data:t},{data:a}]=await Promise.race([
        Promise.all([
          supabase.from("configuracoes").select("*").eq("user_id",uid).single(),
          supabase.from("turnos").select("*").eq("user_id",uid).order("data",{ascending:false}).order("num",{ascending:false}),
          supabase.from("abastecimentos").select("*").eq("user_id",uid).order("data",{ascending:false}),
        ]),
        timeout
      ]);
      if(c)setCfg(c);if(t)setTurnos(t);if(a)setAbast(a);
    }catch(e){console.warn("Erro ao carregar dados:",e);}
    setLoading(false);
  };

  useEffect(()=>{
    // Timeout de segurança — se demorar mais de 6s vai para o login
    const timer=setTimeout(()=>setLoading(false),6000);
    supabase.auth.getSession().then(({data:{session}})=>{
      clearTimeout(timer);
      setSession(session);
      if(session)carregarDados(session.user.id);else setLoading(false);
    }).catch(()=>{clearTimeout(timer);setLoading(false);});
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_,session)=>{
      setSession(session);
      if(session)carregarDados(session.user.id);
    });
    return()=>subscription.unsubscribe();
  },[]);

  const sair=async()=>{await supabase.auth.signOut();setSession(null);setTurnos([]);setAbast([]);setCfg(CFG0);};

  const navItems=[{id:"dashboard",icon:"▦",label:"Dashboard"},{id:"diario",icon:"📋",label:"Diário"},{id:"combustivel",icon:"⛽",label:"Combust."},{id:"config",icon:"⚙️",label:"Config."}];

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:12}}>
      <div style={{fontSize:36}}>🚗</div>
      <p style={{color:"#888",fontSize:14,fontFamily:"Georgia,serif"}}>Carregando...</p>
    </div>
  );

  return(
    <div style={{maxWidth:480,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:"#FAFAFA",fontFamily:"Georgia,serif"}}>
      {!session?<TelaAuth onLogado={()=>{supabase.auth.getSession().then(({data:{session}})=>{if(session)carregarDados(session.user.id);});}}/>
      :<>
        <div style={{padding:"14px 16px 12px",borderBottom:"1px solid #E8E8E8",background:"#FFF",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <h1 style={{fontSize:20,fontWeight:700,color:"#111",margin:0}}>Por km</h1>
          <span style={{fontSize:13,color:"#888"}}>{navItems.find(n=>n.id===nav)?.label}</span>
          <button onClick={sair} style={{background:"none",border:"none",color:"#AAA",fontSize:12,cursor:"pointer"}}>Sair</button>
        </div>
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {nav==="dashboard"&&<TelaDashboard turnos={turnos} abastecimentos={abast} cfg={cfg}/>}
          {nav==="diario"&&<TelaDiario turnos={turnos} cfg={cfg} userId={session.user.id} onAdd={t=>setTurnos(p=>[t,...p])} onUpdate={t=>setTurnos(p=>p.map(x=>x.id===t.id?t:x))}/>}
          {nav==="combustivel"&&<TelaCombustivel abastecimentos={abast} cfg={cfg} userId={session.user.id} onAdd={a=>setAbast(p=>[a,...p])} onUpdate={a=>setAbast(p=>p.map(x=>x.id===a.id?a:x))}/>}
          {nav==="config"&&<TelaConfig cfg={cfg} userId={session.user.id} onSalvo={c=>setCfg(c)}/>}
        </div>
        <div style={{display:"flex",borderTop:"1px solid #E8E8E8",background:"#FFF",flexShrink:0}}>
          {navItems.map(n=>(
            <button key={n.id} onClick={()=>setNav(n.id)}
              style={{flex:1,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontSize:18}}>{n.icon}</span>
              <span style={{fontSize:9,color:nav===n.id?"#111":"#AAA",fontFamily:"Arial,sans-serif",fontWeight:nav===n.id?700:400}}>{n.label}</span>
            </button>
          ))}
        </div>
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
